<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放 - 櫻花动漫</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#18191c; background:#f1f2f3;
    -webkit-font-smoothing:antialiased;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; outline:none; background:none; color:inherit; }
input, textarea { font-family:inherit; outline:none; border:none; }

/* ============ 顶栏 ============ */
.bili-header {
    background:#fff; height:56px; padding:0 24px;
    display:flex; align-items:center; gap:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    position:sticky; top:0; z-index:100;
}
.bili-logo { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:bold; color:#fb7299; }
.bili-logo svg { width:28px; height:28px; }
.bili-nav { display:flex; gap:4px; }
.bili-nav a { padding:6px 12px; font-size:14px; border-radius:6px; }
.bili-nav a:hover { background:#f1f2f3; }
.bili-search { margin-left:auto; position:relative; width:320px; }
.bili-search input { width:100%; height:34px; padding:0 40px 0 14px; background:#f1f2f3; border-radius:17px; font-size:13px; }
.bili-search .search-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#9499a0; pointer-events:none; }
.bili-user { display:flex; align-items:center; gap:10px; font-size:13px; color:#61666d; }
.bili-user .avatar {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#fb7299,#fc8bab);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:14px;
}
.bili-user .username { color:#00aeec; font-weight:500; }
.bili-user .login-link { padding:6px 16px; background:#fb7299; color:#fff; border-radius:6px; font-size:13px; font-weight:500; }

/* ============ 主体 ============ */
.main-container {
    max-width:1500px; margin:16px auto; padding:0 24px;
    display:grid; grid-template-columns:minmax(0,1fr) 380px;
    gap:20px; align-items:flex-start;
}
.left-col { min-width:0; }
.video-info-head { background:#fff; border-radius:8px 8px 0 0; padding:16px 20px 12px; }
.video-title { font-size:18px; font-weight:600; line-height:1.4; margin-bottom:10px; word-break:break-word; }
.video-meta-row { display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:#9499a0; }
.video-meta-row .meta-item { display:inline-flex; align-items:center; gap:4px; }
.video-meta-row .meta-item svg { width:16px; height:16px; }
.iv-tag {
    display:inline-block; padding:2px 8px;
    background:#e5f4ff; color:#00aeec;
    border-radius:4px; font-size:12px; font-weight:bold;
    margin-right:8px; vertical-align:middle;
}

/* ============ 播放器 ============ */
.player-wrap { background:#000; position:relative; aspect-ratio:16/9; overflow:hidden; }
.player-wrap video { width:100%; height:100%; display:block; background:#000; }
.player-status {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#a0a0a0; font-size:14px; background:#000; z-index:5;
}
.player-status.hide { display:none; }
.player-status .spin {
    width:28px; height:28px;
    border:3px solid #2a2a2a; border-top-color:#fb7299;
    border-radius:50%; animation:spin 1s linear infinite; margin-right:10px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ============ 弹幕层 ============ */
.dm-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3; }
.dm-item {
    position:absolute; left:100%; white-space:nowrap;
    font-weight:bold; color:#fff;
    text-shadow:1px 1px 2px #000, 0 0 4px #000;
    will-change:transform;
}
.dm-item.scroll {
    animation:dmMove 8s linear forwards;
}
.dm-item.top, .dm-item.bottom {
    left:50%; transform:translateX(-50%);
    animation:dmStatic 4s linear forwards;
}
.dm-item.bottom { bottom:20px; top:auto !important; }
.dm-item.self {
    border:1.5px solid #00aeec;
    border-radius:4px;
    padding:0 8px;
    box-shadow:0 0 6px rgba(0,174,236,.6);
}
@keyframes dmMove {
    from { transform:translateX(0); }
    to { transform:translateX(calc(-100vw - 100%)); }
}
@keyframes dmStatic {
    0%   { opacity:0; }
    10%  { opacity:1; }
    90%  { opacity:1; }
    100% { opacity:0; }
}
.dm-toggle {
    position:absolute; right:12px; top:12px;
    background:rgba(0,0,0,.5); color:#fff;
    padding:5px 12px; border-radius:16px; font-size:12px;
    z-index:4;
}
.dm-toggle.off { opacity:.5; }

/* ============ 弹幕输入区（播放器下方，B站样式） ============ */
.dm-input-area {
    background:#fff;
    padding:12px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    border-top:1px solid #f1f2f3;
}
.dm-input-row {
    display:flex;
    gap:10px;
    align-items:center;
}
.dm-input-row input[type="text"] {
    flex:1;
    background:#f1f2f3;
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    color:#18191c;
}
.dm-input-row input[type="text"]:focus { background:#e3e5e7; }
.dm-input-row input[type="text"]::placeholder { color:#9499a0; }
.dm-input-row button.send {
    background:#fb7299; color:#fff;
    padding:9px 22px; border-radius:20px;
    font-size:13px; font-weight:600;
}
.dm-input-row button.send:hover { background:#fc8bab; }
.dm-input-row button.send:disabled { background:#e3e5e7; color:#9499a0; cursor:not-allowed; }

/* 弹幕设置行 */
.dm-settings {
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap;
    font-size:12px;
    color:#61666d;
}
.dm-settings .group {
    display:flex; gap:6px; align-items:center;
}
.dm-settings .label { color:#9499a0; }

/* 颜色选择器 */
.color-picker-wrap {
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
}
.color-dots {
    display:flex;
    gap:4px;
}
.color-dot {
    width:18px; height:18px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    transition:transform .15s, border-color .15s;
}
.color-dot:hover { transform:scale(1.15); }
.color-dot.on {
    border-color:#00aeec;
    transform:scale(1.15);
}
.color-custom {
    position:relative;
    width:22px; height:22px;
    border-radius:50%;
    cursor:pointer;
    background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    border:2px solid #e3e5e7;
    overflow:hidden;
}
.color-custom input[type="color"] {
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
    width:100%; height:100%;
}

/* 位置/字号按钮组 */
.btn-group { display:flex; gap:2px; background:#f1f2f3; border-radius:6px; padding:2px; }
.btn-group button {
    padding:4px 10px;
    font-size:12px;
    color:#61666d;
    border-radius:4px;
    transition:all .15s;
}
.btn-group button:hover { background:#e3e5e7; }
.btn-group button.on { background:#fff; color:#00aeec; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06); }

/* ============ 工具栏 ============ */
.video-toolbar { background:#fff; padding:8px 20px; display:flex; align-items:center; gap:8px; border-top:1px solid #f1f2f3; }
.toolbar-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; font-size:13px; color:#61666d;
    border-radius:6px;
}
.toolbar-btn:hover { background:#f1f2f3; }
.toolbar-btn svg { width:22px; height:22px; }
.toolbar-btn.active { color:#fb7299; }
.toolbar-btn.active svg { fill:#fb7299; }

/* ============ 简介 & 标签 ============ */
.video-desc { background:#fff; padding:16px 20px; font-size:13px; line-height:1.7; border-top:1px solid #f1f2f3; }
.video-desc.collapsed { max-height:60px; overflow:hidden; }
.video-desc .toggle-desc { color:#00aeec; cursor:pointer; font-weight:600; margin-left:6px; }
.video-tags { background:#fff; padding:8px 20px 16px; display:flex; flex-wrap:wrap; gap:8px; border-top:1px solid #f1f2f3; }
.video-tags .tag {
    padding:4px 12px; background:#f1f2f3; color:#61666d;
    border-radius:14px; font-size:12px;
}
.video-bottom-rounded { background:#fff; height:8px; border-radius:0 0 8px 8px; }

/* ============ 评论 ============ */
.comment-card { background:#fff; border-radius:8px; margin-top:16px; padding:20px 24px; }
.comment-head {
    font-size:16px; font-weight:600;
    padding-bottom:16px; border-bottom:1px solid #f1f2f3; margin-bottom:16px;
}
.comment-head .count { font-size:13px; font-weight:normal; color:#9499a0; margin-left:8px; }
.comment-input-area { display:flex; gap:12px; margin-bottom:24px; }
.comment-avatar {
    flex-shrink:0; width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg,#fb7299,#fc8bab);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:16px;
}
.comment-input-box { flex:1; }
.comment-input-box textarea {
    width:100%; padding:10px 14px;
    background:#f1f2f3; border-radius:8px;
    font-size:13px; resize:none; min-height:60px;
}
.comment-input-box .submit-row { display:flex; justify-content:flex-end; margin-top:8px; }
.comment-input-box .submit-btn {
    padding:6px 20px; border-radius:6px;
    background:#fb7299; color:#fff; font-size:13px; font-weight:600;
}
.comment-input-box .submit-btn:disabled { background:#e3e5e7; color:#9499a0; cursor:not-allowed; }
.comment-login-tip {
    padding:20px; background:#f6f7f8; border-radius:8px;
    text-align:center; color:#9499a0; font-size:13px; margin-bottom:24px;
}
.comment-login-tip a { color:#fb7299; font-weight:600; }
.comment-item { display:flex; gap:12px; padding:16px 0; border-bottom:1px solid #f6f7f8; }
.comment-item:last-child { border-bottom:none; }
.comment-item .avatar {
    flex-shrink:0; width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg,#00aeec,#0088b8);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:16px;
}
.comment-item .body { flex:1; min-width:0; }
.comment-item .head { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
.comment-item .username { font-size:13px; color:#00aeec; font-weight:600; }
.comment-item .username a { color:inherit; }
.comment-item .time { font-size:12px; color:#9499a0; }
.comment-item .content { font-size:14px; line-height:1.7; word-break:break-word; white-space:pre-wrap; }
.comment-empty, .comment-loading { text-align:center; color:#9499a0; padding:40px 0; font-size:13px; }

/* ============ 右侧栏 ============ */
.right-col { position:sticky; top:72px; }
.up-card { background:#fff; border-radius:8px; padding:16px; margin-bottom:12px; }
.up-info { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.up-avatar {
    width:48px; height:48px; border-radius:50%;
    background:linear-gradient(135deg,#00aeec,#0088b8);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:18px; font-weight:bold; flex-shrink:0;
}
.up-meta { flex:1; min-width:0; }
.up-name { font-size:14px; font-weight:600; margin-bottom:2px; }
.up-name a { color:inherit; }
.up-name a:hover { color:#00aeec; }
.up-desc { font-size:12px; color:#9499a0; }
.up-follow-btn {
    width:100%; padding:8px;
    background:#fb7299; color:#fff;
    border-radius:6px; font-size:13px; font-weight:600;
}
.pod-card { background:#fff; border-radius:8px; overflow:hidden; }
.pod-head {
    display:flex; align-items:center;
    padding:12px 16px; border-bottom:1px solid #f1f2f3;
    font-size:14px; font-weight:600;
}
.pod-head .amt { font-size:12px; font-weight:normal; color:#9499a0; margin-left:6px; }
.pod-head .tabs { margin-left:auto; display:flex; gap:4px; }
.pod-tab { padding:4px 10px; font-size:12px; border-radius:4px; cursor:pointer; }
.pod-tab.on { background:#e5f4ff; color:#00aeec; font-weight:600; }
.pod-list { max-height:560px; overflow-y:auto; padding:8px 0; }
.pod-list::-webkit-scrollbar { width:6px; }
.pod-list::-webkit-scrollbar-thumb { background:#e3e5e7; border-radius:3px; }
.ep-item {
    display:flex; align-items:center; gap:12px;
    padding:9px 16px; cursor:pointer; font-size:13px;
}
.ep-item:hover { background:#f6f7f8; }
.ep-item.on { background:#fff0f5; color:#fb7299; font-weight:600; }
.ep-item .ep-num {
    flex-shrink:0; min-width:28px; height:22px;
    padding:0 6px; background:#f1f2f3;
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#61666d;
}
.ep-item.on .ep-num { background:#fb7299; color:#fff; }
.ep-item .ep-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ep-item .playing-dot { width:6px; height:6px; background:#fb7299; border-radius:50%; }
.q-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; cursor:pointer; font-size:13px;
}
.q-item:hover { background:#f6f7f8; }
.q-item.on { background:#e5f4ff; color:#00aeec; font-weight:600; }
.q-item .q-check { color:#00aeec; }

@media (max-width:1100px) {
    .main-container { grid-template-columns:1fr; padding:0 12px; }
    .right-col { position:static; }
    .bili-search { width:200px; }
    .bili-nav { display:none; }
}
</style>
</head>

<script>
const API_BASE = 'https://api.imomoe.dpdns.org';

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}

// ============================================================
// 弹幕引擎（支持 color / position / font_size）
// ============================================================
class DanmuEngine {
    constructor(layerEl) {
        this.layer = layerEl;
        this.enabled = true;
        this.tracks = 8;
        this.trackFree = new Array(this.tracks).fill(0);
    }
    pickTrack() {
        const now = Date.now();
        for (let i = 0; i < this.tracks; i++) {
            if (this.trackFree[i] < now) {
                this.trackFree[i] = now + 8000;
                return i;
            }
        }
        let min = 0;
        for (let i = 1; i < this.tracks; i++) {
            if (this.trackFree[i] < this.trackFree[min]) min = i;
        }
        this.trackFree[min] = now + 8000;
        return min;
    }
    shoot(content, opts = {}) {
        if (!this.enabled) return;
        const color = opts.color || '#ffffff';
        const position = opts.position || 'scroll';
        const fontSize = opts.fontSize || 'medium';
        const isSelf = opts.isSelf || false;

        const el = document.createElement('div');
        el.className = 'dm-item ' + position + (isSelf ? ' self' : '');
        el.textContent = content;
        el.style.color = color;

        // 字号
        const sizeMap = { small: '14px', medium: '20px', large: '28px' };
        el.style.fontSize = sizeMap[fontSize] || '20px';

        if (position === 'scroll') {
            const track = this.pickTrack();
            el.style.top = (track * 36 + 10) + 'px';
        } else if (position === 'top') {
            el.style.top = '60px';
        } else if (position === 'bottom') {
            el.style.bottom = '60px';
        }

        this.layer.appendChild(el);
        const dur = position === 'scroll' ? 8000 : 4000;
        setTimeout(() => el.remove(), dur + 500);
    }
    clear() {
        this.layer.innerHTML = '';
        this.trackFree = new Array(this.tracks).fill(0);
    }
}

}

                        '<a class="username" href="./user.html?uid=' + user.uid + '">' + escapeHtml(user.username) + '</a>';
    } else {
        box.innerHTML = '<a class="login-link" href="./index.html">登录</a>';

}

// ============================================================
if (!animeId && !albumId && !singleId) {
    showStatus('缺少参数：?id=<animeId> 或 ?album=xxx 或 ?ac=xxx');
} else if (animeId) {
    initByAnimeId(animeId);
} else if (albumId) {
    // 兼容旧链接（用合集 ID）
    initByAnimeIdFromAlbum(albumId);
} else {
    // 兼容旧链接（用 ac 号）
    initByAcId(singleId);
}

function showStatus(text) {
    document.getElementById('playerStatus').classList.remove('hide');
    document.getElementById('statusText').textContent = text;
}
function hideStatus() {
    document.getElementById('playerStatus').classList.add('hide');
}

// 通过 animeId 加载（主流程）
async function initByAnimeId(id) {
    showStatus('加载番剧信息...');
    try {
        const res = await fetch(`${API_BASE}/api/anime/${id}`);
        const data = await res.json();
        if (!data.ok) {
            showStatus('番剧不存在：' + (data.error || '未知错误'));
            return;
        }
        currentAnime = data.anime;
        renderAnimeInfo(currentAnime);
        await loadStats(currentAnime.id);
        await loadDanmu(currentAnime.id);
        loadComments(currentAnime.id);
        await loadAndPlay(currentAnime);
    } catch (e) {
        showStatus('网络错误：' + e.message);
    }
}

// 兼容：只给了 album ID，去找对应 anime
async function initByAnimeIdFromAlbum(albumId) {
    // 直接调用 AcFun 合集接口（沿用旧逻辑）
    showStatus('加载合集...');
    try {
        const res = await fetch(`${API_BASE}/api/acfun-collection/${albumId}`);
        const data = await res.json();
        if (!data.ok) {
            showStatus('合集不存在：' + (data.error || '未知错误'));
            return;
        }
        episodeList = data.list.map(item => ({
            ac: item.ac, p: item.p, title: item.title || ('第' + item.p + '集')
        }));
        currentEpIdx = 0;
        document.getElementById('videoTitleText').textContent = urlTitle || ('合集 ' + albumId);
        document.getElementById('ivTag').textContent = '';
        renderPodList();
        await loadCurrentEpisode();
    } catch (e) {
        showStatus('网络错误：' + e.message);
    }
}

// 兼容：只给了 ac 号
async function initByAcId(ac) {
    showStatus('加载视频...');
    episodeList = [{ ac, p: 1, title: urlTitle || '视频' }];
    currentEpIdx = 0;
    document.getElementById('videoTitleText').textContent = urlTitle || '视频';
    renderPodList();
    await loadCurrentEpisode();
}

function renderAnimeInfo(anime) {
    document.getElementById('ivTag').textContent = anime.iv || ('iv' + anime.id);
    document.getElementById('videoTitleText').textContent = anime.title;
    document.title = anime.title + ' - 櫻花动漫';

    document.getElementById('upName').innerHTML = '<a href="./user.html?uid=' + anime.ownerUid + '">' + escapeHtml(anime.ownerName || '匿名') + '</a>';
    document.getElementById('upAvatar').textContent = (anime.ownerName || '匿')[0].toUpperCase();

    document.getElementById('descText').textContent = anime.description || '暂无简介';

    document.getElementById('videoTags').innerHTML =
        (anime.tags || []).map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('');

    // 选集列表（把链接里的 ac 提取出来）
    episodeList = [];
    const links = anime.links || {};
    for (const key of ['a', 'b', 'mfuns']) {
        if (!links[key]) continue;
        if (key === 'a') {
            const m = links[key].match(/acfun\.cn\/a\/aa(\d+)/);
            if (m) {
                // 是合集链接——留给 loadAndPlay 去处理
                currentAnime._collectionId = m[1];
            } else {
                const m2 = links[key].match(/acfun\.cn\/v\/ac(\d+)/);
                if (m2) episodeList.push({ ac: m2[1], p: 1, title: anime.title });
            }
        } else if (key === 'mfuns') {
            const m = links[key].match(/mfuns\.net\/video\/(\d+)/);
            if (m) episodeList.push({ mfuns: m[1], p: 1, title: anime.title });
        }
    }
    renderPodList();
}

async function loadAndPlay(anime) {
    // 优先用 AcFun 合集
    if (anime._collectionId) {
        showStatus('加载合集列表...');
        try {
            const res = await fetch(`${API_BASE}/api/acfun-collection/${anime._collectionId}`);
            const data = await res.json();
            if (data.ok && data.list && data.list.length) {
                episodeList = data.list.map(item => ({
                    ac: item.ac, p: item.p, title: item.title || ('第' + item.p + '集')
                }));
                currentEpIdx = 0;
                renderPodList();
                await loadCurrentEpisode();
                return;
            }
        } catch (e) {}
    }
    // 否则直接用第一个 ac
    if (episodeList.length > 0 && episodeList[0].ac) {
        await loadCurrentEpisode();
        return;
    }
    // 兜底：从 links 里提取单视频
    const links = anime.links || {};
    for (const k of ['a', 'b', 'mfuns']) {
        if (!links[k]) continue;
        const m = links[k].match(/acfun\.cn\/v\/ac(\d+)/);
        if (m) {
            episodeList = [{ ac: m[1], p: 1, title: anime.title }];
            currentEpIdx = 0;
            renderPodList();
            await loadCurrentEpisode();
            return;
        }
    }
    showStatus('没有可播放的源');
}

async function loadCurrentEpisode() {
    const ep = episodeList[currentEpIdx];
    if (!ep) return;

    if (!ep.ac) {
        showStatus('此集暂无可播放的 AcFun 源');
        return;
    }

    showStatus('获取视频地址...');
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
    danmuEngine.clear();

    try {
        const res = await fetch(`${API_BASE}/api/acfun/${ep.ac}?p=1`);
        const data = await res.json();
        if (!data.ok || !data.urls || !data.urls.length) {
            showStatus('获取视频失败：' + (data.error || '未知错误'));
            return;
        }

        // 更新副标题
        if (currentAnime) {
            document.getElementById('videoTitleText').textContent =
                currentAnime.title + (episodeList.length > 1 ? ' · ' + ep.title : '');
        }

        // 更新 URL
        const newUrl = new URL(location.href);
        newUrl.searchParams.set('ep', ep.p || (currentEpIdx + 1));
        history.replaceState({}, '', newUrl);

        // 高亮选集
        document.querySelectorAll('.ep-item').forEach((el, i) => {
            el.classList.toggle('on', i === currentEpIdx);
            const dot = el.querySelector('.playing-dot');
            if (dot) dot.remove();
            if (i === currentEpIdx) el.insertAdjacentHTML('beforeend', '<span class="playing-dot"></span>');
        });

        // 播视频
        playSingle(data.urls[0]);

        // 播完后 +1
        fetch(`${API_BASE}/api/view`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ animeId: currentAnime ? currentAnime.id : 0 })
        }).catch(() => {});

    } catch (e) {
        showStatus('网络错误：' + e.message);
    }
}

function playSingle(quality) {
    if (!quality || !quality.url) {
        showStatus('无可用清晰度');
        return;
    }
    const directUrl = quality.url;
    const isM3u8 = quality.url.includes('.m3u8');

    if (hls) { hls.destroy(); hls = null; }

    if (isM3u8 && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(directUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            hideStatus();
            video.play().catch(() => {});
            lastDanmuTime = 0;
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            console.error('HLS 错误：', data);
            if (data.fatal) showStatus('播放错误：' + (data.details || '未知'));
        });
    } else {
        video.src = directUrl;
        video.play().catch(() => {});
        hideStatus();
    }
}

function renderPodList() {
    const list = document.getElementById('podList');
    const amt = document.getElementById('podAmt');
    amt.textContent = '（' + (currentEpIdx + 1) + '/' + episodeList.length + '）';
    if (episodeList.length <= 1) {
        list.innerHTML = '<div class="comment-loading" style="padding:20px 0;font-size:12px;">单个视频</div>';
        return;
    }
    list.innerHTML = episodeList.map((ep, idx) =>
        '<div class="ep-item' + (idx === currentEpIdx ? ' on' : '') + '" data-idx="' + idx + '">' +
            '<span class="ep-num">' + (idx + 1) + '</span>' +
            '<span class="ep-title">' + escapeHtml(ep.title) + '</span>' +
            (idx === currentEpIdx ? '<span class="playing-dot"></span>' : '') +
        '</div>'
    ).join('');
    list.querySelectorAll('.ep-item').forEach(el => {
        el.onclick = () => {
            currentEpIdx = parseInt(el.dataset.idx);
            renderPodList();
            loadCurrentEpisode();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    });
}

// 加载弹幕
async function loadDanmu(animeId) {
    danmuList = [];
    lastDanmuTime = 0;
    try {
        const res = await fetch(`${API_BASE}/api/danmu/${animeId}`);
        const data = await res.json();
        if (Array.isArray(data)) {
            danmuList = data.map(d => ({
                time: parseFloat(d.time_in_video) || 0,
                content: d.content,
                username: d.username || '匿名',
                color: d.color || '#ffffff',
                position: d.position || 'scroll',
                fontSize: d.font_size || 'medium'
            }));
        }
    } catch (e) {}
}

video.addEventListener('timeupdate', () => {
    const now = video.currentTime;
    if (now < lastDanmuTime || now - lastDanmuTime > 2) {
        lastDanmuTime = now;
        return;
    }
    const user = getCurrentUser();
    danmuList.forEach(d => {
        if (d.time > lastDanmuTime && d.time <= now) {
            danmuEngine.shoot(d.content, {
                color: d.color,
                position: d.position,
                fontSize: d.fontSize,
                isSelf: user && user.username === d.username
            });
        }
    });
    lastDanmuTime = now;
});

// 发送弹幕
document.getElementById('dmSend').onclick = sendDanmu;
document.getElementById('dmInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendDanmu();
});

async function sendDanmu() {
    const input = document.getElementById('dmInput');
    const content = input.value.trim();
    if (!content) return;

    const user = getCurrentUser();
    if (!user) { alert('请先登录'); location.href = './index.html'; return; }
    if (!currentAnime) { alert('番剧信息未加载'); return; }

    const btn = document.getElementById('dmSend');
    btn.disabled = true;
    btn.textContent = '发送中';
    try {
        const res = await fetch(`${API_BASE}/api/danmu`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + user.token
            },
            body: JSON.stringify({
                animeId: currentAnime.id,
                content,
                timeInVideo: video.currentTime,
                color: sendColor,
                position: sendPosition,
                fontSize: sendFontSize
            })
        });
        const data = await res.json();
        if (data.ok) {
            input.value = '';
            // 立即显示
            danmuEngine.shoot(content, {
                color: sendColor,
                position: sendPosition,
                fontSize: sendFontSize,
                isSelf: true
            });
            danmuList.push({
                time: video.currentTime,
                content,
                username: user.username,
                color: sendColor,
                position: sendPosition,
                fontSize: sendFontSize
            });
        } else {
            alert(data.error || '发送失败');
        }
    } catch (e) {
        alert('网络错误：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '发送';
    }
}

document.getElementById('dmToggle').onclick = function () {
    danmuEngine.enabled = !danmuEngine.enabled;
    this.textContent = danmuEngine.enabled ? '弹幕 开' : '弹幕 关';
    this.classList.toggle('off', !danmuEngine.enabled);
    if (!danmuEngine.enabled) danmuEngine.clear();
};

// 评论
async function loadComments(animeId) {
    const list = document.getElementById('commentList');
    const count = document.getElementById('commentCount');
    list.innerHTML = '<div class="comment-loading">加载中...</div>';
    renderCommentInput();

    try {
        const res = await fetch(`${API_BASE}/api/comments/${animeId}`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
            list.innerHTML = '<div class="comment-empty">还没有评论，来抢沙发~</div>';
            count.textContent = '0';
            return;
        }
        count.textContent = data.length;
        list.innerHTML = data.map(c => renderCommentItem(c)).join('');
    } catch (e) {
        list.innerHTML = '<div class="comment-empty">加载失败</div>';
    }
}

function renderCommentItem(c) {
    const timeStr = formatTime(c.created_at);
    const avatar = (c.username || '匿')[0].toUpperCase();
    const uid = c.uid || 0;
    return '<div class="comment-item">' +
        '<div class="avatar">' + avatar + '</div>' +
        '<div class="body">' +
            '<div class="head">' +
                '<span class="username"><a href="./user.html?uid=' + uid + '">' + escapeHtml(c.username || '匿名') + '</a></span>' +
                '<span class="time">' + timeStr + '</span>' +
            '</div>' +
            '<div class="content">' + escapeHtml(c.content) + '</div>' +
        '</div>' +
    '</div>';
}

function renderCommentInput() {
    const wrap = document.getElementById('commentInputWrap');
    const user = getCurrentUser();
    if (!user) {
        wrap.innerHTML = '<div class="comment-login-tip">请先 <a href="./index.html">登录</a> 后发表评论</div>';
        return;
    }
    wrap.innerHTML =
        '<div class="comment-input-area">' +
            '<div class="comment-avatar">' + escapeHtml(user.username[0].toUpperCase()) + '</div>' +
            '<div class="comment-input-box">' +
                '<textarea id="commentInput" placeholder="发一条友善的评论"></textarea>' +
                '<div class="submit-row"><button class="submit-btn" id="commentSend">发布</button></div>' +
            '</div>' +
        '</div>';
    document.getElementById('commentSend').onclick = sendComment;
}

async function sendComment() {
    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    if (!content) return;
    const user = getCurrentUser();
    if (!user) { alert('请先登录'); return; }
    if (!currentAnime) return;

    const btn = document.getElementById('commentSend');
    btn.disabled = true;
    btn.textContent = '发布中';
    try {
        const res = await fetch(`${API_BASE}/api/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user.token },
            body: JSON.stringify({ animeId: currentAnime.id, content })
        });
        const data = await res.json();
        if (data.ok) {
            input.value = '';
            loadComments(currentAnime.id);
        } else {
            alert(data.error || '发送失败');
        }
    } catch (e) {
        alert('网络错误：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '发布';
    }
}

function formatTime(str) {
    if (!str) return '';
    const d = new Date(str.replace(' ', 'T') + 'Z');
    if (isNaN(d.getTime())) return str;
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// 自动连播
video.onended = () => {
    if (currentEpIdx < episodeList.length - 1) {
        currentEpIdx++;
        renderPodList();
        loadCurrentEpisode();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
};

document.getElementById('favBtn').onclick = function () {
    this.classList.toggle('active');
    this.querySelector('span').textContent = this.classList.contains('active') ? '已收藏' : '收藏';
};
document.getElementById('shareBtn').onclick = function () {
    const url = location.href;
    if (navigator.share) {
        navigator.share({ title: document.title, url }).catch(() => {});
    } else {
        navigator.clipboard?.writeText(url);
        alert('链接已复制');
    }
};

document.getElementById('toggleDesc').onclick = function () {
    const desc = document.getElementById('videoDesc');
    const expanded = !desc.classList.contains('collapsed');
    desc.classList.toggle('collapsed');
    this.textContent = expanded ? '展开更多' : '收起';
};
</script>

</body>
</html>
