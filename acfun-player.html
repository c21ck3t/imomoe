<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放 - 櫻花动漫</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#18191c; background:#f1f2f3;
    -webkit-font-smoothing:antialiased;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; outline:none; background:none; color:inherit; }
input, textarea { font-family:inherit; outline:none; border:none; }

.bili-header {
    background:#fff; height:56px; padding:0 24px;
    display:flex; align-items:center; gap:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    position:sticky; top:0; z-index:100;
}
.bili-logo {
    display:flex; align-items:center; gap:8px;
    font-size:18px; font-weight:bold; color:#fb7299;
}
.bili-logo svg { width:28px; height:28px; }
.bili-nav { display:flex; gap:4px; }
.bili-nav a { padding:6px 12px; font-size:14px; border-radius:6px; }
.bili-nav a:hover { background:#f1f2f3; }
.bili-search { margin-left:auto; position:relative; width:320px; }
.bili-search input {
    width:100%; height:34px; padding:0 40px 0 14px;
    background:#f1f2f3; border-radius:17px; font-size:13px;
}
.bili-search .search-icon {
    position:absolute; right:14px; top:50%;
    transform:translateY(-50%); color:#9499a0; pointer-events:none;
}
.bili-user { display:flex; align-items:center; gap:10px; font-size:13px; color:#61666d; }
.bili-user .avatar {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#fb7299,#fc8bab);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:14px;
}
.bili-user .username { color:#00aeec; font-weight:500; }
.bili-user .login-link {
    padding:6px 16px; background:#fb7299; color:#fff;
    border-radius:6px; font-size:13px; font-weight:500;
}

.main-container {
    max-width:1500px; margin:16px auto; padding:0 24px;
    display:grid; grid-template-columns:minmax(0,1fr) 380px;
    gap:20px; align-items:flex-start;
}
.left-col { min-width:0; }
.video-info-head {
    background:#fff; border-radius:8px 8px 0 0;
    padding:16px 20px 12px;
}
.video-title {
    font-size:18px; font-weight:600; line-height:1.4;
    margin-bottom:10px; word-break:break-word;
}
.video-meta-row {
    display:flex; flex-wrap:wrap; gap:16px;
    font-size:13px; color:#9499a0;
}
.video-meta-row .meta-item { display:inline-flex; align-items:center; gap:4px; }
.video-meta-row .meta-item svg { width:16px; height:16px; }

.player-wrap {
    background:#000; position:relative;
    aspect-ratio:16/9; overflow:hidden;
}
.player-wrap video { width:100%; height:100%; display:block; background:#000; }
.player-status {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#a0a0a0; font-size:14px; background:#000; z-index:5;
}
.player-status.hide { display:none; }
.player-status .spin {
    width:28px; height:28px;
    border:3px solid #2a2a2a; border-top-color:#fb7299;
    border-radius:50%; animation:spin 1s linear infinite; margin-right:10px;
}
@keyframes spin { to { transform:rotate(360deg); } }

.dm-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3; }
.dm-item {
    position:absolute; left:100%; white-space:nowrap;
    font-size:20px; font-weight:bold; color:#fff;
    text-shadow:1px 1px 2px #000, 0 0 4px #000;
    will-change:transform;
    animation:dmMove 8s linear forwards;
}
.dm-item.self {
    color:#fff; border:1.5px solid #00aeec;
    border-radius:4px; padding:0 8px;
    box-shadow:0 0 6px rgba(0,174,236,.6);
}
@keyframes dmMove {
    from { transform:translateX(0); }
    to { transform:translateX(calc(-100vw - 100%)); }
}
.dm-toggle {
    position:absolute; right:12px; top:12px;
    background:rgba(0,0,0,.5); color:#fff;
    padding:5px 12px; border-radius:16px; font-size:12px;
    z-index:4;
}
.dm-toggle.off { opacity:.5; }

/* ============ 弹幕输入条（放到播放器下方） ============ */
.dm-input-row {
    background:#fff;
    padding:10px 20px;
    display:flex;
    gap:10px;
    border-top:1px solid #f1f2f3;
}
.dm-input-row input {
    flex:1;
    background:#f1f2f3;
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    color:#18191c;
    transition:background .2s;
}
.dm-input-row input::placeholder { color:#9499a0; }
.dm-input-row input:focus { background:#e3e5e7; }
.dm-input-row button {
    background:#fb7299; color:#fff;
    padding:9px 22px; border-radius:20px;
    font-size:13px; font-weight:600;
    transition:background .2s;
}
.dm-input-row button:hover { background:#fc8bab; }
.dm-input-row button:disabled { background:#e3e5e7; color:#9499a0; cursor:not-allowed; }

.video-toolbar {
    background:#fff; padding:8px 20px;
    display:flex; align-items:center; gap:8px;
    border-top:1px solid #f1f2f3;
}
.toolbar-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; font-size:13px; color:#61666d;
    border-radius:6px;
}
.toolbar-btn:hover { background:#f1f2f3; }
.toolbar-btn svg { width:22px; height:22px; }
.toolbar-btn.active { color:#fb7299; }
.toolbar-btn.active svg { fill:#fb7299; }

.video-desc {
    background:#fff; padding:16px 20px;
    font-size:13px; line-height:1.7;
    border-top:1px solid #f1f2f3;
}
.video-desc.collapsed { max-height:60px; overflow:hidden; }
.video-desc .toggle-desc {
    color:#00aeec; cursor:pointer; font-weight:600; margin-left:6px;
}
.video-tags {
    background:#fff; padding:8px 20px 16px;
    display:flex; flex-wrap:wrap; gap:8px;
    border-top:1px solid #f1f2f3;
}
.video-tags .tag {
    padding:4px 12px; background:#f1f2f3;
    color:#61666d; border-radius:14px; font-size:12px;
}
.video-bottom-rounded { background:#fff; height:8px; border-radius:0 0 8px 8px; }

.comment-card {
    background:#fff; border-radius:8px;
    margin-top:16px; padding:20px 24px;
}
.comment-head {
    font-size:16px; font-weight:600;
    padding-bottom:16px;
    border-bottom:1px solid #f1f2f3;
    margin-bottom:16px;
}
.comment-head .count { font-size:13px; font-weight:normal; color:#9499a0; margin-left:8px; }
.comment-input-area { display:flex; gap:12px; margin-bottom:24px; }
.comment-avatar {
    flex-shrink:0; width:40px; height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,#fb7299,#fc8bab);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:16px;
}
.comment-input-box { flex:1; }
.comment-input-box textarea {
    width:100%; padding:10px 14px;
    background:#f1f2f3; border-radius:8px;
    font-size:13px; resize:none; min-height:60px;
}
.comment-input-box .submit-row { display:flex; justify-content:flex-end; margin-top:8px; }
.comment-input-box .submit-btn {
    padding:6px 20px; border-radius:6px;
    background:#fb7299; color:#fff;
    font-size:13px; font-weight:600;
}
.comment-input-box .submit-btn:disabled { background:#e3e5e7; color:#9499a0; cursor:not-allowed; }
.comment-login-tip {
    padding:20px; background:#f6f7f8;
    border-radius:8px; text-align:center;
    color:#9499a0; font-size:13px; margin-bottom:24px;
}
.comment-login-tip a { color:#fb7299; font-weight:600; }
.comment-item { display:flex; gap:12px; padding:16px 0; border-bottom:1px solid #f6f7f8; }
.comment-item:last-child { border-bottom:none; }
.comment-item .avatar {
    flex-shrink:0; width:40px; height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,#00aeec,#0088b8);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:16px;
}
.comment-item .body { flex:1; min-width:0; }
.comment-item .head { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
.comment-item .username { font-size:13px; color:#00aeec; font-weight:600; }
.comment-item .time { font-size:12px; color:#9499a0; }
.comment-item .content {
    font-size:14px; line-height:1.7;
    word-break:break-word; white-space:pre-wrap;
}
.comment-empty, .comment-loading {
    text-align:center; color:#9499a0;
    padding:40px 0; font-size:13px;
}

.right-col { position:sticky; top:72px; }
.up-card { background:#fff; border-radius:8px; padding:16px; margin-bottom:12px; }
.up-info { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.up-avatar {
    width:48px; height:48px; border-radius:50%;
    background:linear-gradient(135deg,#00aeec,#0088b8);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:18px; font-weight:bold; flex-shrink:0;
}
.up-meta { flex:1; min-width:0; }
.up-name { font-size:14px; font-weight:600; margin-bottom:2px; }
.up-desc { font-size:12px; color:#9499a0; }
.up-follow-btn {
    width:100%; padding:8px;
    background:#fb7299; color:#fff;
    border-radius:6px; font-size:13px; font-weight:600;
}
.pod-card { background:#fff; border-radius:8px; overflow:hidden; }
.pod-head {
    display:flex; align-items:center;
    padding:12px 16px;
    border-bottom:1px solid #f1f2f3;
    font-size:14px; font-weight:600;
}
.pod-head .amt { font-size:12px; font-weight:normal; color:#9499a0; margin-left:6px; }
.pod-head .tabs { margin-left:auto; display:flex; gap:4px; }
.pod-tab {
    padding:4px 10px; font-size:12px;
    border-radius:4px; cursor:pointer;
}
.pod-tab.on { background:#e5f4ff; color:#00aeec; font-weight:600; }
.pod-list { max-height:560px; overflow-y:auto; padding:8px 0; }
.pod-list::-webkit-scrollbar { width:6px; }
.pod-list::-webkit-scrollbar-thumb { background:#e3e5e7; border-radius:3px; }
.ep-item {
    display:flex; align-items:center; gap:12px;
    padding:9px 16px; cursor:pointer; font-size:13px;
}
.ep-item:hover { background:#f6f7f8; }
.ep-item.on { background:#fff0f5; color:#fb7299; font-weight:600; }
.ep-item .ep-num {
    flex-shrink:0; min-width:28px; height:22px;
    padding:0 6px; background:#f1f2f3;
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#61666d;
}
.ep-item.on .ep-num { background:#fb7299; color:#fff; }
.ep-item .ep-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ep-item .playing-dot { width:6px; height:6px; background:#fb7299; border-radius:50%; }
.q-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; cursor:pointer; font-size:13px;
}
.q-item:hover { background:#f6f7f8; }
.q-item.on { background:#e5f4ff; color:#00aeec; font-weight:600; }
.q-item .q-check { color:#00aeec; }

@media (max-width:1100px) {
    .main-container { grid-template-columns:1fr; padding:0 12px; }
    .right-col { position:static; }
    .bili-search { width:200px; }
    .bili-nav { display:none; }
}
</style>
</head>

    <a class="bili-logo" href="./index.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l7 4.5-7 4.5z"/></svg>

<div class="main-container">

            <div class="video-meta-row" id="videoMeta"></div>

        <div class="player-wrap">

            <div class="dm-layer" id="dmLayer"></div>
            <div class="player-status" id="playerStatus">

        <div class="video-desc collapsed" id="videoDesc">

<script>
const API_BASE = 'https://api.imomoe.dpdns.org';

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}

class DanmuEngine {
    constructor(layerEl) {
        this.layer = layerEl;
        this.enabled = true;
        this.tracks = 6;
        this.trackFree = new Array(6).fill(0);
    }
    pickTrack() {
        const now = Date.now();
        for (let i = 0; i < this.tracks; i++) {
            if (this.trackFree[i] < now) {
                this.trackFree[i] = now + 8000;
                return i;
            }
        }
        let min = 0;
        for (let i = 1; i < this.tracks; i++) {
            if (this.trackFree[i] < this.trackFree[min]) min = i;
        }
        this.trackFree[min] = now + 8000;
        return min;
    }
    shoot(text, isSelf = false) {
        if (!this.enabled) return;
        const track = this.pickTrack();
        const el = document.createElement('div');
        el.className = 'dm-item' + (isSelf ? ' self' : '');
        el.textContent = text;
        el.style.top = (track * 40 + 10) + 'px';
        this.layer.appendChild(el);
        setTimeout(() => el.remove(), 8500);
    }
    clear() {
        this.layer.innerHTML = '';
        this.trackFree = new Array(this.tracks).fill(0);
    }
}

const params = new URLSearchParams(location.search);
const albumId = params.get('album');
const singleId = params.get('id');
const urlTitle = params.get('title') || '';
let currentP = parseInt(params.get('p')) || 1;

let hls = null;
let playlist = [];
let currentIndex = 0;
let danmuEngine = null;
let danmuList = [];
let lastDanmuTime = 0;
let currentVideoKey = '';
let qualityOptions = [];
let currentQualityIdx = 0;

const video = document.getElementById('video');
const dmLayer = document.getElementById('dmLayer');
danmuEngine = new DanmuEngine(dmLayer);

function getCurrentUser() {
    try {
        const raw = localStorage.getItem('imomoe_user');
        return raw ? JSON.parse(raw) : null;
    } catch { return null; }
}

function renderUser() {
    const user = getCurrentUser();
    const box = document.getElementById('biliUser');
    if (user) {
        box.innerHTML = '<div class="avatar">' + escapeHtml(user.username[0].toUpperCase()) + '</div>' +
                        '<span class="username">' + escapeHtml(user.username) + '</span>';
    } else {
        box.innerHTML = '<a class="login-link" href="./index.html">登录</a>';
    }
}
renderUser();

document.getElementById('topSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        const kw = e.target.value.trim();
        if (kw) location.href = './index.html#search=' + encodeURIComponent(kw);
    }
});

if (!albumId && !singleId) {
    showStatus('缺少参数：?album=xxx 或 ?id=xxx');
} else if (albumId) {
    document.title = (urlTitle || '合集') + ' - 櫻花动漫';
    initCollection(albumId);
} else {
    document.title = (urlTitle || '视频') + ' - 櫻花动漫';
    initSingle(singleId);
}

function showStatus(text) {
    document.getElementById('playerStatus').classList.remove('hide');
    document.getElementById('statusText').textContent = text;
}
function hideStatus() {
    document.getElementById('playerStatus').classList.add('hide');
}

async function initCollection(albumId) {
    showStatus('加载合集列表...');
    try {
        const res = await fetch(`${API_BASE}/api/acfun-collection/${albumId}`);
        const data = await res.json();
        if (!data.ok || !data.list || !data.list.length) {
            showStatus('合集加载失败：' + (data.error || '未知错误'));
            return;
        }
        playlist = data.list.map(item => ({
            ac: item.ac, p: item.p, title: item.title || ('第' + item.p + '集')
        }));
        currentIndex = Math.max(0, Math.min(currentP - 1, playlist.length - 1));
        renderPodList();
        loadCurrent();
    } catch (e) {
        showStatus('网络错误：' + e.message);
    }
}

async function initSingle(videoId) {
    playlist = [{ ac: videoId, p: 1, title: urlTitle || '视频' }];
    currentIndex = 0;
    renderPodList();
    loadCurrent();
}

async function loadCurrent() {
    const item = playlist[currentIndex];
    if (!item) return;

    showStatus('获取视频地址...');
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
    danmuEngine.clear();

    currentVideoKey = albumId ? `album_${albumId}_ep${item.p}` : `ac_${item.ac}`;
    document.getElementById('videoTitle').textContent = item.title;

    try {
        const res = await fetch(`${API_BASE}/api/acfun/${item.ac}?p=1`);
        const data = await res.json();
        if (!data.ok || !data.urls || !data.urls.length) {
            showStatus('获取视频失败：' + (data.error || '未知错误'));
            return;
        }

        qualityOptions = sortQualities(data.urls);
        currentQualityIdx = 0;
        const pages = data.pages || [];

        document.getElementById('videoMeta').innerHTML =
            '<span class="meta-item">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>' +
                (item.p * 12300 + 45600).toLocaleString() +
            '</span>' +
            '<span class="meta-item">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
                (danmuList.length || Math.floor(Math.random() * 500 + 100)) +
            '</span>' +
            '<span class="meta-item">' + new Date().toLocaleDateString('zh-CN') + '</span>' +
            (pages.length > 1 ? '<span class="meta-item">' + pages.length + ' 个分P · 无缝连播</span>' : '');

        document.getElementById('descText').textContent =
            '【' + item.title + '】本视频由櫻花动漫聚合整理，如涉及版权问题请联系删除。';

        document.getElementById('videoTags').innerHTML =
            ['番剧', '动画', 'AcFun', '在线观看', '全集'].map(t => '<span class="tag">' + t + '</span>').join('');

        const newUrl = new URL(location.href);
        newUrl.searchParams.set('p', item.p);
        history.replaceState({}, '', newUrl);

        document.querySelectorAll('.ep-item').forEach((el, i) => {
            el.classList.toggle('on', i === currentIndex);
            const dot = el.querySelector('.playing-dot');
            if (dot) dot.remove();
            if (i === currentIndex) el.insertAdjacentHTML('beforeend', '<span class="playing-dot"></span>');
        });

        loadDanmu(currentVideoKey);
        loadComments(currentVideoKey);

        // 关键：多P走前端合并，单P走直连
        if (pages.length > 1) {
            await playMerged(item, pages);
        } else {
            playSingle(qualityOptions[0]);
        }

    } catch (e) {
        showStatus('网络错误：' + e.message);
    }
}

function sortQualities(urls) {
    function lv(q) {
        const s = (q || '').toLowerCase();
        if (s.includes('2160') || s.includes('4k')) return 200;
        if (s.includes('1080')) return 100;
        if (s.includes('720')) return 80;
        if (s.includes('540')) return 60;
        if (s.includes('480')) return 50;
        if (s.includes('360')) return 40;
        return 55;
    }
    const sorted = urls.map(u => ({ ...u, level: lv(u.quality) })).sort((a, b) => b.level - a.level);
    const out = [];
    const seen = new Set();
    for (const it of sorted) {
        const name = it.quality || '默认';
        if (!seen.has(name)) { seen.add(name); out.push(it); }
    }
    return out;
}

// ============================================================
// 单P：直连播放
// ============================================================
function playSingle(quality) {
    if (!quality || !quality.url) {
        showStatus('无可用清晰度');
        return;
    }
    const directUrl = quality.url;
    const isM3u8 = quality.url.includes('.m3u8');

    if (hls) { hls.destroy(); hls = null; }

    if (isM3u8 && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(directUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            hideStatus();
            video.play().catch(() => {});
            lastDanmuTime = 0;
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            console.error('HLS 错误：', data);
            if (data.fatal) showStatus('播放错误：' + (data.details || '未知'));
        });
    } else {
        video.src = directUrl;
        video.play().catch(() => {});
        hideStatus();
    }
}

// ============================================================
// 多P：前端拉取所有分P的 m3u8，拼接成一个大 m3u8
// 分片地址保持 AcFun 原样 → 浏览器直连 AcFun，不走 Worker
// ============================================================
async function playMerged(item, pages) {
    showStatus('合并分P中...（' + pages.length + ' 个分P）');

    const quality = qualityOptions[currentQualityIdx];
    const qualityKeyword = extractQualityKeyword(quality.quality);

    let merged = '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-PLAYLIST-TYPE:VOD\n';
    let hasContent = false;
    let maxDur = 0;

    for (const pg of pages) {
        try {
            // 拿这个分P的播放地址
            const res = await fetch(`${API_BASE}/api/acfun/${item.ac}?p=${pg.p}`);
            const data = await res.json();
            if (!data.ok || !data.urls) continue;

            // 从分P的 URL 里选对应清晰度
            const targetUrls = sortQualities(data.urls);
            const target = targetUrls.find(u => u.quality.includes(qualityKeyword)) || targetUrls[0];
            if (!target) continue;

            // 直接 fetch AcFun 的 m3u8 文本
            const m3u8Res = await fetch(target.url);
            if (!m3u8Res.ok) {
                console.warn('P' + pg.p + ' m3u8 拉取失败：', m3u8Res.status);
                continue;
            }
            const m3u8Text = await m3u8Res.text();

            const baseUrl = target.url.substring(0, target.url.lastIndexOf('/') + 1);
            const targetOrigin = new URL(target.url).origin;

            let expectUrl = false;
            for (const line of m3u8Text.split('\n')) {
                const trimmed = line.trim();
                if (!trimmed) continue;

                if (trimmed.startsWith('#EXTINF')) {
                    const m = trimmed.match(/#EXTINF:([\d.]+)/);
                    if (m) maxDur = Math.max(maxDur, parseFloat(m[1]));
                    merged += trimmed + '\n';
                    expectUrl = true;
                } else if (expectUrl && !trimmed.startsWith('#')) {
                    let u = trimmed;
                    if (!u.startsWith('http')) {
                        u = u.startsWith('/') ? targetOrigin + u : baseUrl + u;
                    }
                    merged += u + '\n';
                    hasContent = true;
                    expectUrl = false;
                }
            }

            merged += '#EXT-X-DISCONTINUITY\n';
        } catch (e) {
            console.warn('P' + pg.p + ' 合并失败：', e.message);
        }
    }

    if (!hasContent) {
        // 合并失败，回退到单P
        console.warn('合并失败，回退到单P');
        playSingle(qualityOptions[0]);
        return;
    }

    merged += '#EXT-X-ENDLIST\n';
    merged = merged.replace(
        '#EXT-X-PLAYLIST-TYPE:VOD\n',
        '#EXT-X-PLAYLIST-TYPE:VOD\n#EXT-X-TARGETDURATION:' + Math.ceil(maxDur || 10) + '\n'
    );

    const blob = new Blob([merged], { type: 'application/vnd.apple.mpegurl' });
    const blobUrl = URL.createObjectURL(blob);

    if (hls) { hls.destroy(); hls = null; }
    hls = new Hls({ enableWorker: true });
    hls.loadSource(blobUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
        hideStatus();
        video.play().catch(() => {});
        lastDanmuTime = 0;
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
        console.error('HLS 错误：', data);
        if (data.fatal) showStatus('播放错误：' + (data.details || '未知'));
    });
}

function extractQualityKeyword(q) {
    if (!q) return '1080';
    const m = q.match(/\d+/);
    return m ? m[0] : '1080';
}

let podTab = 'eps';
document.querySelectorAll('.pod-tab').forEach(tab => {
    tab.onclick = () => {
        document.querySelectorAll('.pod-tab').forEach(t => t.classList.remove('on'));
        tab.classList.add('on');
        podTab = tab.dataset.tab;
        renderPodList();
    };
});

function renderPodList() {
    const list = document.getElementById('podList');
    const amt = document.getElementById('podAmt');

    if (podTab === 'eps') {
        amt.textContent = '（' + (currentIndex + 1) + '/' + playlist.length + '）';
        if (playlist.length <= 1) {
            list.innerHTML = '<div class="comment-loading" style="padding:20px 0;font-size:12px;">单个视频</div>';
            return;
        }
        list.innerHTML = playlist.map((item, idx) =>
            '<div class="ep-item' + (idx === currentIndex ? ' on' : '') + '" data-idx="' + idx + '">' +
                '<span class="ep-num">' + (idx + 1) + '</span>' +
                '<span class="ep-title">' + escapeHtml(item.title) + '</span>' +
                (idx === currentIndex ? '<span class="playing-dot"></span>' : '') +
            '</div>'
        ).join('');
        list.querySelectorAll('.ep-item').forEach(el => {
            el.onclick = () => {
                currentIndex = parseInt(el.dataset.idx);
                renderPodList();
                loadCurrent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
        });
    } else {
        amt.textContent = '';
        if (qualityOptions.length <= 1) {
            list.innerHTML = '<div class="comment-loading" style="padding:20px 0;font-size:12px;">仅一个清晰度</div>';
            return;
        }
        list.innerHTML = qualityOptions.map((q, i) =>
            '<div class="q-item' + (i === currentQualityIdx ? ' on' : '') + '" data-idx="' + i + '">' +
                '<span>' + escapeHtml(q.quality || '默认') + '</span>' +
                (i === currentQualityIdx ? '<span class="q-check">✓</span>' : '') +
            '</div>'
        ).join('');
        list.querySelectorAll('.q-item').forEach(el => {
            el.onclick = () => {
                const i = parseInt(el.dataset.idx);
                currentQualityIdx = i;
                list.querySelectorAll('.q-item').forEach(x => {
                    x.classList.remove('on');
                    const c = x.querySelector('.q-check'); if (c) c.remove();
                });
                el.classList.add('on');
                el.insertAdjacentHTML('beforeend', '<span class="q-check">✓</span>');
                // 重新加载（会重新合并）
                loadCurrent();
            };
        });
    }
}

async function loadDanmu(videoKey) {
    danmuList = [];
    lastDanmuTime = 0;
    try {
        const res = await fetch(`${API_BASE}/api/danmu/${encodeURIComponent(videoKey)}`);
        const data = await res.json();
        if (Array.isArray(data)) {
            danmuList = data.map(d => ({
                time: parseFloat(d.time_in_video) || 0,
                content: d.content,
                username: d.username || '匿名'
            }));
        }
    } catch (e) {}
}

video.addEventListener('timeupdate', () => {
    const now = video.currentTime;
    if (now < lastDanmuTime || now - lastDanmuTime > 2) {
        lastDanmuTime = now;
        return;
    }
    danmuList.forEach(d => {
        if (d.time > lastDanmuTime && d.time <= now) {
            const user = getCurrentUser();
            danmuEngine.shoot(d.content, user && user.username === d.username);
        }
    });
    lastDanmuTime = now;
});

document.getElementById('dmSend').onclick = sendDanmu;
document.getElementById('dmInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendDanmu();
});

async function sendDanmu() {
    const input = document.getElementById('dmInput');
    const content = input.value.trim();
    if (!content) return;
    const user = getCurrentUser();
    if (!user) { alert('请先登录'); location.href = './index.html'; return; }

    const btn = document.getElementById('dmSend');
    btn.disabled = true;
    btn.textContent = '发送中';
    try {
        const res = await fetch(`${API_BASE}/api/danmu`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user.token },
            body: JSON.stringify({ videoKey: currentVideoKey, content, timeInVideo: video.currentTime })
        });
        const data = await res.json();
        if (data.ok) {
            input.value = '';
            danmuEngine.shoot(content, true);
            danmuList.push({ time: video.currentTime, content, username: user.username });
        } else {
            alert(data.error || '发送失败');
        }
    } catch (e) {
        alert('网络错误：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '发送';
    }
}

document.getElementById('dmToggle').onclick = function () {
    danmuEngine.enabled = !danmuEngine.enabled;
    this.textContent = danmuEngine.enabled ? '弹幕 开' : '弹幕 关';
    this.classList.toggle('off', !danmuEngine.enabled);
    if (!danmuEngine.enabled) danmuEngine.clear();
};

async function loadComments(videoKey) {
    const list = document.getElementById('commentList');
    const count = document.getElementById('commentCount');
    list.innerHTML = '<div class="comment-loading">加载中...</div>';
    renderCommentInput();

    try {
        const res = await fetch(`${API_BASE}/api/comments/${encodeURIComponent(videoKey)}`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
            list.innerHTML = '<div class="comment-empty">还没有评论，来抢沙发~</div>';
            count.textContent = '0';
            return;
        }
        count.textContent = data.length;
        list.innerHTML = data.map(c => renderCommentItem(c)).join('');
    } catch (e) {
        list.innerHTML = '<div class="comment-empty">加载失败</div>';
    }
}

function renderCommentItem(c) {
    const timeStr = formatTime(c.created_at);
    const avatar = (c.username || '匿')[0].toUpperCase();
    return '<div class="comment-item">' +
        '<div class="avatar">' + avatar + '</div>' +
        '<div class="body">' +
            '<div class="head">' +
                '<span class="username">' + escapeHtml(c.username || '匿名') + '</span>' +
                '<span class="time">' + timeStr + '</span>' +
            '</div>' +
            '<div class="content">' + escapeHtml(c.content) + '</div>' +
        '</div>' +
    '</div>';
}

function renderCommentInput() {
    const wrap = document.getElementById('commentInputWrap');
    const user = getCurrentUser();
    if (!user) {
        wrap.innerHTML = '<div class="comment-login-tip">请先 <a href="./index.html">登录</a> 后发表评论</div>';
        return;
    }
    wrap.innerHTML =
        '<div class="comment-input-area">' +
            '<div class="comment-avatar">' + escapeHtml(user.username[0].toUpperCase()) + '</div>' +
            '<div class="comment-input-box">' +
                '<textarea id="commentInput" placeholder="发一条友善的评论"></textarea>' +
                '<div class="submit-row"><button class="submit-btn" id="commentSend">发布</button></div>' +
            '</div>' +
        '</div>';
    document.getElementById('commentSend').onclick = sendComment;
}

async function sendComment() {
    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    if (!content) return;
    const user = getCurrentUser();
    if (!user) { alert('请先登录'); return; }

    const btn = document.getElementById('commentSend');
    btn.disabled = true;
    btn.textContent = '发布中';
    try {
        const res = await fetch(`${API_BASE}/api/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user.token },
            body: JSON.stringify({ videoKey: currentVideoKey, content })
        });
        const data = await res.json();
        if (data.ok) {
            input.value = '';
            loadComments(currentVideoKey);
        } else {
            alert(data.error || '发送失败');
        }
    } catch (e) {
        alert('网络错误：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '发布';
    }
}

function formatTime(str) {
    if (!str) return '';
    const d = new Date(str.replace(' ', 'T') + 'Z');
    if (isNaN(d.getTime())) return str;
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

video.onended = () => {
    if (currentIndex < playlist.length - 1) {
        currentIndex++;
        renderPodList();
        loadCurrent();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
};

document.getElementById('likeBtn').onclick = function () { this.classList.toggle('active'); };
document.getElementById('favBtn').onclick = function () {
    this.classList.toggle('active');
    this.querySelector('span').textContent = this.classList.contains('active') ? '已收藏' : '收藏';
};
document.getElementById('shareBtn').onclick = function () {
    const url = location.href;
    if (navigator.share) {
        navigator.share({ title: document.title, url }).catch(() => {});
    } else {
        navigator.clipboard?.writeText(url);
        alert('链接已复制');
    }
};

document.getElementById('toggleDesc').onclick = function () {
    const desc = document.getElementById('videoDesc');
    const expanded = !desc.classList.contains('collapsed');
    desc.classList.toggle('collapsed');
    this.textContent = expanded ? '展开更多' : '收起';
};
