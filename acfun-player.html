<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放 - 櫻花动漫</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#18191c; background:#f4f5f7;
    -webkit-font-smoothing:antialiased;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; outline:none; background:none; color:inherit; }
input, textarea { font-family:inherit; outline:none; border:none; }

.bili-header {
    background:#fff; height:56px; padding:0 20px;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    position:sticky; top:0; z-index:100;
}
.bili-logo { display:flex; align-items:center; gap:6px; font-size:16px; font-weight:bold; color:#fb7299; flex-shrink:0; }
.bili-logo svg { width:26px; height:26px; }
.bili-nav { display:flex; gap:2px; flex-shrink:0; }
.bili-nav a { padding:6px 10px; font-size:13px; border-radius:6px; color:#61666d; }
.bili-nav a:hover { background:#f1f2f3; color:#18191c; }
.bili-search { margin-left:auto; position:relative; width:280px; }
.bili-search input { width:100%; height:32px; padding:0 36px 0 14px; background:#f1f2f3; border-radius:16px; font-size:13px; }
.bili-search .search-icon { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#9499a0; pointer-events:none; }
.bili-user { display:flex; align-items:center; gap:8px; font-size:13px; color:#61666d; flex-shrink:0; }
.bili-user .avatar {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#fb7299,#fc8bab);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:14px;
}
.bili-user .username { color:#00aeec; font-weight:500; }
.bili-user .login-link { padding:6px 16px; background:#fb7299; color:#fff; border-radius:6px; font-size:13px; font-weight:500; }

.main-container {
    max-width:1400px; margin:16px auto; padding:0 20px;
    display:grid; grid-template-columns:minmax(0,1fr) 350px;
    gap:16px; align-items:flex-start;
}
.left-col { min-width:0; }
.right-col { position:sticky; top:72px; }

/* 播放器 */
.player-wrap { background:#000; position:relative; aspect-ratio:16/9; overflow:hidden; border-radius:8px 8px 0 0; }
.player-wrap video { width:100%; height:100%; display:block; background:#000; }
.player-status {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#a0a0a0; font-size:14px; background:#000; z-index:5;
}
.player-status.hide { display:none; }
.player-status .spin {
    width:28px; height:28px;
    border:3px solid #2a2a2a; border-top-color:#fb7299;
    border-radius:50%; animation:spin 1s linear infinite; margin-right:10px;
}
@keyframes spin { to { transform:rotate(360deg); } }

.dm-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3; }
.dm-item {
    position:absolute; left:100%; white-space:nowrap;
    font-weight:bold; color:#fff;
    text-shadow:1px 1px 2px #000, 0 0 4px #000;
    will-change:transform;
}
.dm-item.scroll { animation:dmMove 8s linear forwards; }
.dm-item.top, .dm-item.bottom {
    left:50%; transform:translateX(-50%);
    animation:dmStatic 4s linear forwards;
}
.dm-item.bottom { bottom:20px; top:auto !important; }
.dm-item.self {
    border:1.5px solid #00aeec;
    border-radius:4px; padding:0 8px;
    box-shadow:0 0 6px rgba(0,174,236,.6);
}
@keyframes dmMove {
    from { transform:translateX(0); }
    to { transform:translateX(calc(-100vw - 100%)); }
}
@keyframes dmStatic {
    0%   { opacity:0; }
    10%  { opacity:1; }
    90%  { opacity:1; }
    100% { opacity:0; }
}
.dm-toggle {
    position:absolute; right:12px; bottom:12px;
    background:rgba(0,0,0,.5); color:#fff;
    padding:4px 12px; border-radius:14px; font-size:12px;
    z-index:6;
}
.dm-toggle.off { opacity:.5; }

/* 弹幕输入条 */
.dm-input-area {
    background:#fff; padding:10px 16px;
    display:flex; flex-direction:column; gap:8px;
    border-bottom:1px solid #f1f2f3;
}
.dm-input-row { display:flex; gap:8px; align-items:center; }
.dm-input-row input[type="text"] {
    flex:1; background:#f1f2f3; border-radius:18px;
    padding:7px 14px; font-size:13px; color:#18191c;
}
.dm-input-row input[type="text"]::placeholder { color:#9499a0; }
.dm-input-row button.send {
    background:#fb7299; color:#fff;
    padding:7px 18px; border-radius:18px;
    font-size:13px; font-weight:600;
}
.dm-input-row button.send:disabled { background:#e3e5e7; color:#9499a0; cursor:not-allowed; }
.dm-input-row button.settings-btn {
    display:none;
    width:34px; height:34px; border-radius:50%;
    background:#f1f2f3; color:#61666d;
    font-size:16px; flex-shrink:0;
}
.dm-settings { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12px; color:#61666d; }
.dm-settings .group { display:flex; gap:5px; align-items:center; }
.dm-settings .label { color:#9499a0; }
.color-dots { display:flex; gap:3px; }
.color-dot {
    width:16px; height:16px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
    transition:transform .15s, border-color .15s;
}
.color-dot:hover { transform:scale(1.15); }
.color-dot.on { border-color:#00aeec; transform:scale(1.15); }
.color-custom {
    position:relative; width:20px; height:20px;
    border-radius:50%; cursor:pointer;
    background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    border:2px solid #e3e5e7; overflow:hidden;
}
.color-custom input[type="color"] {
    position:absolute; inset:0; opacity:0;
    cursor:pointer; width:100%; height:100%;
}
.btn-group { display:flex; gap:2px; background:#f1f2f3; border-radius:6px; padding:2px; }
.btn-group button {
    padding:3px 9px; font-size:12px;
    color:#61666d; border-radius:4px;
    transition:all .15s;
}
.btn-group button.on {
    background:#fff; color:#00aeec; font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
}

/* 工具栏 */
.video-toolbar { background:#fff; padding:12px 16px; display:flex; align-items:center; gap:4px; }
.toolbar-btn {
    display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 16px; font-size:12px; color:#61666d;
    border-radius:6px; min-width:56px;
}
.toolbar-btn:hover { background:#f1f2f3; }
.toolbar-btn svg { width:24px; height:24px; }
.toolbar-btn.active { color:#fb7299; }
.toolbar-btn.active svg { fill:#fb7299; }

/* Tab：简介 | 评论 —— 紧跟工具栏下面 */
.content-tabs {
    background:#fff;
    padding:0 20px;
    display:flex; gap:24px;
    border-bottom:1px solid #f1f2f3;
}
.content-tabs a {
    padding:14px 0;
    font-size:15px; color:#61666d;
    border-bottom:2px solid transparent;
    cursor:pointer;
}
.content-tabs a.on {
    color:#18191c; font-weight:600;
    border-bottom-color:#fb7299;
}
.content-tabs a .cnt {
    font-size:12px; color:#9499a0; font-weight:normal;
    margin-left:4px;
}

.tab-panel {
    background:#fff; padding:20px;
    border-radius:0 0 8px 8px;
    margin-bottom:8px;
}
.tab-panel.intro-panel { padding-top:0; }
.tab-panel.comment-panel { padding-top:0; }

/* 移动端标题（放在 introPanel 内） */
.video-title-bar-mobile {
    display:none;
    padding:14px 0 12px;
}
.video-title-bar-mobile .title {
    font-size:16px; font-weight:600; line-height:1.4;
    margin-bottom:8px; word-break:break-word;
}
.video-title-bar-mobile .stats {
    display:flex; gap:14px; font-size:12px; color:#9499a0;
    flex-wrap:wrap;
}

/* PC 简介卡 */
.intro-card {
    display:flex; gap:16px;
    padding:20px 0 16px;
    border-bottom:1px solid #f1f2f3;
    margin-bottom:16px;
}
.intro-cover {
    width:130px; height:174px; border-radius:6px;
    overflow:hidden; flex-shrink:0; background:#f1f2f3;
}
.intro-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.intro-info { flex:1; min-width:0; }
.intro-title {
    font-size:18px; font-weight:600; line-height:1.4;
    margin-bottom:10px; word-break:break-word;
}
.intro-stats {
    display:flex; gap:14px; font-size:12px; color:#9499a0;
    margin-bottom:10px; flex-wrap:wrap;
}
.intro-meta {
    font-size:13px; color:#61666d; line-height:1.8;
    margin-bottom:12px; word-break:break-word;
}
.intro-actions {
    display:flex; gap:12px; align-items:center;
    flex-wrap:wrap; margin-top:12px;
}
.btn-follow {
    padding:7px 22px; background:#fb7299; color:#fff;
    border-radius:16px; font-size:13px; font-weight:600;
}
.btn-follow.on { background:#f1f2f3; color:#61666d; }
.score-box {
    display:inline-flex; align-items:baseline; gap:2px;
    color:#ff8800; font-weight:bold;
}
.score-box .num { font-size:20px; }
.score-box .unit { font-size:12px; }

.intro-desc {
    font-size:13px; color:#61666d; line-height:1.7;
    word-break:break-word; white-space:pre-wrap;
}
.intro-desc.collapsed {
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
    overflow:hidden;
}
.intro-toggle {
    color:#00aeec; cursor:pointer; font-size:13px;
    display:inline-block; margin-top:6px;
}

/* 移动端选集（横向滚动） */
.episode-card-mobile {
    display:none;
    padding:14px 0;
    border-bottom:1px solid #f1f2f3;
    margin-bottom:14px;
}
.episode-card-mobile .ep-head {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:14px; font-weight:600; margin-bottom:10px;
}
.episode-card-mobile .ep-head .amt {
    font-size:12px; font-weight:normal; color:#9499a0;
}
.episode-card-mobile .ep-scroll {
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
}
.episode-card-mobile .ep-scroll::-webkit-scrollbar { display:none; }
.episode-card-mobile .ep-btn {
    flex:0 0 auto; min-width:82px;
    padding:8px 10px; background:#f6f7f8;
    border-radius:6px; text-align:left;
    border:1px solid transparent;
    transition:all .15s;
}
.episode-card-mobile .ep-btn.on {
    background:#fff0f5; border-color:#fb7299;
}
.episode-card-mobile .ep-btn .num {
    display:block; font-size:13px; font-weight:600; color:#18191c;
}
.episode-card-mobile .ep-btn.on .num { color:#fb7299; }
.episode-card-mobile .ep-btn .t {
    display:block; font-size:11px; color:#9499a0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    max-width:80px;
}
.episode-card-mobile .ep-btn.on .t { color:#fb7299; opacity:.8; }

/* 移动端追番按钮 */
.mobile-actions {
    display:none;
    margin-top:16px;
}

/* 评论 */
.comment-input-area { display:flex; gap:12px; margin-bottom:20px; padding-top:16px; }
.comment-avatar {
    flex-shrink:0; width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg,#fb7299,#fc8bab);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:16px;
}
.comment-input-box { flex:1; }
.comment-input-box textarea {
    width:100%; padding:10px 14px;
    background:#f1f2f3; border-radius:8px;
    font-size:13px; resize:none; min-height:60px;
}
.comment-input-box .submit-row { display:flex; justify-content:flex-end; margin-top:8px; }
.comment-input-box .submit-btn {
    padding:6px 20px; border-radius:6px;
    background:#fb7299; color:#fff; font-size:13px; font-weight:600;
}
.comment-input-box .submit-btn:disabled { background:#e3e5e7; color:#9499a0; cursor:not-allowed; }
.comment-login-tip {
    padding:20px; background:#f6f7f8; border-radius:8px;
    text-align:center; color:#9499a0; font-size:13px; margin-bottom:20px;
}
.comment-login-tip a { color:#fb7299; font-weight:600; }
.comment-sort {
    display:flex; gap:12px; font-size:13px;
    padding:14px 0 12px;
    border-bottom:1px solid #f1f2f3;
}
.comment-sort a { color:#9499a0; padding-bottom:2px; cursor:pointer; }
.comment-sort a.on { color:#18191c; font-weight:600; }
.comment-item { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid #f6f7f8; }
.comment-item:last-child { border-bottom:none; }
.comment-item .avatar {
    flex-shrink:0; width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg,#00aeec,#0088b8);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:16px;
}
.comment-item .body { flex:1; min-width:0; }
.comment-item .head { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
.comment-item .username { font-size:13px; color:#00aeec; font-weight:600; }
.comment-item .time { font-size:12px; color:#9499a0; }
.comment-item .content { font-size:14px; line-height:1.7; word-break:break-word; white-space:pre-wrap; }
.comment-empty, .comment-loading { text-align:center; color:#9499a0; padding:40px 0; font-size:13px; }

/* PC 右侧栏 */
.side-card { background:#fff; border-radius:8px; margin-bottom:12px; overflow:hidden; }
.side-head {
    padding:12px 16px; font-size:14px; font-weight:600;
    border-bottom:1px solid #f1f2f3;
    display:flex; align-items:center; justify-content:space-between;
}
.side-head .amt { font-size:12px; font-weight:normal; color:#9499a0; }
.side-head.clickable { cursor:pointer; user-select:none; }
.side-head.clickable:hover { background:#f9f9fa; }
.side-head .arrow {
    display:inline-block; font-size:10px;
    transition:transform .2s; margin-left:6px;
}
.side-head.collapsed .arrow { transform:rotate(-90deg); }

.episode-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(95px,1fr));
    gap:6px;
    padding:12px 16px;
    max-height:360px;
    overflow-y:auto;
}
.episode-grid::-webkit-scrollbar { width:6px; }
.episode-grid::-webkit-scrollbar-thumb { background:#e3e5e7; border-radius:3px; }
.episode-item {
    padding:8px 10px;
    background:#f6f7f8; border-radius:6px;
    text-align:left; cursor:pointer;
    border:1px solid transparent;
    transition:all .15s;
    overflow:hidden;
}
.episode-item:hover { background:#e3e5e7; }
.episode-item.on { background:#fff0f5; border-color:#fb7299; }
.episode-item .ep-num {
    display:block; font-size:13px; font-weight:600;
    color:#18191c; margin-bottom:2px;
}
.episode-item.on .ep-num { color:#fb7299; }
.episode-item .ep-title {
    display:block; font-size:11px; color:#9499a0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.episode-item.on .ep-title { color:#fb7299; opacity:.8; }

.dm-list { max-height:300px; overflow-y:auto; padding:6px 0; }
.dm-list::-webkit-scrollbar { width:6px; }
.dm-list::-webkit-scrollbar-thumb { background:#e3e5e7; border-radius:3px; }
.dm-list.collapsed { display:none; }
.dm-row {
    padding:6px 16px; font-size:12px;
    display:flex; gap:10px; align-items:center;
    color:#61666d;
}
.dm-row .t { color:#00aeec; font-weight:600; flex-shrink:0; min-width:36px; }
.dm-row .c { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#18191c; }
.dm-row .u { color:#9499a0; flex-shrink:0; max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dm-row.empty { justify-content:center; color:#9499a0; padding:24px; }

.related-list { padding:6px 0; max-height:600px; overflow-y:auto; }
.related-list::-webkit-scrollbar { width:6px; }
.related-list::-webkit-scrollbar-thumb { background:#e3e5e7; border-radius:3px; }
.related-item {
    display:flex; gap:10px; padding:8px 16px;
    cursor:pointer; transition:background .15s;
}
.related-item:hover { background:#f6f7f8; }
.related-item .cover {
    width:80px; height:50px; border-radius:4px;
    overflow:hidden; background:#f1f2f3; flex-shrink:0;
}
.related-item .cover img { width:100%; height:100%; object-fit:cover; display:block; }
.related-item .info { flex:1; min-width:0; }
.related-item .title {
    font-size:13px; font-weight:500; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    margin-bottom:4px;
}
.related-item .sub { font-size:11px; color:#9499a0; display:flex; gap:8px; }

/* PC / 移动 切换 */
@media (min-width:1101px) {
    .video-title-bar-mobile { display:none !important; }
    .episode-card-mobile { display:none !important; }
    .mobile-actions { display:none !important; }
    .episode-card-pc { display:block; }
    .dm-list-card { display:block; }
    .dm-input-row button.settings-btn { display:none; }
    .dm-settings { display:flex; }
    .intro-cover { display:block; }
    .intro-title, .intro-stats, .intro-actions { display:flex; }
    .intro-title { display:block; }
}
@media (max-width:1100px) {
    .main-container { grid-template-columns:1fr; padding:0; margin:0; gap:0; }
    .right-col { position:static; padding:0 0 12px; }
    .bili-search { width:180px; }
    .bili-nav { display:none; }
    .player-wrap { border-radius:0; }
    .video-toolbar { }
    .content-tabs { }
    .tab-panel { border-radius:0; margin-bottom:8px; }
    .side-card { border-radius:0; margin-bottom:8px; }
    .related-list { max-height:none; }
    .episode-card-pc { display:none !important; }
    .dm-list-card { display:none !important; }

    /* 移动端标题、选集、追番按钮显示 */
    .video-title-bar-mobile { display:block; }
    .episode-card-mobile { display:block; }
    .mobile-actions { display:block; }

    /* 移动端隐藏 PC 简介卡的封面/标题/数据/追番 */
    .intro-card { display:block; padding:14px 0; border-bottom:none; margin-bottom:0; }
    .intro-cover { display:none !important; }
    .intro-info { display:block; }
    .intro-title, .intro-stats, .intro-actions { display:none !important; }
    .intro-meta { margin-bottom:0; font-size:12px; color:#9499a0; line-height:1.7; }

    /* 移动端标签隐藏 */
    .tag-part { display:none !important; }

    /* 移动端弹幕设置按钮 */
    .dm-input-row button.settings-btn { display:flex; align-items:center; justify-content:center; }
    .dm-settings { display:none; flex-direction:column; align-items:flex-start; gap:10px; padding-top:6px; }
    .dm-settings.open { display:flex; }
}
@media (max-width:640px) {
    .bili-header { padding:0 12px; gap:8px; height:50px; }
    .bili-logo { font-size:14px; }
    .bili-logo svg { width:22px; height:22px; }
    .bili-search { width:120px; }
    .bili-search input { height:30px; padding:0 30px 0 10px; font-size:12px; }
    .bili-search .search-icon { right:10px; }
    .bili-user .avatar { width:28px; height:28px; font-size:12px; }
    .toolbar-btn { padding:6px 12px; min-width:50px; font-size:11px; }
    .toolbar-btn svg { width:20px; height:20px; }
    .content-tabs { padding:0 14px; gap:20px; }
    .tab-panel { padding:14px; }
    .dm-input-area { padding:10px 14px; }
    .video-title-bar-mobile .title { font-size:15px; }
}
</style>
</head>
<body>

<div class="bili-header">
    <a class="bili-logo" href="./index.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l7 4.5-7 4.5z"/></svg>
        櫻花动漫
    </a>
    <nav class="bili-nav">
        <a href="./index.html">首页</a>
        <a href="./index.html#bangumi">番剧</a>
        <a href="./index.html#bangumi-index">索引</a>
    </nav>
    <div class="bili-search">
        <input type="text" placeholder="搜索番剧..." id="topSearch">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
    </div>
    <div class="bili-user" id="biliUser"></div>
</div>

<script>
const API_BASE = 'https://api.imomoe.dpdns.org';

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}

class DanmuEngine {
    constructor(layerEl) {
        this.layer = layerEl;
        this.enabled = true;
        this.tracks = 8;
        this.trackFree = new Array(this.tracks).fill(0);
    }
    pickTrack() {
        const now = Date.now();
        for (let i = 0; i < this.tracks; i++) {
            if (this.trackFree[i] < now) {
                this.trackFree[i] = now + 8000;
                return i;
            }
        }
        let min = 0;
        for (let i = 1; i < this.tracks; i++) {
            if (this.trackFree[i] < this.trackFree[min]) min = i;
        }
        this.trackFree[min] = now + 8000;
        return min;
    }
    shoot(content, opts = {}) {
        if (!this.enabled) return;
        const color = opts.color || '#ffffff';
        const position = opts.position || 'scroll';
        const fontSize = opts.fontSize || 'medium';
        const isSelf = opts.isSelf || false;

        const el = document.createElement('div');
        el.className = 'dm-item ' + position + (isSelf ? ' self' : '');
        el.textContent = content;
        el.style.color = color;

        const sizeMap = { small: '14px', medium: '20px', large: '28px' };
        el.style.fontSize = sizeMap[fontSize] || '20px';

        if (position === 'scroll') {
            const track = this.pickTrack();
            el.style.top = (track * 36 + 10) + 'px';
        } else if (position === 'top') {
            el.style.top = '60px';
        } else if (position === 'bottom') {
            el.style.bottom = '60px';
        }

        this.layer.appendChild(el);
        const dur = position === 'scroll' ? 8000 : 4000;
        setTimeout(() => el.remove(), dur + 500);
    }
    clear() {
        this.layer.innerHTML = '';
        this.trackFree = new Array(this.tracks).fill(0);
    }
}

const params = new URLSearchParams(location.search);

function parseIvParam() {
    const ivParam = params.get('iv');
    if (ivParam) {
        const m = ivParam.match(/(\d+)/);
        if (m) return parseInt(m[1]);
    }
    const idParam = params.get('id');
    if (idParam) {
        const n = parseInt(idParam);
        if (!isNaN(n)) return n;
    }
    return null;
}

const animeId = parseIvParam();
const albumId = params.get('album');
const singleId = params.get('ac');
const urlTitle = params.get('title') || '';
// 从 URL 读初始集数（1-based）
const initialEp = Math.max(1, parseInt(params.get('ep')) || 1);

let hls = null;
let danmuEngine = null;
let danmuList = [];
let lastDanmuTime = 0;
let currentAnime = null;
let episodeList = [];
let currentEpIdx = initialEp - 1;
let commentsData = [];
let commentSort = 'hot';
let allAnimeCache = [];

// 竞态控制
let loadSeq = 0;

let sendColor = '#ffffff';
let sendPosition = 'scroll';
let sendFontSize = 'medium';

const video = document.getElementById('video');
const dmLayer = document.getElementById('dmLayer');
danmuEngine = new DanmuEngine(dmLayer);

function getCurrentUser() {
    try {
        const raw = localStorage.getItem('imomoe_user');
        return raw ? JSON.parse(raw) : null;
    } catch { return null; }
}

function renderUser() {
    const user = getCurrentUser();
    const box = document.getElementById('biliUser');
    if (user) {
        const name = user.nickname || user.username;
        box.innerHTML = '<a class="avatar" href="./user.html?uid=' + user.uid + '" style="color:#fff">' + escapeHtml(name[0].toUpperCase()) + '</a>' +
                        '<a class="username" href="./user.html?uid=' + user.uid + '">' + escapeHtml(name) + '</a>';
    } else {
        box.innerHTML = '<a class="login-link" href="./index.html">登录</a>';
    }
}
renderUser();

document.getElementById('topSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        const kw = e.target.value.trim();
        if (kw) location.href = './index.html#search=' + encodeURIComponent(kw);
    }
});

document.getElementById('dmSettingsBtn').onclick = function () {
    document.getElementById('dmSettingsBox').classList.toggle('open');
};

document.getElementById('colorDots').addEventListener('click', (e) => {
    const dot = e.target.closest('.color-dot');
    if (!dot) return;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('on'));
    dot.classList.add('on');
    sendColor = dot.dataset.color;
    document.getElementById('colorCustom').value = sendColor;
});
document.getElementById('colorCustom').addEventListener('input', (e) => {
    sendColor = e.target.value;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('on'));
});
document.getElementById('positionGroup').addEventListener('click', (e) => {

    if (!btn) return;

});
document.getElementById('fontSizeGroup').addEventListener('click', (e) => {

    if (!btn) return;
    document.querySelectorAll('#fontSizeGroup button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');

});

});

        document.querySelectorAll('.comment-sort a').forEach(x => x.classList.remove('on'));
        a.classList.add('on');
        commentSort = a.dataset.sort;
        renderComments();

});

    this.classList.toggle('collapsed');
    document.getElementById('dmList').classList.toggle('collapsed');
};

document.getElementById('introToggle').onclick = function () {
    const desc = document.getElementById('infoDesc');
    if (desc.classList.contains('collapsed')) {
        desc.classList.remove('collapsed');
        this.textContent = '收起';
    } else {
        desc.classList.add('collapsed');
        this.textContent = '展开更多';
    }
};

if (!animeId && !albumId && !singleId) {
    showStatus('缺少参数：?iv=iv1 或 ?id=1');
} else if (animeId) {
    initByAnimeId(animeId);
} else if (albumId) {
    initByAlbumId(albumId);
} else {
    initByAcId(singleId);
}

function showStatus(text) {
    document.getElementById('playerStatus').classList.remove('hide');
    document.getElementById('statusText').textContent = text;
}
function hideStatus() {
    document.getElementById('playerStatus').classList.add('hide');
}

async function initByAnimeId(id) {
    showStatus('加载番剧信息...');
    try {
        const res = await fetch(`${API_BASE}/api/anime/${id}`);
        const data = await res.json();
        if (!data.ok) {
            showStatus('番剧不存在：' + (data.error || '未知错误'));
            return;
        }
        currentAnime = data.anime;

        const newUrl = new URL(location.href);
        newUrl.searchParams.set('iv', 'iv' + currentAnime.id);
        newUrl.searchParams.delete('id');
        history.replaceState({}, '', newUrl);

        renderAnimeInfo(currentAnime);
        await loadStats(currentAnime.id);
        await loadDanmu(currentAnime.id);
        loadComments(currentAnime.id);
        loadRelated();
        await loadAndPlay(currentAnime);
    } catch (e) {
        showStatus('网络错误：' + e.message);
    }
}

async function initByAlbumId(albumId) {
    showStatus('加载合集...');
    try {
        const res = await fetch(`${API_BASE}/api/acfun-collection/${albumId}`);
        const data = await res.json();
        if (!data.ok) {
            showStatus('合集不存在：' + (data.error || '未知错误'));
            return;
        }
        episodeList = data.list.map(item => ({
            ac: item.ac, p: item.p, title: item.title || ('第' + item.p + '集')
        }));
        if (currentEpIdx >= episodeList.length) currentEpIdx = 0;
        document.getElementById('infoTitle').textContent = urlTitle || ('合集 ' + albumId);
        document.getElementById('infoTitleMobile').textContent = urlTitle || ('合集 ' + albumId);
        document.title = (urlTitle || ('合集 ' + albumId)) + ' - 櫻花动漫';
        renderEpisodeLists();
        await loadCurrentEpisode();
    } catch (e) {
        showStatus('网络错误：' + e.message);
    }
}

async function initByAcId(ac) {
    showStatus('加载视频...');
    episodeList = [{ ac, p: 1, title: urlTitle || '视频' }];
    currentEpIdx = 0;
    document.getElementById('infoTitle').textContent = urlTitle || '视频';
    document.getElementById('infoTitleMobile').textContent = urlTitle || '视频';
    renderEpisodeLists();
    await loadCurrentEpisode();
}

function renderAnimeInfo(anime) {
    document.title = anime.title + ' - 櫻花动漫';

    document.getElementById('infoTitle').textContent = anime.title;
    document.getElementById('infoTitleMobile').textContent = anime.title;
    document.getElementById('infoCover').src = anime.coverV || anime.coverH || '';
    document.getElementById('infoDesc').textContent = anime.description || '暂无简介';

    const metaParts = [];
    if (anime.year) metaParts.push(anime.year + '年' + (anime.month || ''));
    if (anime.totalEp) metaParts.push('全' + anime.totalEp + '话');
    if (anime.duration) metaParts.push('单集 ' + anime.duration);

    let metaHtml = metaParts.map(p => '<span>' + escapeHtml(p) + '</span>').join('　|　');
    if ((anime.tags || []).length) {
        metaHtml += '<span class="tag-part">　|　标签：' + escapeHtml(anime.tags.join(' · ')) + '</span>';
    }
    document.getElementById('infoMeta').innerHTML = metaHtml;
    document.getElementById('infoMetaMobile').innerHTML = metaHtml;

    if (anime.score) {
        const box = document.getElementById('scoreBox');
        box.style.display = 'inline-flex';
        box.querySelector('.num').textContent = anime.score;
    }

    const descEl = document.getElementById('infoDesc');
    setTimeout(() => {
        if (descEl.scrollHeight > descEl.clientHeight + 4) {
            document.getElementById('introToggle').style.display = 'inline-block';
        }
    }, 100);

    const links = anime.links || {};
    episodeList = [];
    const collectionMatch = (links.a || '').match(/acfun\.cn\/a\/aa(\d+)/);
    if (collectionMatch) {
        currentAnime._collectionId = collectionMatch[1];
    } else {
        const singleMatch = (links.a || '').match(/acfun\.cn\/v\/ac(\d+)/);
        if (singleMatch) {
            episodeList.push({ ac: singleMatch[1], p: 1, title: anime.title });
        }
    }
}

function renderEpisodeLists() {
    const hasEpisodes = episodeList && episodeList.length > 1;

    const cardPC = document.getElementById('episodeCardPC');
    const cardMobile = document.getElementById('episodeCardMobile');

    if (!hasEpisodes) {
        if (cardPC) cardPC.style.display = 'none';
        if (cardMobile) cardMobile.style.display = 'none';
        return;
    }

    if (cardPC) cardPC.style.display = '';
    if (cardMobile) cardMobile.style.display = '';

    const epCountText = '全 ' + episodeList.length + ' 话';
    document.getElementById('epAmtPC').textContent = epCountText;
    document.getElementById('epAmtMobile').textContent = epCountText;

    // PC 版
    document.getElementById('episodeGridPC').innerHTML = episodeList.map((ep, i) => {
        const epNumText = '第' + (i + 1) + '话';
        let epTitle = ep.title || '';
        if (epTitle === epNumText || epTitle === ('第' + (i + 1) + '集') || epTitle === ('第 ' + (i + 1) + ' 集')) {
            epTitle = '';
        }
        return '<button type="button" class="episode-item' + (i === currentEpIdx ? ' on' : '') + '" data-idx="' + i + '">' +
            '<span class="ep-num">' + epNumText + '</span>' +
            (epTitle ? '<span class="ep-title">' + escapeHtml(epTitle) + '</span>' : '') +
        '</button>';
    }).join('');

    // 移动端版
    document.getElementById('episodeGridMobile').innerHTML = episodeList.map((ep, i) => {
        const epNumText = '第' + (i + 1) + '话';
        let epTitle = ep.title || '';
        if (epTitle === epNumText || epTitle === ('第' + (i + 1) + '集') || epTitle === ('第 ' + (i + 1) + ' 集')) {
            epTitle = '';
        }
        return '<button type="button" class="ep-btn' + (i === currentEpIdx ? ' on' : '') + '" data-idx="' + i + '">' +
            '<span class="num">' + epNumText + '</span>' +
            (epTitle ? '<span class="t">' + escapeHtml(epTitle) + '</span>' : '') +
        '</button>';
    }).join('');

    // 事件委托（一次性绑定在容器上，避免重复绑定）
    const gridPC = document.getElementById('episodeGridPC');
    const gridMobile = document.getElementById('episodeGridMobile');

    const handleClick = (e) => {
        const btn = e.target.closest('[data-idx]');
        if (!btn) return;
        const idx = parseInt(btn.dataset.idx);
        if (isNaN(idx) || idx === currentEpIdx) return;
        currentEpIdx = idx;
        renderEpisodeLists();
        loadCurrentEpisode();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // 用 onpointerdown 避免多次绑定；每次覆盖旧的
    gridPC.onclick = handleClick;
    gridMobile.onclick = handleClick;
}

async function loadAndPlay(anime) {
    if (anime._collectionId) {
        showStatus('加载合集列表...');
        try {
            const res = await fetch(`${API_BASE}/api/acfun-collection/${anime._collectionId}`);
            const data = await res.json();
            if (data.ok && data.list && data.list.length) {
                episodeList = data.list.map(item => ({
                    ac: item.ac, p: item.p, title: item.title || ('第' + item.p + '集')
                }));
                // 保留 URL 中的 ep 参数
                if (currentEpIdx >= episodeList.length) currentEpIdx = 0;
                renderEpisodeLists();
                await loadCurrentEpisode();
                return;
            }
        } catch (e) {}
    }

    if (episodeList.length > 0 && episodeList[0].ac) {
        renderEpisodeLists();
        await loadCurrentEpisode();
        return;
    }

    const links = anime.links || {};

    const m = (links.a || '').match(/acfun\.cn\/v\/ac(\d+)/);
    if (m) {
        episodeList = [{ ac: m[1], p: 1, title: anime.title }];
        currentEpIdx = 0;
        renderEpisodeLists();
        await loadCurrentEpisode();
        return;
    }

    const biliUrl = (links.b || '').trim() ||
                    Object.values(links).find(v => typeof v === 'string' && v.includes('bilibili'));
    if (biliUrl) {
        showStatus('此番剧在 B站播放，正在跳转...');
        setTimeout(() => { window.location.href = biliUrl; }, 800);
        return;
    }

    const mfunsUrl = (links.mfuns || '').trim() ||
                     Object.values(links).find(v => typeof v === 'string' && v.includes('mfuns'));
    if (mfunsUrl) {
        const mf = mfunsUrl.match(/mfuns\.net\/video\/(\d+)/);
        if (mf) {
            showStatus('此番剧在 MFuns 播放，正在跳转...');
            setTimeout(() => { window.location.href = './player.html?id=' + mf[1]; }, 800);
            return;
        }
    }

    showStatus('此番剧暂无播放源');
}

async function loadCurrentEpisode() {
    // 竞态控制：每次调用递增序号
    const mySeq = ++loadSeq;

    const ep = episodeList[currentEpIdx];
    if (!ep || !ep.ac) {
        showStatus('此集暂无可播放的 AcFun 源');
        return;
    }

    showStatus('获取视频地址...');
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
    danmuEngine.clear();

    try {
        const res = await fetch(`${API_BASE}/api/acfun/${ep.ac}?p=1`);

        // 如果中间有新的 loadCurrentEpisode 被触发，丢弃本次结果
        if (mySeq !== loadSeq) {
            console.log('[imomoe] 丢弃过期的集数请求 #' + mySeq);
            return;
        }

        const data = await res.json();
        if (!data.ok || !data.urls || !data.urls.length) {
            showStatus('获取视频失败：' + (data.error || '未知错误'));
            return;
        }

        const pages = data.pages || [];

        if (pages.length > 1) {
            await playMerged(ep.ac, data.urls, pages);
        } else {
            playSingle(data.urls[0]);
        }

        // 更新 URL 的 ep 参数（1-based）
        const newUrl = new URL(location.href);
        newUrl.searchParams.set('ep', ep.p || (currentEpIdx + 1));
        history.replaceState({}, '', newUrl);

        renderEpisodeLists();

        if (currentAnime) {
            fetch(`${API_BASE}/api/view`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ animeId: currentAnime.id })
            }).catch(() => {});
        }
    } catch (e) {
        if (mySeq !== loadSeq) return;
        showStatus('网络错误：' + e.message);
    }
}

function playSingle(quality) {
    if (!quality || !quality.url) {
        showStatus('无可用清晰度');
        return;
    }
    const directUrl = quality.url;
    const isM3u8 = quality.url.includes('.m3u8');

    if (hls) { hls.destroy(); hls = null; }

    if (isM3u8 && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(directUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            hideStatus();
            video.play().catch(() => {});
            lastDanmuTime = 0;
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            console.error('HLS 错误：', data);
            if (data.fatal) showStatus('播放错误：' + (data.details || '未知'));
        });
    } else {
        video.src = directUrl;
        video.play().catch(() => {});
        hideStatus();
    }
}

async function playMerged(ac, urls, pages) {
    showStatus('合并分P中...（' + pages.length + ' 个分P）');

    const qualityKw = ((urls[0].quality || '').match(/\d+/) || ['1080'])[0];
    let merged = '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-PLAYLIST-TYPE:VOD\n';
    let hasContent = false;
    let maxDur = 0;

    for (const pg of pages) {
        try {
            const res = await fetch(`${API_BASE}/api/acfun/${ac}?p=${pg.p}`);
            const pData = await res.json();
            if (!pData.ok || !pData.urls) continue;

            const target = pData.urls.find(u => u.quality.includes(qualityKw)) || pData.urls[0];
            if (!target) continue;

            const m3u8Res = await fetch(target.url);
            if (!m3u8Res.ok) continue;
            const m3u8Text = await m3u8Res.text();

            const baseUrl = target.url.substring(0, target.url.lastIndexOf('/') + 1);
            const targetOrigin = new URL(target.url).origin;

            let expectUrl = false;
            for (const line of m3u8Text.split('\n')) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                if (trimmed.startsWith('#EXTINF')) {
                    const mm = trimmed.match(/#EXTINF:([\d.]+)/);
                    if (mm) maxDur = Math.max(maxDur, parseFloat(mm[1]));
                    merged += trimmed + '\n';
                    expectUrl = true;
                } else if (expectUrl && !trimmed.startsWith('#')) {
                    let u = trimmed;
                    if (!u.startsWith('http')) {
                        u = u.startsWith('/') ? targetOrigin + u : baseUrl + u;
                    }
                    merged += u + '\n';
                    hasContent = true;
                    expectUrl = false;
                }
            }
            merged += '#EXT-X-DISCONTINUITY\n';
        } catch (e) {
            console.warn('P' + pg.p + ' 合并失败：', e.message);
        }
    }

    if (!hasContent) {
        console.warn('合并失败，回退到单P');
        playSingle(urls[0]);
        return;
    }

    merged += '#EXT-X-ENDLIST\n';
    merged = merged.replace(
        '#EXT-X-PLAYLIST-TYPE:VOD\n',
        '#EXT-X-PLAYLIST-TYPE:VOD\n#EXT-X-TARGETDURATION:' + Math.ceil(maxDur || 10) + '\n'
    );

    const blob = new Blob([merged], { type: 'application/vnd.apple.mpegurl' });
    const blobUrl = URL.createObjectURL(blob);

    if (hls) { hls.destroy(); hls = null; }
    hls = new Hls({ enableWorker: true });
    hls.loadSource(blobUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
        hideStatus();
        video.play().catch(() => {});
        lastDanmuTime = 0;
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
        console.error('HLS 错误：', data);
        if (data.fatal) showStatus('播放错误：' + (data.details || '未知'));
    });
}

async function loadRelated() {

    try {
        if (!allAnimeCache.length) {

        }

            return;
        }

                '<div class="cover"><img src="' + escapeHtml(a.coverH || a.coverV) + '" loading="lazy" onerror="this.style.display=\'none\'"></div>' +
                '<div class="info">' +
                    '<div class="title">' + escapeHtml(a.title) + '</div>' +
                    '<div class="sub"><span>' + (a.year || '') + '</span></div>' +
                '</div>' +
            '</a>';
        }).join('');
    } catch (e) {
        box.innerHTML = '<div class="dm-row empty">加载失败</div>';
    }
}

async function loadDanmu(animeId) {
    danmuList = [];
    lastDanmuTime = 0;
    try {
        const res = await fetch(`${API_BASE}/api/danmu/${animeId}`);
        const data = await res.json();
        if (Array.isArray(data)) {
            danmuList = data.map(d => ({
                time: parseFloat(d.time_in_video) || 0,
                content: d.content,
                username: d.username || '匿名',
                color: d.color || '#ffffff',
                position: d.position || 'scroll',
                fontSize: d.font_size || 'medium'
            }));
        }
    } catch (e) {}

    document.getElementById('dmCount').textContent = danmuList.length;
    renderDanmuList();
}

function renderDanmuList() {
    const box = document.getElementById('dmList');
    if (danmuList.length === 0) {
        box.innerHTML = '<div class="dm-row empty">暂无弹幕</div>';
        return;
    }
    box.innerHTML = danmuList.slice(0, 100).map(d => {
        const mm = String(Math.floor(d.time / 60)).padStart(2, '0');
        const ss = String(Math.floor(d.time % 60)).padStart(2, '0');
        return '<div class="dm-row">' +
            '<span class="t">' + mm + ':' + ss + '</span>' +
            '<span class="c">' + escapeHtml(d.content) + '</span>' +
            '<span class="u">' + escapeHtml(d.username) + '</span>' +
        '</div>';
    }).join('');
}

video.addEventListener('timeupdate', () => {
    const now = video.currentTime;
    if (now < lastDanmuTime || now - lastDanmuTime > 2) {
        lastDanmuTime = now;
        return;
    }
    const user = getCurrentUser();
    danmuList.forEach(d => {
        if (d.time > lastDanmuTime && d.time <= now) {
            danmuEngine.shoot(d.content, {
                color: d.color,
                position: d.position,
                fontSize: d.fontSize,
                isSelf: user && user.username === d.username
            });
        }
    });
    lastDanmuTime = now;
});

document.getElementById('dmSend').onclick = sendDanmu;
document.getElementById('dmInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendDanmu();
});

async function sendDanmu() {
    const input = document.getElementById('dmInput');
    const content = input.value.trim();
    if (!content) return;
    const user = getCurrentUser();
    if (!user) { alert('请先登录'); location.href = './index.html'; return; }
    if (!currentAnime) { alert('番剧信息未加载'); return; }

    const btn = document.getElementById('dmSend');
    btn.disabled = true;
    btn.textContent = '发送中';
    try {
        const res = await fetch(`${API_BASE}/api/danmu`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + user.token
            },
            body: JSON.stringify({
                animeId: currentAnime.id,
                content,
                timeInVideo: video.currentTime,
                color: sendColor,
                position: sendPosition,
                fontSize: sendFontSize
            })
        });
        const data = await res.json();
        if (data.ok) {
            input.value = '';
            danmuEngine.shoot(content, {
                color: sendColor,
                position: sendPosition,
                fontSize: sendFontSize,
                isSelf: true
            });
            danmuList.push({
                time: video.currentTime,
                content,
                username: user.nickname || user.username,
                color: sendColor,
                position: sendPosition,
                fontSize: sendFontSize
            });
            document.getElementById('dmCount').textContent = danmuList.length;
            renderDanmuList();
        } else {
            alert(data.error || '发送失败');
        }
    } catch (e) {
        alert('网络错误：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '发送';
    }
}

document.getElementById('dmToggle').onclick = function () {
    danmuEngine.enabled = !danmuEngine.enabled;
    this.textContent = danmuEngine.enabled ? '弹幕 开' : '弹幕 关';
    this.classList.toggle('off', !danmuEngine.enabled);
    if (!danmuEngine.enabled) danmuEngine.clear();
};

async function loadComments(animeId) {
    const list = document.getElementById('commentList');
    const count = document.getElementById('commentCount');
    list.innerHTML = '<div class="comment-loading">加载中...</div>';
    renderCommentInput();

    try {
        const res = await fetch(`${API_BASE}/api/comments/${animeId}`);
        const data = await res.json();
        if (!Array.isArray(data)) {
            list.innerHTML = '<div class="comment-empty">加载失败</div>';
            return;
        }
        commentsData = data;
        count.textContent = data.length;
        renderComments();
    } catch (e) {
        list.innerHTML = '<div class="comment-empty">加载失败</div>';
    }
}

function renderComments() {
    const list = document.getElementById('commentList');
    if (commentsData.length === 0) {
        list.innerHTML = '<div class="comment-empty">还没有评论，来抢沙发~</div>';
        return;
    }
    let sorted = [...commentsData];
    if (commentSort === 'hot') {
        sorted.sort((a, b) => a.id - b.id);
    } else {
        sorted.sort((a, b) => b.id - a.id);
    }
    list.innerHTML = sorted.map(c => renderCommentItem(c)).join('');
    list.querySelectorAll('.comment-del').forEach(btn => {
        btn.onclick = async (e) => {
            e.stopPropagation();
            const cid = btn.getAttribute('data-cid');
            if (!confirm('确定删除这条评论？')) return;
            await deleteComment(cid);
        };
    });
}

function renderCommentItem(c) {
    const timeStr = formatTime(c.created_at);
    const avatar = (c.username || '匿')[0].toUpperCase();
    const uid = c.uid || 0;

    const user = getCurrentUser();
    const ADMIN_UIDS = [1];
    const isOwner = user && user.uid === uid;
    const isAdmin = user && ADMIN_UIDS.includes(user.uid);
    const canDelete = isOwner || isAdmin;

    const delBtn = canDelete
        ? '<button class="comment-del" data-cid="' + c.id + '" style="margin-left:auto;padding:2px 8px;font-size:12px;color:#9499a0;background:none;border:1px solid #e3e5e7;border-radius:4px;cursor:pointer;">删除</button>'
        : '';

    return '<div class="comment-item" data-cid="' + c.id + '">' +
        '<div class="avatar">' + avatar + '</div>' +
        '<div class="body">' +
            '<div class="head" style="display:flex;align-items:center;gap:8px;">' +
                '<span class="username"><a href="./user.html?uid=' + uid + '">' + escapeHtml(c.username || '匿名') + '</a></span>' +
                '<span class="time">' + timeStr + '</span>' +
                delBtn +
            '</div>' +
            '<div class="content">' + escapeHtml(c.content) + '</div>' +
        '</div>' +
    '</div>';
}

function renderCommentInput() {
    const wrap = document.getElementById('commentInputWrap');
    const user = getCurrentUser();
    if (!user) {
        wrap.innerHTML = '<div class="comment-login-tip">请先 <a href="./index.html">登录</a> 后发表评论</div>';
        return;
    }
    const name = user.nickname || user.username;
    wrap.innerHTML =
        '<div class="comment-input-area">' +
            '<div class="comment-avatar">' + escapeHtml(name[0].toUpperCase()) + '</div>' +
            '<div class="comment-input-box">' +
                '<textarea id="commentInput" placeholder="发一条友善的评论"></textarea>' +
                '<div class="submit-row"><button class="submit-btn" id="commentSend">发布</button></div>' +
            '</div>' +
        '</div>';
    document.getElementById('commentSend').onclick = sendComment;
}

async function sendComment() {
    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    if (!content) return;
    const user = getCurrentUser();
    if (!user) { alert('请先登录'); return; }
    if (!currentAnime) return;

    const btn = document.getElementById('commentSend');
    btn.disabled = true;
    btn.textContent = '发布中';
    try {
        const res = await fetch(`${API_BASE}/api/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user.token },
            body: JSON.stringify({ animeId: currentAnime.id, content })
        });
        const data = await res.json();
        if (data.ok) {
            input.value = '';
            loadComments(currentAnime.id);
        } else {
            alert(data.error || '发送失败');
        }
    } catch (e) {
        alert('网络错误：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '发布';
    }
}

async function deleteComment(commentId) {
    const user = getCurrentUser();
    if (!user) { alert('请先登录'); return; }

    try {
        const res = await fetch(`${API_BASE}/api/comment/${commentId}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + user.token }
        });
        const data = await res.json();
        if (data.ok) {
            commentsData = commentsData.filter(c => c.id !== commentId);
            document.getElementById('commentCount').textContent = commentsData.length;
            renderComments();
        } else {
            alert(data.error || '删除失败');
        }
    } catch (e) {
        alert('网络错误：' + e.message);
    }
}

function formatTime(str) {
    if (!str) return '';
    const d = new Date(str.replace(' ', 'T') + 'Z');
    if (isNaN(d.getTime())) return str;

    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    const absTime = y + '-' + m + '-' + day + ' ' + hh + ':' + mi;

    const now = new Date();
    const diff = (now - d) / 1000;
    let rel = '';
    if (diff < 60) rel = '刚刚';
    else if (diff < 3600) rel = Math.floor(diff / 60) + ' 分钟前';
    else if (diff < 86400) rel = Math.floor(diff / 3600) + ' 小时前';
    else if (diff < 86400 * 7) rel = Math.floor(diff / 86400) + ' 天前';

    return rel ? (rel + ' · ' + absTime) : absTime;
}
