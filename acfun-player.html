<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AcFun 播放 - 櫻花动漫</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.6 "Microsoft YaHei",Arial,sans-serif; background:#0d0d0d; color:#ddd; }
.header { background:#1a1a1a; padding:12px 20px; display:flex; align-items:center; gap:16px; border-bottom:1px solid #333; }
.header a { color:#00a1d6; text-decoration:none; font-weight:bold; }
.header h1 { font-size:16px; color:#fff; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wrap { max-width:1200px; margin:0 auto; padding:16px; }
.video-box { background:#000; border-radius:6px; overflow:hidden; position:relative; aspect-ratio:16/9; }
video { width:100%; height:100%; display:block; background:#000; }
.info { margin-top:14px; padding:14px 18px; background:#1a1a1a; border-radius:6px; }
.info h2 { font-size:15px; color:#fff; margin-bottom:8px; }
.info .meta { font-size:12px; color:#888; margin-bottom:10px; }
.status { padding:40px 0; text-align:center; color:#666; }
.quality-list { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.quality-btn { padding:5px 12px; background:#2a2a2a; color:#ccc; border:1px solid #444; border-radius:3px; cursor:pointer; font-size:12px; }
.quality-btn:hover { background:#333; color:#fff; }
.quality-btn.on { background:#00a1d6; color:#fff; border-color:#00a1d6; }
.pages-section { margin-top:16px; padding:14px 18px; background:#1a1a1a; border-radius:6px; }
.pages-section h3 { font-size:14px; color:#fff; margin-bottom:10px; }
.pages-list { display:flex; flex-wrap:wrap; gap:8px; }
.page-btn {
    padding:6px 14px; background:#2a2a2a; color:#ccc;
    border:1px solid #444; border-radius:3px; cursor:pointer;
    font-size:12px; font-family:inherit;
    max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.page-btn:hover { background:#333; color:#fff; }
.page-btn.on { background:#00a1d6; color:#fff; border-color:#00a1d6; }
</style>
</head>
<body>

<div class="header">
    <a href="./index.html">← 返回首页</a>
    <h1 id="pageTitle">加载中...</h1>
</div>

<div class="wrap">
    <div class="video-box">
        <video id="video" controls playsinline preload="metadata"></video>
    </div>
    <div class="status" id="status">正在获取视频地址...</div>
    <div class="info" id="info" style="display:none;">
        <h2 id="videoTitle"></h2>
        <div class="meta" id="videoMeta"></div>
        <div class="quality-list" id="qualityList"></div>
    </div>
    <div class="pages-section" id="pagesSection" style="display:none;">
        <h3>📚 选集</h3>
        <div class="pages-list" id="pagesList"></div>
    </div>
</div>

<script>
const API_BASE = 'https://api.imomoe.dpdns.org';

const params = new URLSearchParams(location.search);
const videoId = params.get('id');         // 单视频模式
const albumId = params.get('album');       // 合集模式
const title = params.get('title') || '';
let currentP = parseInt(params.get('p')) || 1;

let hls = null;

// 状态：当前播放列表（单视频模式只有1个，合集模式有N个）
let playlist = [];       // [{ac, title, p}]
let currentIndex = 0;

if (albumId) {
    // 合集模式
    document.title = (title || 'AcFun 合集') + ' - 櫻花动漫';
    document.getElementById('pageTitle').textContent = title || 'AcFun 合集 ' + albumId;
    initCollection(albumId);
} else if (videoId) {
    // 单视频模式
    document.title = (title || 'AcFun') + ' - 櫻花动漫';
    document.getElementById('pageTitle').textContent = title || 'AcFun 视频 ' + videoId;
    initSingleVideo(videoId, currentP);
} else {
    document.getElementById('status').textContent = '缺少参数（id 或 album）';
}

// ---------- 单视频模式 ----------
async function initSingleVideo(videoId, p) {
    const status = document.getElementById('status');
    status.textContent = '正在获取视频地址...';

    try {
        const res = await fetch(`${API_BASE}/api/acfun/${videoId}?p=${p}`);
        const data = await res.json();

        if (!data.ok || !data.urls || !data.urls.length) {
            status.textContent = '未找到视频：' + (data.error || '未知错误');
            return;
        }

        playlist = [{ ac: videoId, p: p, title: data.videoTitle || ('第 ' + p + ' 集') }];
        currentIndex = 0;
        renderPages();
        setupPlayer(data.urls, data.videoTitle || title, p);
    } catch (err) {
        status.textContent = '获取失败：' + err.message;
    }
}

// ---------- 合集模式 ----------
async function initCollection(albumId) {
    const status = document.getElementById('status');
    status.textContent = '正在加载合集列表...';

    try {
        const res = await fetch(`${API_BASE}/api/acfun-collection/${albumId}`);
        const data = await res.json();

        if (!data.ok || !data.list || !data.list.length) {
            status.textContent = '未找到合集：' + (data.error || '未知错误');
            return;
        }

        playlist = data.list.map(item => ({
            ac: item.ac,
            p: item.p,
            title: item.title
        }));
        currentIndex = 0;
        renderPages();
        loadCurrent();
    } catch (err) {
        status.textContent = '获取失败：' + err.message;
    }
}

// 加载当前 index 对应的视频
async function loadCurrent() {
    if (currentIndex < 0 || currentIndex >= playlist.length) return;

    const item = playlist[currentIndex];
    const status = document.getElementById('status');
    status.textContent = '正在获取视频地址...';
    status.style.display = 'block';

    const video = document.getElementById('video');
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();

    try {
        const res = await fetch(`${API_BASE}/api/acfun/${item.ac}?p=1`);
        const data = await res.json();

        if (!data.ok || !data.urls || !data.urls.length) {
            status.textContent = '未找到视频：' + (data.error || '未知错误');
            return;
        }

        setupPlayer(data.urls, item.title, item.p);

        // 更新 URL 参数（方便分享）
        const newUrl = new URL(location.href);
        newUrl.searchParams.set('album', albumId || '');
        newUrl.searchParams.set('p', item.p);
        history.replaceState({}, '', newUrl);
    } catch (err) {
        status.textContent = '获取失败：' + err.message;
    }
}

function renderPages() {
    const pagesSection = document.getElementById('pagesSection');
    const pagesList = document.getElementById('pagesList');

    if (playlist.length <= 1) {
        pagesSection.style.display = 'none';
        return;
    }

    pagesSection.style.display = 'block';
    pagesList.innerHTML = '';

    playlist.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (idx === currentIndex ? ' on' : '');
        btn.textContent = item.title || ('第 ' + item.p + ' 集');
        btn.title = item.title || '';
        btn.onclick = () => {
            currentIndex = idx;
            renderPages();
            loadCurrent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        pagesList.appendChild(btn);
    });
}

function setupPlayer(urls, videoTitle, p) {
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const qualityList = document.getElementById('qualityList');

    qualityList.innerHTML = '';

    function getLevel(q) {
        const s = (q || '').toLowerCase();
        if (s.includes('1080')) return 100;
        if (s.includes('720')) return 80;
        if (s.includes('480')) return 60;
        if (s.includes('360')) return 40;
        return 50;
    }

    const sorted = urls.map(u => ({ ...u, level: getLevel(u.quality) })).sort((a, b) => b.level - a.level);
    const unique = [];
    const seen = new Set();
    for (const item of sorted) {
        const name = item.quality || '默认';
        if (!seen.has(name)) { seen.add(name); unique.push(item); }
    }

    function playAt(item, btn) {
        const proxy = API_BASE + '/api/video-proxy?url=' + encodeURIComponent(item.url);
        const isM3u8 = item.url.includes('.m3u8');

        if (hls) { hls.destroy(); hls = null; }

        if (isM3u8 && window.Hls && Hls.isSupported()) {
            hls = new Hls({ enableWorker: true });
            hls.loadSource(proxy);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            hls.on(Hls.Events.ERROR, (e, data) => {
                console.error('HLS 错误：', data);
            });
        } else {
            video.src = proxy;
            video.play().catch(() => {});
        }

        status.style.display = 'none';
        info.style.display = 'block';
        document.getElementById('videoTitle').textContent = videoTitle || title || 'AcFun';
        document.getElementById('videoMeta').textContent =
            '来源：AcFun' + (playlist.length > 1 ? ' · 第 ' + p + ' 集' : '') +
            ' · 清晰度：' + (item.quality || '默认');

        if (btn) {
            qualityList.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
        }
    }

    unique.forEach((item, i) => {
        const btn = document.createElement('button');
        btn.className = 'quality-btn' + (i === 0 ? ' on' : '');
        btn.textContent = item.quality || '默认';
        btn.onclick = () => playAt(item, btn);
        qualityList.appendChild(btn);
    });

    // 自动下一集
    video.onended = () => {
        if (currentIndex < playlist.length - 1) {
            currentIndex++;
            renderPages();
            loadCurrent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    playAt(unique[0]);
}
</script>

</body>
</html>
