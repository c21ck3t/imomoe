<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 - 櫻花动漫</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#18191c; background:#f1f2f3;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; outline:none; background:none; color:inherit; }
input, textarea, select { font-family:inherit; outline:none; border:none; }

.header {
    background:#fff; height:56px; padding:0 24px;
    display:flex; align-items:center; gap:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    position:sticky; top:0; z-index:100;
}
.logo { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:bold; color:#fb7299; }
.logo svg { width:28px; height:28px; }
.header .spacer { flex:1; }
.header .user-area { display:flex; align-items:center; gap:10px; font-size:13px; color:#61666d; }
.header .avatar {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg,#fb7299,#fc8bab);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:14px;
}
.header .username { color:#00aeec; font-weight:500; }
.header .back-link { padding:6px 12px; font-size:14px; border-radius:6px; }
.header .back-link:hover { background:#f1f2f3; }

.wrap { max-width:1200px; margin:20px auto; padding:0 24px; }

.toolbar {
    background:#fff; border-radius:8px; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
}
.toolbar h1 { font-size:20px; font-weight:600; }
.toolbar .actions { display:flex; gap:8px; align-items:center; }
.btn {
    padding:8px 18px; border-radius:6px;
    font-size:13px; font-weight:600;
    transition:all .15s;
    display:inline-flex; align-items:center; gap:6px;
}
.btn-primary { background:#fb7299; color:#fff; }
.btn-primary:hover { background:#fc8bab; }
.btn-secondary { background:#f1f2f3; color:#61666d; }
.btn-secondary:hover { background:#e3e5e7; }
.btn-danger { background:#f55; color:#fff; }
.btn-danger:hover { background:#d44; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-mini { padding:4px 10px; font-size:12px; border-radius:4px; }

.list-card { background:#fff; border-radius:8px; overflow:hidden; }
.list-item {
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
    border-bottom:1px solid #f1f2f3;
    transition:background .15s;
}
.list-item:last-child { border-bottom:none; }
.list-item:hover { background:#f9f9fa; }
.list-item .cover {
    width:80px; height:50px;
    border-radius:4px; overflow:hidden;
    background:#f1f2f3; flex-shrink:0;
}
.list-item .cover img { width:100%; height:100%; object-fit:cover; display:block; }
.list-item .info { flex:1; min-width:0; }
.list-item .title {
    font-size:14px; font-weight:600; color:#18191c;
    margin-bottom:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.list-item .meta {
    font-size:12px; color:#9499a0;
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
}
.list-item .meta .badge {
    display:inline-block; padding:1px 6px;
    background:#e5f4ff; color:#00aeec;
    border-radius:3px; font-size:11px;
}
.list-item .meta .badge.acfun { background:#e5f4ff; color:#00aeec; }
.list-item .meta .badge.bili { background:#ffe6ee; color:#fb7299; }
.list-item .meta .badge.mfuns { background:#e6f7ee; color:#22aa55; }
.list-item .meta .badge.direct { background:#f0e6ff; color:#8800ff; }
.list-item .meta .badge.none { background:#f1f2f3; color:#9499a0; }
.list-item .meta .badge.ongoing { background:#fff0e6; color:#ff8800; }
.list-item .meta .badge.finished { background:#e6f7ee; color:#22aa55; }
.list-item .meta .owner {
    color:#00aeec; font-weight:600;
    background:#e5f4ff;
    padding:1px 8px; border-radius:3px;
}
.list-item .ops { display:flex; gap:6px; flex-shrink:0; }

.empty {
    padding:60px 20px; text-align:center;
    color:#9499a0; font-size:14px;
}
.empty .emoji { font-size:36px; display:block; margin-bottom:10px; }
.empty .sub { font-size:12px; color:#b5b9bf; margin-top:6px; }

.modal-mask {
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:20px;
    overflow-y:auto;
}
.modal-box {
    background:#fff; border-radius:10px;
    width:100%; max-width:760px;
    max-height:calc(100vh - 40px);
    display:flex; flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
}
.modal-header {
    padding:18px 24px;
    border-bottom:1px solid #f1f2f3;
    display:flex; justify-content:space-between; align-items:center;
}
.modal-header h2 { font-size:18px; font-weight:600; }
.modal-close {
    font-size:24px; color:#9499a0; line-height:1;
    background:none; border:none; cursor:pointer;
}
.modal-close:hover { color:#f00; }
.modal-body {
    padding:20px 24px;
    overflow-y:auto; flex:1;
}
.modal-footer {
    padding:14px 24px;
    border-top:1px solid #f1f2f3;
    display:flex; justify-content:flex-end; gap:10px;
}

.form-row { margin-bottom:16px; }
.form-row label {
    display:block; font-size:13px; color:#61666d;
    margin-bottom:6px; font-weight:500;
}
.form-row label .req { color:#f00; }
.form-row input[type="text"],
.form-row input[type="number"],
.form-row textarea,
.form-row select {
    width:100%; padding:8px 12px;
    background:#f9f9fa; border:1px solid #e3e5e7;
    border-radius:6px; font-size:13px;
    color:#18191c;
    transition:all .15s;
}
.form-row input:focus,
.form-row textarea:focus,
.form-row select:focus {
    border-color:#00aeec; background:#fff;
}
.form-row textarea { min-height:80px; resize:vertical; }
.form-row .hint { font-size:12px; color:#9499a0; margin-top:4px; }
.form-row-flex { display:flex; gap:12px; }
.form-row-flex > div { flex:1; }
.form-msg {
    padding:10px 14px; border-radius:6px;
    font-size:13px; margin-bottom:16px; display:none;
}
.form-msg.err { background:#ffe6e6; color:#f00; display:block; }
.form-msg.ok { background:#e6f7e6; color:#22aa55; display:block; }

/* 分季 */
.season-section {
    border: 1px solid #e3e5e7;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    background: #fafbfc;
}
.season-section-title {
    font-size:14px; font-weight:600;
    margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between;
}
.season-tabs {
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:12px;
}
.season-tab {
    padding: 5px 12px;
    background:#f1f2f3;
    border-radius: 6px;
    font-size:13px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .15s;
    display: inline-flex; align-items: center; gap:6px;
}
.season-tab:hover { background:#e3e5e7; }
.season-tab.on {
    background:#fff0f5; color:#fb7299;
    border-color:#fb7299;
    font-weight:600;
}
.season-tab .del-x {
    width:16px; height:16px; border-radius:50%;
    background:rgba(0,0,0,.06);
    color:#9499a0;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1;
    cursor:pointer;
}
.season-tab .del-x:hover { background:#f55; color:#fff; }

.season-editor {
    background:#fff;
    border-radius:6px;
    padding:14px 16px;
    border: 1px solid #e3e5e7;
}
.season-editor .form-row { margin-bottom:12px; }
.season-editor .form-row:last-child { margin-bottom: 0; }

.eps-editor-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 8px; font-size: 13px; font-weight: 600;
}
.eps-editor-head .count { font-weight:normal; color:#9499a0; font-size:12px; }
.eps-editor-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 10px;
}
.eps-list {
    max-height: 320px; overflow-y:auto;
    border: 1px solid #f1f2f3; border-radius:6px;
    padding: 8px;
    background:#fff;
}
.eps-list::-webkit-scrollbar { width:6px; }
.eps-list::-webkit-scrollbar-thumb { background:#e3e5e7; border-radius:3px; }
.ep-row {
    display:flex; align-items:center; gap:8px;
    padding: 5px 4px;
    border-bottom: 1px solid #f6f7f8;
}
.ep-row:last-child { border-bottom:none; }
.ep-row .ep-label {
    flex-shrink:0;
    min-width: 52px;
    font-size: 12px; color:#61666d;
    font-weight:600;
}
.ep-row input {
    flex:1;
    padding: 5px 10px;
    background:#f9f9fa;
    border: 1px solid #e3e5e7;
    border-radius: 4px;
    font-size: 12px;
}
.ep-row input:focus { border-color:#00aeec; background:#fff; }
.ep-row .del-btn {
    flex-shrink:0;
    width: 22px; height: 22px;
    border-radius: 50%;
    color: #9499a0;
    font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
}
.ep-row .del-btn:hover { background: #f55; color: #fff; }
.eps-empty {
    padding: 24px;
    text-align: center;
    color: #9499a0;
    font-size: 12px;
    line-height: 1.8;
}
.eps-empty .sub {
    font-size: 11px;
    color: #b5b9bf;
    margin-top: 4px;
}

/* 审核面板 */
.review-tabs {
    display:flex; gap:12px; font-size:13px;
    padding-bottom:12px;
    border-bottom:1px solid #f1f2f3;
    margin-bottom:16px;
}
.review-tabs a { color:#9499a0; padding-bottom:2px; cursor:pointer; }
.review-tabs a.on { color:#18191c; font-weight:600; }

.review-item {
    border:1px solid #f1f2f3;
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:12px;
    background:#fff;
}
.review-item .row { display:flex; gap:12px; }
.review-item .cover {
    width:80px; height:107px;
    object-fit:cover;
    border-radius:4px;
    background:#f1f2f3;
    flex-shrink:0;
}
.review-item .info { flex:1; min-width:0; }
.review-item .title { font-size:15px; font-weight:600; margin-bottom:6px; word-break:break-word; }
.review-item .meta-line {
    font-size:12px; color:#9499a0;
    margin-bottom:6px;
    display:flex; gap:12px; flex-wrap:wrap;
}
.review-item .desc {
    font-size:12px; color:#61666d;
    line-height:1.6;
    max-height:60px;
    overflow:hidden;
    margin-bottom:8px;
}
.review-item .season-summary { font-size:12px; color:#61666d; margin-bottom:10px; }
.review-item .ops { display:flex; gap:8px; flex-wrap:wrap; }
.review-item .status-badge { font-size:12px; color:#9499a0; padding:4px 0; }
.review-item .status-badge.ok { color:#22aa55; }
.review-item .status-badge.err { color:#f00; }

.review-detail {
    margin-top:12px;
    padding:12px 14px;
    background:#f9f9fa;
    border-radius:6px;
    font-size:12px;
    line-height:1.8;
    max-height:300px;
    overflow-y:auto;
    display:none;
}
.review-detail.open { display:block; }
.review-detail .season-title { font-weight:600; color:#18191c; margin-top:6px; margin-bottom:4px; }
.review-detail .ep-line { color:#61666d; padding-left:12px; word-break:break-all; }
.review-detail .ep-url { color:#00aeec; font-size:11px; padding-left:24px; word-break:break-all; }

/* 拒绝访问 */
.denied {
    max-width:480px; margin:80px auto;
    background:#fff; border-radius:10px;
    padding:40px 32px; text-align:center;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.denied .emoji { font-size:48px; display:block; margin-bottom:16px; }
.denied h2 { font-size:20px; font-weight:600; margin-bottom:12px; }
.denied p { color:#9499a0; font-size:13px; line-height:1.8; margin-bottom:20px; }
.denied a {
    display:inline-block; padding:8px 24px;
    background:#fb7299; color:#fff; border-radius:6px;
    font-size:13px; font-weight:600;
}
</style>
</head>
<body>

<div class="header">
    <a class="logo" href="./index.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l7 4.5-7 4.5z"/></svg>
        櫻花动漫
    </a>
    <a class="back-link" href="./index.html">← 返回首页</a>
    <div class="spacer"></div>
    <div class="user-area" id="userArea"></div>
</div>

<div class="wrap" id="wrap">
    <div class="empty">
        <span class="emoji">⏳</span>
        加载中...
    </div>
</div>

<script>
const API_BASE = 'https://api.imomoe.dpdns.org';
const ADMIN_UID = 1;

const $ = s => document.querySelector(s);

function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}

function getCurrentUser() {
    try {
        const raw = localStorage.getItem('imomoe_user');
        return raw ? JSON.parse(raw) : null;
    } catch { return null; }
}

function isAdmin() {
    const u = getCurrentUser();
    return u && Number(u.uid) === ADMIN_UID;
}

let allAnimes = [];
let seasonsState = [];
let currentSeasonIdx = 0;

// ============================================================
// 用户区
// ============================================================
function renderUserArea() {
    const area = $('#userArea');
    const user = getCurrentUser();
    if (user) {
        area.innerHTML = '<div class="avatar">' + escapeHtml(user.username[0].toUpperCase()) + '</div>' +
                         '<span class="username">' + escapeHtml(user.username) + '</span>' +
                         '<button class="logout-btn" id="logoutBtn" style="padding:4px 10px;background:#eee;color:#666;border:1px solid #ddd;border-radius:3px;cursor:pointer;font-size:12px;">退出</button>';
        $('#logoutBtn').onclick = () => {
            localStorage.removeItem('imomoe_user');
            location.href = './index.html';
        };
    } else {
        area.innerHTML = '<a href="./index.html" style="color:#fb7299;font-weight:600;">去登录</a>';
    }
}

// ============================================================
// 拒绝访问
// ============================================================
function renderDenied(reason) {
    $('#wrap').innerHTML =
        '<div class="denied">' +
            '<span class="emoji">🔒</span>' +
            '<h2>无权访问</h2>' +
            '<p>' + escapeHtml(reason) + '</p>' +
            '<a href="./index.html">返回首页</a>' +
        '</div>';
}

// ============================================================
// 启动
// ============================================================
function boot() {
    renderUserArea();

    const user = getCurrentUser();
    if (!user) {
        renderDenied('请先登录管理员账号');
        return;
    }

    if (!isAdmin()) {
        renderDenied('此页面仅管理员可访问。你的 UID 是 ' + user.uid + '，管理员 UID 是 ' + ADMIN_UID + '。');
        return;
    }

    loadAllAnimes();
}

// ============================================================
// 加载全部番剧（管理员视角）
// ============================================================
async function loadAllAnimes() {
    $('#wrap').innerHTML = '<div class="empty"><span class="emoji">⏳</span>加载中...</div>';

    try {
        const res = await fetch(`${API_BASE}/api/animes?scope=all`);
        const data = await res.json();
        if (!data.ok) {
            $('#wrap').innerHTML = '<div class="empty"><span class="emoji">😢</span>加载失败：' + escapeHtml(data.error || '未知错误') + '</div>';
            return;
        }
        allAnimes = data.list || [];
        renderList();
    } catch (e) {
        $('#wrap').innerHTML = '<div class="empty"><span class="emoji">😢</span>网络错误：' + escapeHtml(e.message) + '</div>';
    }
}

function getSourceBadge(anime) {
    const seasons = anime.seasons || [];
    const badges = [];
    const seen = new Set();
    seasons.forEach(s => {
        if (seen.has(s.source)) return;
        seen.add(s.source);
        if (s.source === 'acfun') badges.push('<span class="badge acfun">A站</span>');
        if (s.source === 'bili') badges.push('<span class="badge bili">B站</span>');
        if (s.source === 'mfuns') badges.push('<span class="badge mfuns">MFuns</span>');
        if (s.source === 'direct') badges.push('<span class="badge direct">直链</span>');
    });
    if (badges.length === 0) badges.push('<span class="badge none">无源</span>');
    return badges.join(' ');
}

function getAirBadge(anime) {
    if (anime.airStatus === 'ongoing') return '<span class="badge ongoing">连载</span>';
    return '<span class="badge finished">完结</span>';
}

function renderList() {
    const user = getCurrentUser();
    if (!user || !isAdmin()) { boot(); return; }

    let html = '';
    html += '<div class="toolbar">';
    html += '  <h1>全部番剧 <span style="font-size:14px;color:#9499a0;font-weight:normal;">（共 ' + allAnimes.length + ' 部）</span></h1>';
    html += '  <div class="actions">';
    html += '    <button class="btn btn-secondary" id="reviewBtn">审核投稿 <span id="pendingCount" style="display:none;background:#f00;color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px;line-height:16px;"></span></button>';
    html += '    <button class="btn btn-primary" id="newBtn">+ 添加番剧</button>';
    html += '  </div>';
    html += '</div>';

    if (allAnimes.length === 0) {
        html += '<div class="list-card"><div class="empty">';
        html += '<span class="emoji">📺</span>还没有任何番剧';
        html += '</div></div>';
    } else {
        html += '<div class="list-card">';
        allAnimes.forEach(a => {
            const ownerLabel = a.ownerName ? escapeHtml(a.ownerName) : ('UID ' + a.ownerUid);
            html += '<div class="list-item">';
            html += '  <div class="cover"><img src="' + escapeHtml(a.coverH || a.coverV) + '" onerror="this.src=\'data:image/svg+xml;utf8,' +
                encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="50"><rect width="80" height="50" fill="#e2e2e2"/></svg>') + '\'"></div>';
            html += '  <div class="info">';
            html += '    <div class="title">' + escapeHtml(a.title) + '</div>';
            html += '    <div class="meta">';
            html += '      <span>' + escapeHtml(a.iv || ('iv' + a.id)) + '</span>';
            html += '      <span>' + getSourceBadge(a) + '</span>';
            html += '      <span>' + getAirBadge(a) + '</span>';
            html += '      <span>' + (a.year || '') + '年' + (a.month || '') + '</span>';
            html += '      <span class="owner">👤 ' + ownerLabel + '</span>';
            html += '      <span>' + ((a.seasons?.length || 0)) + ' 个季/源</span>';
            html += '    </div>';
            html += '  </div>';
            html += '  <div class="ops">';
            html += '    <button class="btn btn-secondary btn-sm" data-action="view" data-id="' + a.id + '">查看</button>';
            html += '    <button class="btn btn-primary btn-sm" data-action="edit" data-id="' + a.id + '">编辑</button>';
            html += '    <button class="btn btn-danger btn-sm" data-action="delete" data-id="' + a.id + '">删除</button>';
            html += '  </div>';
            html += '</div>';
        });
        html += '</div>';
    }

    $('#wrap').innerHTML = html;

    $('#newBtn').onclick = () => openForm(null);
    $('#reviewBtn').onclick = openReviewPanel;
    loadPendingCount();

    document.querySelectorAll('[data-action]').forEach(btn => {
        const action = btn.getAttribute('data-action');
        const id = parseInt(btn.getAttribute('data-id'));
        if (action === 'view') {
            btn.onclick = () => window.open('./acfun-player.html?iv=iv' + id, '_blank');
        } else if (action === 'edit') {
            btn.onclick = () => openForm(id);
        } else if (action === 'delete') {
            btn.onclick = () => deleteAnime(id);
        }
    });
}

// ============================================================
// 表单
// ============================================================
function openForm(editId) {
    const isEdit = editId !== null && editId !== undefined;
    let anime = { links: {}, seasons: [] };
    if (isEdit) {
        const found = allAnimes.find(x => x.id === editId);
        if (found) anime = found;
    }

    seasonsState = [];
    if (Array.isArray(anime.seasons) && anime.seasons.length > 0) {
        seasonsState = JSON.parse(JSON.stringify(anime.seasons));
        seasonsState.forEach(s => {
            if (!Array.isArray(s.eps)) s.eps = [];
            s.eps.forEach(e => { if (typeof e.url !== 'string') e.url = ''; });
        });
    } else {
        const l = anime.links || {};
        if (l.a) seasonsState.push({ name: '第一季', source: 'acfun', url: l.a, eps: [] });
        if (l.mfuns) seasonsState.push({ name: 'MFuns', source: 'mfuns', url: l.mfuns, eps: [] });
        if (l.b) seasonsState.push({ name: 'B站', source: 'bili', url: l.b, eps: [] });
    }
    if (seasonsState.length === 0) {

function renderSeasonTabs() {
    const box = $('#seasonTabs');
    if (!box) return;
    box.innerHTML = seasonsState.map((s, i) =>
        '<div class="season-tab' + (i === currentSeasonIdx ? ' on' : '') + '" data-idx="' + i + '">' +
            escapeHtml(s.name || ('第' + (i+1) + '季')) +
            (seasonsState.length > 1 ? '<span class="del-x" data-del="' + i + '" title="删除此季">×</span>' : '') +
        '</div>'
    ).join('');

    box.querySelectorAll('.season-tab').forEach(el => {
        el.onclick = (e) => {
            if (e.target.classList.contains('del-x')) {
                const di = parseInt(e.target.getAttribute('data-del'));
                if (!confirm('删除「' + (seasonsState[di].name || '此季') + '」？')) return;
                seasonsState.splice(di, 1);
                if (currentSeasonIdx >= seasonsState.length) currentSeasonIdx = seasonsState.length - 1;
                renderSeasonTabs();
                renderSeasonEditor();
                return;
            }
            currentSeasonIdx = parseInt(el.getAttribute('data-idx'));
            renderSeasonTabs();
            renderSeasonEditor();
        };
    });
}

function renderSeasonEditor() {
    const box = $('#seasonEditor');
    if (!box) return;
    const s = seasonsState[currentSeasonIdx];
    if (!s) { box.innerHTML = ''; return; }

    const isDirect = s.source === 'direct';

    let html = '';
    html += '<div class="form-row">';
    html += '  <label>季名 / 分组名</label>';
    html += '  <input type="text" id="s-name" placeholder="例如：第一季 / 剧场版 / OVA" value="' + escapeHtml(s.name || '') + '">';
    html += '  <div class="hint">预设：第一季 / 第二季 / 第三季 / 剧场版 / OVA / SP / WEB / 特别篇</div>';
    html += '</div>';

    html += '<div class="form-row">';
    html += '  <label>来源</label>';
    html += '  <select id="s-source">';
    ['acfun', 'mfuns', 'bili', 'direct'].forEach(src => {
        const names = { acfun: 'AcFun（合集或单视频）', mfuns: 'MFuns', bili: 'B站（外链）', direct: '直链（mp4/m3u8，可多集）' };
        html += '<option value="' + src + '"' + (s.source === src ? ' selected' : '') + '>' + names[src] + '</option>';
    });
    html += '  </select>';
    html += '</div>';

    if (!isDirect) {
        html += '<div class="form-row">';
        html += '  <label>链接</label>';
        html += '  <input type="text" id="s-url" placeholder="https://www.acfun.cn/a/aaXXXXXXX" value="' + escapeHtml(s.url || '') + '">';
        html += '  <div class="hint" id="urlHint"></div>';
        html += '</div>';
    }

    html += '<div class="eps-editor-head">';
    html += '  <span>集数</span>';
    html += '  <span class="count">（' + (s.eps?.length || 0) + ' 集）</span>';
    html += '</div>';

    html += '<div class="eps-editor-actions">';
    if (isDirect) {
        html += '  <button type="button" class="btn btn-primary btn-mini" id="addEpBtn">+ 添加一集</button>';
        html += '  <button type="button" class="btn btn-secondary btn-mini" id="batchAddEpBtn">批量添加</button>';
        html += '  <button type="button" class="btn btn-secondary btn-mini" id="clearEpsBtn">清空所有集</button>';
    } else {
        html += '  <button type="button" class="btn btn-secondary btn-mini" id="loadEpsBtn">从 AcFun 自动拉取集数</button>';
        html += '  <button type="button" class="btn btn-secondary btn-mini" id="addEpBtn">+ 手动加一集</button>';
        html += '  <button type="button" class="btn btn-secondary btn-mini" id="clearEpsBtn">清空所有自定义标题</button>';
    }
    html += '</div>';

    html += '<div class="eps-list" id="epsList"></div>';

    box.innerHTML = html;

    $('#s-name').oninput = () => {
        s.name = $('#s-name').value;
        renderSeasonTabs();
    };
    $('#s-source').onchange = () => {
        const oldSource = s.source;
        s.source = $('#s-source').value;
        if (s.source === 'direct' && oldSource !== 'direct') {
            s.url = '';
            s.eps = (s.eps || []).map(e => ({ p: e.p, title: e.title || '', url: '' }));
        }
        if (s.source !== 'direct' && oldSource === 'direct') {
            s.eps = (s.eps || []).map(e => ({ p: e.p, title: e.title || '' }));
        }
        renderSeasonEditor();
    };

    if (!isDirect) {
        const urlInput = $('#s-url');
        if (urlInput) urlInput.oninput = () => { s.url = urlInput.value; };
        updateUrlHint();
    }

    if (isDirect) {
        $('#addEpBtn').onclick = () => {
            if (!s.eps) s.eps = [];
            s.eps.push({ p: s.eps.length + 1, title: '', url: '' });
            renderEpsList(s);
        };
        $('#batchAddEpBtn').onclick = () => {
            const n = parseInt(prompt('要一次添加几集？（例如 12）', '12'));
            if (!n || n < 1 || n > 200) return;
            if (!s.eps) s.eps = [];
            const startP = s.eps.length + 1;
            for (let i = 0; i < n; i++) s.eps.push({ p: startP + i, title: '', url: '' });
            renderEpsList(s);
        };
        $('#clearEpsBtn').onclick = () => {
            if (!confirm('清空所有集？')) return;
            s.eps = [];
            renderEpsList(s);
        };
    } else {
        $('#loadEpsBtn').onclick = () => loadAcfunEps(s);
        $('#addEpBtn').onclick = () => {
            if (!s.eps) s.eps = [];
            s.eps.push({ p: s.eps.length + 1, title: '' });
            renderEpsList(s);
        };
        $('#clearEpsBtn').onclick = () => {
            if (!confirm('清空所有自定义标题？所有集会恢复默认"第N话"')) return;
            s.eps = [];
            renderEpsList(s);
        };
    }

    renderEpsList(s);
}

function updateUrlHint() {
    const s = seasonsState[currentSeasonIdx];
    const hint = $('#urlHint');
    if (!hint || !s) return;
    const hints = {
        acfun: 'AcFun 支持合集（/a/aa开头）和单视频（/v/ac开头）',
        mfuns: 'MFuns 视频链接，例如 https://www.mfuns.net/video/12345',
        bili: 'B站链接，会以外链新窗口打开',
    };
    hint.textContent = hints[s.source] || '';
}

function renderEpsList(s) {
    const box = $('#epsList');
    if (!box) return;
    const isDirect = s.source === 'direct';

    if (!s.eps || s.eps.length === 0) {
        if (isDirect) {
            box.innerHTML = '<div class="eps-empty">还没有添加任何集<br><span class="sub">点上方"+ 添加一集"或"批量添加"开始</span></div>';
        } else {
            box.innerHTML = '<div class="eps-empty">还没有自定义集数<br><span class="sub">点"+ 手动加一集"补充标题，或点"自动拉取集数"从 AcFun 拉</span></div>';
        }
        return;
    }

    const cntEl = document.querySelector('.eps-editor-head .count');
    if (cntEl) cntEl.textContent = '（' + s.eps.length + ' 集）';

    box.innerHTML = s.eps.map((ep, i) => {
        if (isDirect) {
            return '<div class="ep-row">' +
                '<span class="ep-label">第' + (ep.p || (i + 1)) + '话</span>' +
                '<input type="text" data-idx="' + i + '" data-field="url" value="' + escapeHtml(ep.url || '') + '" placeholder="直链 URL（mp4/m3u8）" style="flex:2;">' +
                '<input type="text" data-idx="' + i + '" data-field="title" value="' + escapeHtml(ep.title || '') + '" placeholder="标题（可空）" style="flex:1;">' +
                '<button type="button" class="del-btn" data-del-idx="' + i + '">×</button>' +
            '</div>';
        } else {
            return '<div class="ep-row">' +
                '<span class="ep-label">第' + (ep.p || (i + 1)) + '话</span>' +
                '<input type="text" data-idx="' + i + '" data-field="title" value="' + escapeHtml(ep.title || '') + '" placeholder="留空则显示 第' + (ep.p || (i + 1)) + '话">' +
                '<button type="button" class="del-btn" data-del-idx="' + i + '">×</button>' +
            '</div>';
        }
    }).join('');

    box.querySelectorAll('input[data-idx]').forEach(inp => {
        inp.oninput = () => {
            const idx = parseInt(inp.getAttribute('data-idx'));
            const field = inp.getAttribute('data-field');
            if (s.eps[idx]) s.eps[idx][field] = inp.value.trim();
        };
    });
    box.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = () => {
            const idx = parseInt(btn.getAttribute('data-del-idx'));
            if (!confirm('删除第' + (s.eps[idx].p || (idx+1)) + '话？')) return;
            s.eps.splice(idx, 1);
            s.eps.forEach((e, i) => { e.p = i + 1; });
            renderEpsList(s);
        };
    });
}

async function loadAcfunEps(s) {
    if (s.source !== 'acfun') {
        alert('只有 AcFun 源支持自动拉取集数');
        return;
    }
    if (!s.url) { alert('请先填写链接'); return; }

    const btn = $('#loadEpsBtn');
    btn.disabled = true;
    btn.textContent = '拉取中...';

    try {
        const collectionMatch = s.url.match(/acfun\.cn\/a\/aa(\d+)/);
        if (collectionMatch) {
            const res = await fetch(`${API_BASE}/api/acfun-collection/${collectionMatch[1]}`);
            const data = await res.json();
            if (!data.ok || !data.list || data.list.length === 0) {
                alert('拉取失败：' + (data.error || '无返回集数'));
                return;
            }
            const oldEps = s.eps || [];
            s.eps = data.list.map(item => {
                const prev = oldEps.find(e => e.p === item.p);
                return { p: item.p, title: prev ? prev.title : '' };
            });
            renderEpsList(s);
            renderSeasonTabs();
            alert('已拉取 ' + s.eps.length + ' 集');
            return;
        }
        const singleMatch = s.url.match(/acfun\.cn\/v\/ac(\d+)/);
        if (singleMatch) {
            s.eps = [{ p: 1, title: '' }];
            renderEpsList(s);
            alert('单视频，只有 1 集');
            return;
        }
        alert('无法识别链接类型');
    } catch (e) {
        alert('拉取失败：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '从 AcFun 自动拉取集数';
    }
}

async function submitForm(editId) {
    const user = getCurrentUser();
    if (!user || !isAdmin()) { alert('无权操作'); return; }

    const title = $('#f-title').value.trim();
    const coverV = $('#f-coverV').value.trim();
    const msg = $('#formMsg');

    if (!title) { msg.textContent = '标题必填'; msg.className = 'form-msg err'; return; }
    if (!coverV) { msg.textContent = '竖版封面必填'; msg.className = 'form-msg err'; return; }

    const validSeasons = seasonsState.filter(s => {
        if (s.source === 'direct') return (s.eps || []).some(e => e.url && e.url.trim());
        return s.url && s.url.trim();
    });
    if (validSeasons.length === 0) {
        msg.textContent = '至少要填一个有内容的季/源';
        msg.className = 'form-msg err';
        return;
    }

    const payload = {
        title: title,
        alias: $('#f-alias').value.trim() ? $('#f-alias').value.split(',').map(s => s.trim()).filter(Boolean) : [],
        coverV: coverV,
        coverH: $('#f-coverH').value.trim(),
        scope: $('#f-scope').value,
        airStatus: $('#f-airStatus').value,
        homeTitle: $('#f-homeTitle').value.trim() || null,
        bangumiTitle: $('#f-bangumiTitle').value.trim() || null,
        tags: $('#f-tags').value.trim() ? $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean) : [],
        year: $('#f-year').value.trim(),
        month: $('#f-month').value.trim(),
        totalEp: parseInt($('#f-totalEp').value) || 0,
        duration: $('#f-duration').value.trim() || '24:00',
        score: parseFloat($('#f-score').value) || 0,
        description: $('#f-description').value.trim(),
        seasons: validSeasons.map(s => {
            const cleanEps = (s.eps || []).filter(e => e.p).map(e => {
                const out = { p: parseInt(e.p), title: (e.title || '').trim() };
                if (s.source === 'direct') out.url = (e.url || '').trim();
                return out;
            });
            return {
                name: s.name || '第一季',
                source: s.source || 'acfun',
                url: s.source === 'direct' ? '' : (s.url || '').trim(),
                eps: cleanEps
            };
        })
    };

    const submitBtn = $('#formSubmit');
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中...';

    try {
        const url = editId ? `${API_BASE}/api/anime/${editId}` : `${API_BASE}/api/anime`;
        const method = editId ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + user.token
            },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.ok) {
            msg.textContent = editId ? '保存成功！' : '创建成功！iv' + data.id;
            msg.className = 'form-msg ok';
            setTimeout(() => {
                const m = document.getElementById('formModal');
                if (m) m.remove();
                loadAllAnimes();
            }, 800);
        } else {
            msg.textContent = data.error || '操作失败';
            msg.className = 'form-msg err';
            submitBtn.disabled = false;
            submitBtn.textContent = editId ? '保存' : '创建';
        }
    } catch (e) {
        msg.textContent = '网络错误：' + e.message;
        msg.className = 'form-msg err';
        submitBtn.disabled = false;
        submitBtn.textContent = editId ? '保存' : '创建';
    }
}

async function deleteAnime(id) {
    const user = getCurrentUser();
    if (!user || !isAdmin()) { alert('无权操作'); return; }
    const anime = allAnimes.find(x => x.id === id);
    if (!anime) return;
    if (!confirm('确定删除「' + anime.title + '」？\n\n（管理员可删除任何用户的番剧）')) return;

    try {
        const res = await fetch(`${API_BASE}/api/anime/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + user.token }
        });
        const data = await res.json();
        if (data.ok) loadAllAnimes();
        else alert(data.error || '删除失败');
    } catch (e) {
        alert('网络错误：' + e.message);
    }
}

async function loadReviewList(status) {
    const user = getCurrentUser();
    const body = document.getElementById('reviewBody');
    if (!body) return;
    body.innerHTML = '<div class="empty"><span class="emoji">⏳</span>加载中...</div>';

    try {
        const res = await fetch(`${API_BASE}/api/upload/list?status=${status}`, {
            headers: { 'Authorization': 'Bearer ' + user.token }
        });
        const data = await res.json();
        if (!data.ok) {
            body.innerHTML = '<div class="empty">加载失败：' + escapeHtml(data.error || '未知错误') + '</div>';
            return;
        }

        const list = data.list || [];
        const statusNames = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };

        let html = '<div class="review-tabs">' +
            ['pending', 'approved', 'rejected'].map(s =>
                '<a href="javascript:;" data-st="' + s + '" class="' + (s === status ? 'on' : '') + '">' +
                statusNames[s] + '</a>'
            ).join('') + '</div>';

        if (list.length === 0) {
            html += '<div class="empty"><span class="emoji">📭</span>暂无投稿</div>';
        } else {
            list.forEach(item => {
                const totalEps = (item.seasons || []).reduce((a, s) => a + (s.eps || []).length, 0);
                const seasonSummary = (item.seasons || []).map(s =>
                    escapeHtml(s.name || '第一季') + '（' + (s.eps || []).length + '集）'
                ).join(' / ');

                let opsHtml = '';
                if (item.status === 'pending') {
                    opsHtml =
                        '<div class="ops">' +
                            '<button class="btn btn-primary btn-sm" data-approve="' + item.id + '">✓ 通过</button>' +
                            '<button class="btn btn-danger btn-sm" data-reject="' + item.id + '">✕ 拒绝</button>' +
                            '<button class="btn btn-secondary btn-sm" data-detail="' + item.id + '">查看详情</button>' +
                        '</div>';
                } else if (item.status === 'approved') {
                    opsHtml = '<div class="status-badge ok">✅ 已通过 → iv' + (item.animeId || '?') + '</div>' +
                              '<div style="margin-top:6px;"><button class="btn btn-secondary btn-sm" data-detail="' + item.id + '">查看详情</button></div>';
                } else {
                    opsHtml = '<div class="status-badge err">❌ 已拒绝：' + escapeHtml(item.rejectReason || '无原因') + '</div>' +
                              '<div style="margin-top:6px;"><button class="btn btn-secondary btn-sm" data-detail="' + item.id + '">查看详情</button></div>';
                }

                html += '<div class="review-item" data-item-id="' + item.id + '">' +
                    '<div class="row">' +
                        '<img class="cover" src="' + escapeHtml(item.coverV || '') + '" onerror="this.style.display=\'none\'">' +
                        '<div class="info">' +
                            '<div class="title">' + escapeHtml(item.title) + '</div>' +
                            '<div class="meta-line">' +
                                '<span>投稿人：' + escapeHtml(item.username) + '</span>' +
                                '<span>UID ' + item.userId + '</span>' +
                                '<span>' + (item.createdAt || '') + '</span>' +
                            '</div>' +
                            '<div class="meta-line">' +
                                '<span>' + (item.year || '') + '年' + (item.month || '') + '</span>' +
                                '<span>共 ' + totalEps + ' 集</span>' +
                                (item.score ? '<span>评分 ' + item.score + '</span>' : '') +
                            '</div>' +
                            '<div class="season-summary">' + seasonSummary + '</div>' +
                            '<div class="desc">' + escapeHtml(item.description || '（无简介）') + '</div>' +
                            opsHtml +
                        '</div>' +
                    '</div>' +
                    '<div class="review-detail" id="detail-' + item.id + '"></div>' +
                '</div>';
            });
        }

        body.innerHTML = html;

        body.querySelectorAll('.review-tabs a').forEach(a => {
            a.onclick = () => loadReviewList(a.dataset.st);
        });

        body.querySelectorAll('[data-approve]').forEach(btn => {
            btn.onclick = async () => {
                const id = btn.getAttribute('data-approve');
                if (!confirm('通过这条投稿？将立即上线')) return;
                btn.disabled = true;
                try {
                    const r = await fetch(`${API_BASE}/api/upload/${id}/approve`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + user.token }
                    });
                    const d = await r.json();
                    if (d.ok) {
                        alert('已通过，iv' + d.animeId);
                        loadReviewList(status);
                        loadPendingCount();
                        loadAllAnimes();
                    } else alert(d.error || '操作失败');
                } catch (e) { alert('网络错误：' + e.message); }
            };
        });

        body.querySelectorAll('[data-reject]').forEach(btn => {
            btn.onclick = async () => {
                const id = btn.getAttribute('data-reject');
                const reason = prompt('拒绝原因（将显示给投稿人）', '内容不符合要求');
                if (reason === null) return;
                btn.disabled = true;
                try {
                    const r = await fetch(`${API_BASE}/api/upload/${id}/reject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user.token },
                        body: JSON.stringify({ reason })
                    });
                    const d = await r.json();
                    if (d.ok) { loadReviewList(status); loadPendingCount(); }
                    else alert(d.error || '操作失败');
                } catch (e) { alert('网络错误：' + e.message); }
            };
        });

        body.querySelectorAll('[data-detail]').forEach(btn => {
            btn.onclick = async () => {
                const id = btn.getAttribute('data-detail');
                const detailEl = document.getElementById('detail-' + id);
                if (!detailEl) return;

                if (detailEl.classList.contains('open')) {
                    detailEl.classList.remove('open');
                    return;
                }

                detailEl.innerHTML = '加载中...';
                detailEl.classList.add('open');

                try {
                    const r = await fetch(`${API_BASE}/api/upload/${id}`, {
                        headers: { 'Authorization': 'Bearer ' + user.token }
                    });
                    const d = await r.json();
                    if (!d.ok) { detailEl.innerHTML = '加载失败：' + escapeHtml(d.error); return; }

                    const u = d.upload;
                    let h = '';
                    (u.seasons || []).forEach(s => {
                        h += '<div class="season-title">【' + escapeHtml(s.name || '第一季') + '】（' + (s.eps || []).length + '集）</div>';
                        (s.eps || []).forEach(ep => {
                            h += '<div class="ep-line">第' + ep.p + '话 ' + escapeHtml(ep.title || '') + '</div>';
                            h += '<div class="ep-url">' + escapeHtml(ep.url || '') + '</div>';
                        });
                    });
                    detailEl.innerHTML = h || '<div>无季信息</div>';
                } catch (e) {
                    detailEl.innerHTML = '网络错误：' + escapeHtml(e.message);
                }
            };
        });

    } catch (e) {
        body.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
    }
}

// ============================================================
// 启动
// ============================================================
boot();
</script>

</body>
</html>
