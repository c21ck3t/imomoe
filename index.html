<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的动漫链接收藏</title>
    <style>
        /* 严格保留您的基础配色 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            text-align: center; 
            color: #58a6ff; 
            margin-bottom: 10px; 
            font-size: 28px; 
        }
        .subtitle { 
            text-align: center; 
            color: #8b949e; 
            margin-bottom: 30px; 
            font-size: 14px; 
        }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 24px;
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .anime-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 14px;
            transition: transform 0.2s, box-shadow 0.2s; 
            display: flex; 
            flex-direction: column; 
        }
        .anime-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.45); 
        }
        
        .anime-card img { 
            width: 100%; 
            aspect-ratio: 3/4; 
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 14px; 
            background-color: #21262d; 
        }
        
        .anime-title { 
            color: #58a6ff; 
            font-size: 16px; 
            font-weight: bold; 
            margin: 0 0 12px 0; 
            text-align: center; 
        }
        
        .link-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px;
            margin-top: auto; 
            justify-content: center; 
        }
        .link-btn { 
            background-color: #21262d; 
            color: #c9d1d9; 
            text-decoration: none; 
            padding: 7px 15px;
            border-radius: 22px;
            font-size: 13px; 
            border: 1px solid #30363d; 
            transition: all 0.2s; 
            white-space: nowrap;
        }
        .link-btn:hover { 
            background-color: #58a6ff; 
            color: #0d1117; 
            border-color: #58a6ff; 
        }
        
        footer { 
            text-align: center; 
            margin-top: 50px; 
            color: #8b949e; 
            font-size: 14px; 
        }
    </style>
</head>
<body>
    <h1>🎬 我的动漫链接收藏</h1>
    <p class="subtitle">点击卡片下方的标签即可跳转观看</p>
    
    <div class="grid-container">
        
        <!-- ===== 死亡笔记 ===== -->
        <div class="anime-card">
            <img src="images/死亡笔记-封面.jpg" alt="死亡笔记封面">
            <h3 class="anime-title">死亡笔记</h3>
            <div class="link-group">
                <!-- 您填了链接的按钮才会显示 -->
                <a href="https://www.acfun.cn/a/aa6147473" target="_blank" class="link-btn">📺 A站观看</a>
                <!-- 其他平台没填链接，会自动隐藏 -->
                <a href="" class="link-btn">💻 MFuns电脑</a>
                <a href="" class="link-btn">📱 MFuns手机</a>
                <a href="" class="link-btn">📺 B站观看</a>
            </div>
        </div>

        <!-- ===== 穹庐下的魔女 ===== -->
        <div class="anime-card">
            <img src="images/穹庐下的魔女-封面.jpg" alt="穹庐下的魔女封面">
            <h3 class="anime-title">穹庐下的魔女</h3>
            <div class="link-group">
                <a href="https://www.acfun.cn/a/aa6147210" target="_blank" class="link-btn">📺 A站观看</a>
                <!-- 这两个没填链接，会自动隐藏 -->
                <a href="" class="link-btn">📱 MFuns手机</a>
            </div>
        </div>

        <!-- ===== 命运石之门 ===== -->
        <div class="anime-card">
            <img src="images/命运石之门-封面.jpg" alt="命运石之门封面">
            <h3 class="anime-title">命运石之门</h3>
            <div class="link-group">
                <a href="https://www.acfun.cn/a/aa6147474" target="_blank" class="link-btn">📺 A站观看</a>
                <!-- 这两个没填链接，会自动隐藏 -->
                <a href="" class="link-btn">💻 MFuns电脑</a>
            </div>
        </div>
        
    </div>

    <footer>
        <p>Made with ❤️ on GitHub Pages</p>
    </footer>

    <!-- 精确版链接隐藏逻辑 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.link-btn').forEach(btn => {
                const href = btn.getAttribute('href')?.trim() || '';
                
                // 精确判断：空值 / 仅# / 包含"这里"或"放"的占位符
                const isInvalid = 
                    href === '' || 
                    href === '#' || 
                    href.includes('这里') || 
                    href.includes('放') ||
                    href.includes('占位符');
                
                if (isInvalid) {
                    btn.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
