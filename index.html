<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的动漫链接收藏</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 30px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .anime-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; transition: transform 0.2s, box-shadow 0.2s; }
        .anime-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.4); border-color: #58a6ff; }
        .anime-card a { color: #58a6ff; text-decoration: none; font-size: 18px; font-weight: bold; display: block; margin-bottom: 8px; }
        .anime-card a:hover { text-decoration: underline; }
        .anime-card p { margin: 0; font-size: 14px; color: #8b949e; }
        footer { text-align: center; margin-top: 40px; color: #8b949e; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🎬 我的动漫链接收藏</h1>
    
    <div class="grid-container">
        <!-- 下面是一个动漫卡片示例，请复制这组 div 来添加更多动漫 -->
        <div class="anime-card">
            <a href="https://www.acfun.cn/a/aa6147473" target="_blank">死亡笔记</a>
            <p>点击跳转观看</p>
        </div>
        
        <div class="anime-card">
            <a href="https://www.acfun.cn/a/aa6147210" target="_blank">穹庐下的魔女</a>
            <p>点击跳转观看</p>
        </div>

        <div class="anime-card">
            <a href="https://www.acfun.cn/a/aa6147474" target="_blank">命运石之门</a>
            <p>点击跳转观看</p>
        </div>
        <!-- 复制区块结束，你可以按需增加或删减 -->
    </div>

    <footer>
        <p>Made with ❤️ on GitHub Pages</p>
    </footer>
</body>
</html>
