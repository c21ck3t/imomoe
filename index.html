<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樱花动漫</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            text-align: center; 
            color: #58a6ff; 
            margin-bottom: 10px; 
            font-size: 28px; 
        }
        .subtitle { 
            text-align: center; 
            color: #8b949e; 
            margin-bottom: 20px; 
            font-size: 14px; 
        }
        
        .search-container { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        #searchInput { 
            width: 80%; 
            max-width: 500px; 
            padding: 12px 20px; 
            border-radius: 25px; 
            border: 1px solid #30363d; 
            background-color: #161b22; 
            color: #c9d1d9; 
            font-size: 16px; 
            outline: none; 
            transition: border-color 0.3s; 
        }
        #searchInput:focus { 
            border-color: #58a6ff; 
        }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px;
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .anime-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 12px;
            transition: transform 0.2s, box-shadow 0.2s; 
            display: flex; 
            flex-direction: column; 
        }
        .anime-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.45); 
        }
        
        .anime-card img { 
            width: 100%; 
            aspect-ratio: 3/4; 
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            background-color: #21262d; 
        }
        
        .anime-title { 
            color: #58a6ff; 
            font-size: 15px; 
            font-weight: bold; 
            margin: 0 0 10px 0; 
            text-align: center; 
            line-height: 1.3;
        }
        
        .link-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px;
            margin-top: auto; 
            justify-content: center; 
        }
        .link-btn { 
            background-color: #21262d; 
            color: #c9d1d9; 
            text-decoration: none; 
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px; 
            border: 1px solid #30363d; 
            transition: all 0.2s; 
            white-space: nowrap;
        }
        .link-btn:hover { 
            background-color: #58a6ff; 
            color: #0d1117; 
            border-color: #58a6ff; 
        }
        
        @media (max-width: 600px) {
            body { padding: 12px; }
            h1 { font-size: 22px; }
            .grid-container { 
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .anime-card { 
                padding: 6px;
                border-radius: 8px;
            }
            .anime-card img { 
                border-radius: 6px; 
                margin-bottom: 6px;
            }
            .anime-title { 
                font-size: 13px;
                margin-bottom: 6px;
            }
            .link-btn { 
                padding: 3px 6px;
                font-size: 10px; 
                border-radius: 10px;
            }
            .search-container { margin-bottom: 20px; }
            #searchInput { padding: 8px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <h1>🎬 樱花动漫</h1>
    <p class="subtitle">点击卡片下方的标签即可跳转观看</p>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 输入动漫名称搜索...">
    </div>

    <div class="grid-container" id="animeGrid">
        
        <div class="anime-card">
            <img src="images/哭泣少女乐队-封面.jpg" alt="哭泣少女乐队封面">
            <h3 class="anime-title">【60帧】哭泣少女乐队</h3>
            <div class="link-group">
                <a href="https://www.acfun.cn/a/aa6147213" target="_blank" class="link-btn">📺 A站观看</a>
                <a href="https://www.mfuns.net/video/61328" target="_blank" class="link-btn pc-version">💻 MFuns电脑</a>
                <a href="https://m.mfuns.net/video/61328" target="_blank" class="link-btn mobile-version">📱 MFuns手机</a>
            </div>
        </div>

        <div class="anime-card">
            <img src="images/穹庐下的魔女-封面.jpg" alt="穹庐下的魔女封面">
            <h3 class="anime-title">【4K】穹庐下的魔女</h3>
            <div class="link-group">
                <a href="https://www.bilibili.com/video/BV1xMMY6xEPo" target="_blank" class="link-btn">📺 B站观看</a>
                <a href="https://www.acfun.cn/a/aa6147210" target="_blank" class="link-btn">📺 A站观看</a>
                <a href="" class="link-btn mobile-version">📱 MFuns手机</a>
            </div>
        </div>

        <div class="anime-card">
            <img src="images/命运石之门-封面.jpg" alt="命运石之门封面">
            <h3 class="anime-title">命运石之门</h3>
            <div class="link-group">
                <a href="https://www.acfun.cn/a/aa6147474" target="_blank" class="link-btn">📺 A站观看</a>
                <a href="" class="link-btn pc-version">💻 MFuns电脑</a>
                <a href="" class="link-btn mobile-version">📱 MFuns手机</a>
            </div>
        </div>

        <div class="anime-card">
            <img src="images/死亡笔记-封面.jpg" alt="死亡笔记封面">
            <h3 class="anime-title">死亡笔记</h3>
            <div class="link-group">
                <a href="https://www.acfun.cn/a/aa6147473" target="_blank" class="link-btn">📺 A站观看</a>
                <a href="" class="link-btn pc-version">💻 MFuns电脑</a>
                <a href="" class="link-btn mobile-version">📱 MFuns手机</a>
            </div>
        </div>
        
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.link-btn').forEach(btn => {
                const href = btn.getAttribute('href')?.trim() || '';
                const isInvalid = 
                    href === '' || 
                    href === '#' || 
                    href.includes('这里') || 
                    href.includes('放') ||
                    href.includes('占位符');
                
                if (isInvalid) {
                    btn.style.display = 'none';
                }
            });

            const searchInput = document.getElementById('searchInput');
            const cards = document.querySelectorAll('.anime-card');

            searchInput.addEventListener('input', function() {
                const keyword = this.value.toLowerCase().trim();
                cards.forEach(card => {
                    const title = card.querySelector('.anime-title').innerText.toLowerCase();
                    card.style.display = title.includes(keyword) ? 'flex' : 'none';
                });
            });

            const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            document.querySelectorAll('.pc-version').forEach(btn => {
                if (isMobile) btn.style.display = 'none';
            });
            
            document.querySelectorAll('.mobile-version').forEach(btn => {
                if (!isMobile) btn.style.display = 'none';
            });
        });
    </script>
</body>
</html>
