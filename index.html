<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000">
    <title>櫻花动漫 - 番剧索引</title>
    <style>
        /* 基础重置与旧版B站网页风格设定 */
        body {
            margin: 0; padding: 0; background-color: #f6f6f6; color: #333;
            font-family: Arial, "Microsoft YaHei", "微软雅黑", SimSun, sans-serif;
            font-size: 12px; line-height: 1.5;
            overflow-x: auto;
        }
        a { color: #333; text-decoration: none; }
        a:hover { color: #f00; text-decoration: underline; }
        ul, li { margin: 0; padding: 0; list-style: none; }
        input, button { font-family: inherit; outline: none; }

        #wrapper {
            width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            border-left: 1px solid #e2e2e2;
            border-right: 1px solid #e2e2e2;
            padding: 0 10px 20px 10px;
            min-height: 800px;
            box-shadow: 0 0 5px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        /* 顶部 Header */
        .header {
            padding: 10px 0; display: flex; justify-content: space-between;
            align-items: flex-end; border-bottom: 1px solid #e2e2e2;
        }
        .logo-area { display: flex; align-items: center; }
        .logo {
            font-size: 32px; font-weight: bold; color: #ff6699;
            font-family: "Comic Sans MS", cursive, sans-serif;
            letter-spacing: -1px; text-shadow: 2px 2px 0 #ffccdd;
        }

        /* 搜索框 */
        .search-area { display: flex; flex-direction: row; align-items: center; padding-bottom: 5px; flex-wrap: nowrap; }
        .search-area input {
            border: 1px solid #cccccc; padding: 4px 8px; width: 220px; height: 28px;
            box-sizing: border-box; background: #fff; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);
        }
        .search-area button {
            background: #4a90e2; color: #fff; border: 1px solid #3672bc;
            padding: 0 15px; margin-left: -1px; cursor: pointer; height: 28px; box-sizing: border-box; white-space: nowrap;
        }
        .search-area button:hover { background: #3672bc; }

        /* 导航栏 */
        .nav {
            height: 34px; background: linear-gradient(to bottom, #fff, #f1f1f1);
            border-bottom: 1px solid #ddd; border-top: 1px solid #ddd;
            margin-bottom: 15px; display: flex; align-items: center; padding: 0 10px;
        }
        .nav a {
            color: #333; font-weight: bold; padding: 0 25px;
            line-height: 34px; display: inline-block; cursor: pointer;
        }
        .nav a:hover { background: #fff; color: #f00; text-decoration: none; }
        .nav a.active { color: #00a1d6; }

        /* 主体双栏 */
        .main-container { display: flex; gap: 20px; width: 100%; }
        .content-left { width: 720px; flex-shrink: 0; }
        .sidebar-right { width: 240px; flex-shrink: 0; }

        .section-title {
            border-bottom: 2px solid #00a1d6; padding-bottom: 5px; margin-bottom: 10px;
            font-size: 14px; font-weight: bold; color: #333;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .section-title span { font-size: 12px; color: #999; font-weight: normal; }

        /* 筛选折叠与筛选区 */
        .filter-toggle { text-align: right; font-size: 12px; color: #333; cursor: pointer; margin-bottom: 5px; user-select: none; }
        .filter-toggle:hover { text-decoration: underline; }
        .filter-area { background: #f9f9f9; border: 1px solid #e2e2e2; padding: 8px 10px; margin-bottom: 15px; }
        .filter-area.hidden { display: none; }
        .filter-row { display: flex; align-items: flex-start; padding: 3px 0; border-bottom: 1px dashed #eee; }
        .filter-row:last-child { border-bottom: none; }
        .filter-label { color: #999; width: 45px; flex-shrink: 0; line-height: 22px; }
        .filter-options { flex: 1; display: flex; flex-wrap: wrap; }
        .filter-option {
            color: #333; padding: 0 8px; line-height: 22px;
            cursor: pointer; border-radius: 2px; margin-right: 5px;
        }
        .filter-option:hover { color: #f00; text-decoration: underline; }
        .filter-option.active { background: #00a1d6; color: #fff; font-weight: bold; }
        .filter-option.active:hover { color: #fff; text-decoration: none; }

        /* 视频卡片网格 - 强制每行4个 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }
        .video-card { width: 100%; cursor: pointer; }
        .video-card:hover .title { color: #f00; text-decoration: underline; }
        .cover-box {
            width: 100%; height: 96px; border: 1px solid #ccc; padding: 2px;
            background: #fff; position: relative; margin-bottom: 4px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1); box-sizing: border-box;
        }
        .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cover-box .duration {
            position: absolute; right: 2px; bottom: 2px;
            background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; padding: 0 3px; line-height: 14px;
        }
        .cover-box .badge {
            position: absolute; left: 2px; top: 2px;
            background: #ff6699; color: #fff; font-size: 10px; padding: 0 3px; line-height: 14px; border-radius: 2px;
        }
        .cover-box .badge.blue { background: #00a1d6; }

        .card-info { font-size: 12px; }
        .card-info .title {
            display: block; color: #333; line-height: 16px;
            height: 32px; overflow: hidden; margin-bottom: 2px; word-break: break-all;
        }
        .stats { color: #999; font-size: 11px; display: flex; justify-content: space-between; margin-top: 2px; }

        /* 更多按钮 */

            text-align: center; background: #f9f9f9; border: 1px solid #ddd;

        }
        .load-more-btn:hover { background: #00a1d6; color: #fff; border-color: #00a1d6; }

        /* 右侧边栏 */
        .sidebar-box { border: 1px solid #e2e2e2; margin-bottom: 15px; background: #fff; }
        .sidebar-header { background: #f6f6f6; border-bottom: 1px solid #e2e2e2; padding: 6px 10px; font-weight: bold; color: #333; }
        .sidebar-content { padding: 10px; }
        .online-info { font-size: 11px; color: #666; line-height: 20px; }
        .online-info span { color: #00a1d6; font-weight: bold; }

        .rank-list li { display: flex; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .rank-list li:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .rank-num {

        .rank-num.n1 { background: #ff6699; } .rank-num.n2 { background: #ff9933; } .rank-num.n3 { background: #ffcc33; }
        .rank-list img { width: 50px; height: 32px; object-fit: cover; margin-right: 8px; border: 1px solid #ddd; flex-shrink: 0; }
        .rank-title { flex: 1; font-size: 12px; line-height: 16px; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: #333; }

        .footer a { color: #666; margin: 0 5px; }

        /* 空状态 */

        .empty-state p { margin-bottom: 15px; }
        .empty-state button { padding: 4px 15px; background: #00a1d6; color: #fff; border: none; cursor: pointer; border-radius: 2px; }

        /* 弹窗样式 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }

        .modal-header { background: #f6f6f6; border-bottom: 1px solid #e2e2e2; padding: 10px 15px; font-weight: bold; font-size: 14px; color: #333; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { cursor: pointer; color: #999; font-size: 16px; line-height: 1; }
        .modal-close:hover { color: #f00; }
        .modal-body { padding: 15px; }
        .modal-btn { display: block; width: 100%; padding: 8px 0; margin-bottom: 10px; text-align: center; background: #f9f9f9; border: 1px solid #ddd; border-radius: 2px; color: #333; cursor: pointer; font-size: 13px; box-sizing: border-box; }

        #backToTop:hover { background: #ddd; color: #333; text-decoration: none; }

        /* ==================== 新番表三列布局 ==================== */
        .bangumi-panel {

            background: #fff;
            border: 1px solid #e2e2e2;
            margin-top: 25px;

        .bangumi-left {

        .bangumi-left-title { font-size: 14px; font-weight: bold; color: #333; padding-bottom: 5px; border-bottom: 2px solid #00a1d6; margin-bottom: 10px; }
        .bangumi-left-title span { font-size: 12px; color: #999; font-weight: normal; }
        .bangumi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .bangumi-item { cursor: pointer; }
        .bangumi-item:hover .title { color: #f00; text-decoration: underline; }
        .bangumi-cover { width: 100%; height: 76px; position: relative; margin-bottom: 4px; border: 1px solid #ccc; }
        .bangumi-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .bangumi-cover .time { position: absolute; right: 3px; bottom: 3px; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; padding: 0 3px; line-height: 14px; }
        .bangumi-item .title { font-size: 12px; color: #333; line-height: 16px; height: 32px; overflow: hidden; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .bangumi-item .meta { font-size: 11px; color: #999; display: flex; justify-content: space-between; }

        .bangumi-center {
            width: 180px;
            flex-shrink: 0;
            border-right: 1px solid #e2e2e2;
            padding: 8px;
            box-sizing: border-box;
        }
        .tab-header { display: flex; justify-content: center; margin-bottom: 8px; }
        .tab-item { padding: 4px 8px; cursor: pointer; font-size: 12px; font-weight: bold; color: #333; position: relative; white-space: nowrap; }
        .tab-item.active { color: #333; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .rank-item { display: flex; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #eee; cursor: pointer; }
        .rank-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .rank-item img { width: 48px; height: 30px; object-fit: cover; margin-right: 6px; border: 1px solid #ddd; flex-shrink: 0; }
        .rank-info { flex: 1; font-size: 12px; min-width: 0; }
        .rank-info .title { color: #333; line-height: 16px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-info .meta { color: #999; font-size: 11px; display: flex; gap: 8px; }
        .more-link { text-align: right; font-size: 12px; margin-top: 6px; padding-top: 4px; }
        .more-link a { color: #333; }
        .more-link a:hover { color: #f00; text-decoration: underline; }

        .bangumi-right {
            width: 180px;
            flex-shrink: 0;
            padding: 8px;
            box-sizing: border-box;
        }
        .schedule-week { display: flex; margin-bottom: 8px; gap: 2px; }
        .schedule-week .day-tab {
            flex: 1;
            text-align: center;
            padding: 3px 0;

        }
        .schedule-week .day-tab.active { background: #ff6699; color: #fff; font-weight: bold; }
        .schedule-list { padding-left: 2px; }
        .schedule-list li { font-size: 12px; line-height: 20px; color: #333; display: flex; justify-content: space-between; cursor: pointer; border-bottom: 1px dotted #eee; padding: 2px 0; }
        .schedule-list li:last-child { border-bottom: none; }

        /* 主页推荐样式 */
        .home-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #333; border-bottom: 2px solid #00a1d6; padding-bottom: 5px; }

        .rank-page-item img { width: 100px; height: 65px; object-fit: cover; margin: 0 10px; border: 1px solid #ddd; }
    </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // ===== 0. 读取数据 =====
    const animeData = window.ANIME_DATA || [];
    const CONFIG = window.SITE_CONFIG || {};

    const HOME_TITLES       = CONFIG.homeTitles || [];
    const EXCLUDE_FROM_INDEX= CONFIG.excludeFromIndex || [];
    const TOP_RATE_ORDER    = CONFIG.topRateOrder || [];
    const NEW_POST_ORDER    = CONFIG.newPostOrder || [];
    const SCHEDULE_DATA     = CONFIG.schedule || [];
    const TOP_N             = CONFIG.topN || 15;

    // 动画页数据（排除主页专属的）
    const animeGridData = animeData.filter(item => !EXCLUDE_FROM_INDEX.includes(item.title));

    // 占位图（封面加载失败时用）
    const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="96">' +
        '<rect width="100%" height="100%" fill="#f0f0f0"/>' +
        '<text x="50%" y="50%" font-size="13" fill="#bbb" text-anchor="middle" dominant-baseline="middle">暂无封面</text></svg>'
    );

    // 全局兜底：任何图片加载失败自动替换
    document.addEventListener('error', function (e) {
        const t = e.target;
        if (t && t.tagName === 'IMG' && !t.dataset.fallback) {
            t.dataset.fallback = '1';
            t.src = PLACEHOLDER;
        }
    }, true);

    const watchModal = document.getElementById('watchModal');
    const modalBody = document.getElementById('modalBody');
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    const formatNumber = (num) => num > 10000 ? (num / 10000).toFixed(1) + '万' : num;
    const getAnimeByTitle = (title) => animeData.find(item => item.title === title);

    // ===== 1. 导航切换 =====
    const navHome = document.getElementById('navHome');
    const navAnime = document.getElementById('navAnime');
    const navSpecial = document.getElementById('navSpecial');
    const viewHome = document.getElementById('viewHome');
    const viewAnime = document.getElementById('viewAnime');
    const viewSpecial = document.getElementById('viewSpecial');
    const viewRank = document.getElementById('viewRank');

    const NAV_MAP = {
        navHome: viewHome,
        navAnime: viewAnime,
        navSpecial: viewSpecial,
        navRank: viewRank
    };

    function switchNav(activeId) {
        [navHome, navAnime, navSpecial].forEach(n => n && n.classList.remove('active'));
        const activeNav = document.getElementById(activeId);
        if (activeNav && activeNav.classList.contains('nav-link')) activeNav.classList.add('active');
        // 排行榜是二级页面，没有对应导航项时保持“动画”高亮
        if (activeId === 'navRank' && navAnime) navAnime.classList.add('active');

        [viewHome, viewAnime, viewSpecial, viewRank].forEach(v => v.style.display = 'none');
        const target = NAV_MAP[activeId];
        if (target) target.style.display = 'block';
    }
    if (navHome) navHome.onclick = () => switchNav('navHome');
    if (navAnime) navAnime.onclick = () => switchNav('navAnime');
    if (navSpecial) navSpecial.onclick = () => switchNav('navSpecial');
    document.querySelectorAll('.goRankPage').forEach(btn => btn.onclick = () => switchNav('navRank'));

    // ===== 2. 观看链接与弹窗 =====
    function getAvailableLinks(anime) {
        const links = [];
        const L = anime.links || {};
        if (L.a) links.push({ name: 'A站观看', url: L.a });
        if (L.b) links.push({ name: 'B站观看', url: L.b });
        if (L.mfunsPc || L.mfunsMobile) {
            const mfunsUrl = isMobile ? (L.mfunsMobile || L.mfunsPc) : (L.mfunsPc || L.mfunsMobile);
            if (mfunsUrl) links.push({ name: `MFuns观看 (${isMobile ? '手机' : '电脑'})`, url: mfunsUrl });
        }
        return links;
    }

    function openAnimeDetail(title) {
        const anime = getAnimeByTitle(title);
        if (!anime) return;
        const links = getAvailableLinks(anime);
        if (links.length === 0) {
            alert('暂无观看地址');
        } else if (links.length === 1) {
            window.open(links[0].url, '_blank');
        } else {
            modalBody.innerHTML = links.map(l =>
                `<a href="${l.url}" target="_blank" class="modal-btn">${l.name}</a>`
            ).join('');
            watchModal.style.display = 'block';
        }
    }
    watchModal.onclick = function (e) { if (e.target === this) this.style.display = 'none'; };

    // ===== 3. 筛选逻辑 =====
    const SPECIAL_TAGS = ['4K', '60帧', '禁', 'HDR'];
    const QUALITY_TAGS = ['4K', '60帧', 'HDR'];
    const filters = { type: [], quality: [], year: [], month: [] };
    let cards = [];
    let displayLimit = 16;
    const totalAnime = animeGridData.length;

    function buildFilterGroup(containerId, key, values) {
        const box = document.getElementById(containerId);
        box.innerHTML = `<span class="filter-option active" data-value="全部">全部</span>` +
            values.map(v => `<span class="filter-option" data-value="${v}">${v}</span>`).join('');

        box.onclick = function (e) {
            const btn = e.target.closest('.filter-option');
            if (!btn) return;
            const val = btn.dataset.value;
            const allBtn = box.querySelector('[data-value="全部"]');

            if (val === '全部') {
                filters[key] = [];
                box.querySelectorAll('.filter-option').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
            } else {
                allBtn.classList.remove('active');
                const idx = filters[key].indexOf(val);
                if (idx > -1) { filters[key].splice(idx, 1); btn.classList.remove('active'); }
                else { filters[key].push(val); btn.classList.add('active'); }
                if (filters[key].length === 0) allBtn.classList.add('active');
            }
            applyFilters();
        };
    }

    function initFilters() {
        const typeSet = new Set(), qualitySet = new Set(), yearSet = new Set(), monthSet = new Set();
        animeGridData.forEach(a => {
            (a.tags || []).forEach(t => {
                if (QUALITY_TAGS.includes(t)) qualitySet.add(t);
                else typeSet.add(t);
            });
            if (a.year) yearSet.add(a.year);
            if (a.month) monthSet.add(a.month);
        });

        const types = Array.from(typeSet);
        const banIdx = types.indexOf('禁');
        if (banIdx > -1) types.splice(banIdx, 1);
        types.sort();
        if (banIdx > -1) types.unshift('禁');

        buildFilterGroup('typeOptions', 'type', types);
        buildFilterGroup('qualityOptions', 'quality', Array.from(qualitySet).sort());
        buildFilterGroup('yearOptions', 'year', Array.from(yearSet).sort((a, b) => parseInt(b) - parseInt(a)));
        buildFilterGroup('monthOptions', 'month', Array.from(monthSet).sort((a, b) => parseInt(a) - parseInt(b)));
    }

    // ===== 4. 渲染番剧网格 =====
    function renderAnimeGrid() {
        const displayData = animeGridData.slice(0, displayLimit);

        document.getElementById('animeGrid').innerHTML = displayData.map((anime, i) => {
            const badgeHTML = (anime.tags || [])
                .filter(t => SPECIAL_TAGS.includes(t))
                .map(t => {
                    const cls = (t === '4K' || t === 'HDR') ? '' : (t === '60帧' ? 'blue' : '');
                    return `<span class="badge ${cls}">${t}</span>`;
                }).join('');

            return `<div class="video-card" data-index="${i}">
                <div class="cover-box">
                    <img src="${anime.cover}" alt="${anime.title}" loading="lazy">${badgeHTML}
                    <span class="duration">${anime.duration || '24:00'}</span>
                </div>
                <div class="card-info">
                    <a href="javascript:;" class="title">${anime.title}</a>
                    <div class="stats">
                        <span>▶ ${formatNumber(anime.views || 0)}</span>
                        <span>💬 ${formatNumber(anime.comments || 0)}</span>
                    </div>
                </div>
            </div>`;
        }).join('');

        cards = Array.from(document.querySelectorAll('#animeGrid .video-card'));
        cards.forEach(card => {
            card.onclick = function () {
                openAnimeDetail(displayData[Number(this.dataset.index)].title);
            };
        });

        const moreBtnArea = document.getElementById('moreBtnArea');
        if (totalAnime > displayLimit) {
            moreBtnArea.innerHTML = `<div class="load-more-btn" id="loadMoreBtn">点击查看更多 (剩余 ${totalAnime - displayLimit} 部)</div>`;
            document.getElementById('loadMoreBtn').onclick = function () {
                displayLimit = totalAnime;
                renderAnimeGrid();
            };
        } else {
            moreBtnArea.innerHTML = '';
        }
        applyFilters();
    }

    function applyFilters() {
        const keywords = document.getElementById('searchInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        let visible = 0;

        cards.forEach(card => {
            const anime = animeGridData[Number(card.dataset.index)];
            if (!anime) return;

            const haystack = [anime.title, ...(anime.alias || []), ...(anime.tags || []), anime.year, anime.month]
                .join(' ').toLowerCase();

            const match =
                keywords.every(k => haystack.includes(k)) &&
                (!filters.type.length    || filters.type.some(t => (anime.tags || []).includes(t))) &&
                (!filters.quality.length || filters.quality.some(q => (anime.tags || []).includes(q))) &&
                (!filters.year.length    || filters.year.includes(anime.year)) &&
                (!filters.month.length   || filters.month.includes(anime.month));

            card.style.display = match ? 'block' : 'none';
            if (match) visible++;
        });

        document.getElementById('resultCount').textContent = `共 ${visible} 部`;
        document.getElementById('emptyState').style.display = visible === 0 ? 'block' : 'none';
    }

    renderAnimeGrid();

    // ===== 5. 右侧最热门 =====
    document.getElementById('rankList').innerHTML = animeData
        .slice()
        .sort((a, b) => (b.views || 0) - (a.views || 0))
        .slice(0, TOP_N)
        .map((anime, index) => `
            <li data-title="${anime.title}">
                <span class="rank-num ${index < 3 ? 'n' + (index + 1) : ''}">${index + 1}</span>
                <img src="${anime.cover}">
                <a href="javascript:;" class="rank-title">${anime.title}</a>
            </li>
        `).join('');

    document.querySelectorAll('#rankList li').forEach(li => {
        li.onclick = () => openAnimeDetail(li.dataset.title);
    });

    // ===== 6. 新番面板 =====
    function renderBangumiPanel() {
        // 左侧随机 6 部
        const randomAnimes = [...animeGridData].sort(() => 0.5 - Math.random()).slice(0, 6);
        document.getElementById('animeBangumiGrid').innerHTML = randomAnimes.map(anime => `
            <div class="bangumi-item" data-title="${anime.title}">
                <div class="bangumi-cover">
                    <img src="${anime.cover}" alt="${anime.title}">
                    <span class="time">${anime.duration || '24:00'}</span>
                </div>
                <div class="title">[${anime.month || ''}] ${anime.title}</div>
                <div class="meta">
                    <span>▶ ${formatNumber(anime.views || 0)}</span>
                    <span>💬 ${formatNumber(anime.comments || 0)}</span>
                </div>
            </div>
        `).join('');

        document.querySelectorAll('#animeBangumiGrid .bangumi-item').forEach(item => {
            item.onclick = () => openAnimeDetail(item.dataset.title);
        });

        const buildRankItem = (title) => {
            const anime = getAnimeByTitle(title);
            if (!anime) return '';
            return `<div class="rank-item" data-title="${title}">
                <img src="${anime.cover}">
                <div class="rank-info">
                    <div class="title">${title}</div>
                    <div class="meta">
                        <span>▶ ${formatNumber(anime.views || 0)}</span>
                        <span>💬 ${formatNumber(anime.comments || 0)}</span>
                    </div>
                </div>
            </div>`;
        };

        document.getElementById('animeTopRateList').innerHTML = TOP_RATE_ORDER.map(buildRankItem).join('');
        document.getElementById('animeNewPostList').innerHTML = NEW_POST_ORDER.map(buildRankItem).join('');

        document.querySelectorAll('.bangumi-center .rank-item').forEach(item => {
            item.onclick = () => openAnimeDetail(item.dataset.title);
        });

        // Tab 切换
        document.querySelectorAll('.bangumi-center .tab-item').forEach(tab => {
            tab.onclick = function () {
                document.querySelectorAll('.bangumi-center .tab-item').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.bangumi-center .tab-content').forEach(c => c.classList.remove('active'));
                const id = 'tab' + this.dataset.tab.charAt(0).toUpperCase() + this.dataset.tab.slice(1);
                const el = document.getElementById(id);
                if (el) el.classList.add('active');
            };
        });

        // 放送表
        const todayIdx = new Date().getDay();            // 0=周日
        const todayDayIndex = todayIdx === 0 ? 6 : todayIdx - 1; // 周一=0 ... 周日=6

        document.getElementById('scheduleWeek').innerHTML = SCHEDULE_DATA
            .map((d, i) => `<span class="day-tab ${i === todayDayIndex ? 'active' : ''}" data-index="${i}">${d.day}</span>`)
            .join('');

        const renderScheduleList = (idx) => {
            const data = SCHEDULE_DATA[idx];
            if (!data) return;
            document.getElementById('animeScheduleList').innerHTML = data.items.map(item => `
                <li data-title="${item.name}"><span>${item.name}</span><span class="ep">${item.ep}</span></li>
            `).join('');

            document.querySelectorAll('#animeScheduleList li').forEach(li => {
                li.onclick = () => openAnimeDetail(li.dataset.title);
            });
        };

        renderScheduleList(todayDayIndex);

        document.querySelectorAll('.day-tab').forEach(tab => {
            tab.onclick = function () {
                document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderScheduleList(Number(this.dataset.index));
            };
        });
    }
    renderBangumiPanel();

    // ===== 7. 评分排行榜页面 =====
    const sortedRank = [...animeData].sort((a, b) => (b.score || 0) - (a.score || 0));
    document.getElementById('rankPageList').innerHTML = sortedRank.map((anime, index) => `
        <div class="rank-page-item" data-title="${anime.title}">
            <div style="width:30px; text-align:center; font-weight:bold; font-size:16px; color:${index < 3 ? '#ff6699' : '#999'};">${index + 1}</div>
            <img src="${anime.cover}">
            <div style="flex:1;">
                <div style="font-size:14px; font-weight:bold; color:#333; margin-bottom:5px;">${anime.title}</div>
                <div style="color:#ff6600; font-size:13px; margin-bottom:3px;">评分：${anime.score ? anime.score.toFixed(1) : '暂无评分'}</div>
                <div style="color:#999; font-size:12px;">${(anime.tags || []).join(' / ')} · ${anime.year}年${anime.month}</div>
            </div>
        </div>
    `).join('');

    document.querySelectorAll('.rank-page-item').forEach(item => {
        item.onclick = () => openAnimeDetail(item.dataset.title);
    });

    // ===== 8. 主页推荐 =====
    function renderHomePage() {
        const container = document.getElementById('homeGrid');
        container.innerHTML = HOME_TITLES.map(title => {
            const anime = getAnimeByTitle(title);
            if (!anime) return '';
            return `<div class="video-card" data-title="${anime.title}">
                <div class="cover-box">
                    <img src="${anime.cover}">
                    <span class="duration">${anime.duration || '24:00'}</span>
                </div>
                <div class="card-info">
                    <a href="javascript:;" class="title">${anime.title}</a>
                    <div class="stats">
                        <span>▶ ${formatNumber(anime.views || 0)}</span>
                        <span>💬 ${formatNumber(anime.comments || 0)}</span>
                    </div>
                </div>
            </div>`;
        }).join('');

        container.querySelectorAll('.video-card').forEach(card => {
            card.onclick = () => openAnimeDetail(card.dataset.title);
        });
    }
    renderHomePage();

    // ===== 9. 搜索 / 重置 / 折叠 =====
    initFilters();

    const searchInput = document.getElementById('searchInput');
    searchInput.oninput = () => {
        clearTimeout(window.searchTimer);
        window.searchTimer = setTimeout(applyFilters, 200);
    };
    document.getElementById('searchBtn').onclick = () => {
        switchNav('navAnime');
        applyFilters();
    };

    document.getElementById('resetAll').onclick = () => {
        searchInput.value = '';
        filters.type = []; filters.quality = []; filters.year = []; filters.month = [];
        initFilters();
        applyFilters();
    };

    document.getElementById('filterToggleBtn').onclick = function () {
        const panel = document.getElementById('filterPanel');
        const hidden = panel.classList.toggle('hidden');
        this.innerHTML = hidden ? '<span>展开筛选索引 ▼</span>' : '<span>收起筛选索引 ▲</span>';
    };

    // ===== 10. 回到顶部 =====
    window.onscroll = () => {
        document.getElementById('backToTop').style.display = window.scrollY > 300 ? 'block' : 'none';
    };
    document.getElementById('backToTop').onclick = (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };
});
</script>
</body>
</html>
