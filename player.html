<script>
const API_BASE = 'https://api.imomoe.dpdns.org';

const params = new URLSearchParams(location.search);
const videoId = params.get('id');
const title = params.get('title') || '';

if (!videoId) {
    document.getElementById('status').textContent = '缺少视频 ID，请从首页点进来';
} else {
    if (title) {
        document.title = title + ' - 櫻花动漫';
        document.getElementById('pageTitle').textContent = title;
    }

    fetch(API_BASE + '/api/play/' + videoId)
        .then(r => r.json())
        .then(data => {
            if (!data.ok || !data.urls || !data.urls.length) {
                document.getElementById('status').textContent = '未找到视频：' + (data.error || '未知错误');
                return;
            }
            setupPlayer(data.urls);
        })
        .catch(err => {
            document.getElementById('status').textContent = '获取失败：' + err.message;
        });
}

function setupPlayer(urls) {
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const qualityList = document.getElementById('qualityList');

    // 识别清晰度（不含 60 帧）
    function getQuality(url) {
        if (url.includes('-hd.mp4')) return { name: '高清 1080P', level: 90 };
        if (url.includes('-sd.mp4')) return { name: '标清 720P', level: 60 };
        if (url.includes('-ld.mp4')) return { name: '流畅 360P', level: 30 };
        if (url.includes('.mp4')) return { name: '默认', level: 50 };
        return { name: '未知', level: 10 };
    }

    // 打标签 + 按清晰度降序
    const sorted = urls
        .map(u => ({ url: u, q: getQuality(u) }))
        .sort((a, b) => b.q.level - a.q.level);

    // 同名去重（保留最前面的，即最高清）
    const seen = new Set();
    const unique = [];
    for (const item of sorted) {
        if (!seen.has(item.q.name)) {
            seen.add(item.q.name);
            unique.push(item);
        }
    }

    console.log('排序后的清晰度：', unique.map(x => x.q.name));

    function playAt(item, btn) {
        const proxy = API_BASE + '/api/video-proxy?url=' + encodeURIComponent(item.url);
        video.src = proxy;
        status.style.display = 'none';
        info.style.display = 'block';
        document.getElementById('videoTitle').textContent = title || '视频 ' + videoId;
        document.getElementById('videoMeta').textContent = '视频来源：MFuns · 当前清晰度：' + item.q.name;
        video.play().catch(() => {});

        if (btn) {
            qualityList.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
        }
    }

    unique.forEach((item, i) => {
        const btn = document.createElement('button');
        btn.className = 'quality-btn' + (i === 0 ? ' on' : '');
        btn.textContent = item.q.name;
        btn.onclick = () => playAt(item, btn);
        qualityList.appendChild(btn);
    });

    // 默认播放最高清
    playAt(unique[0]);
}
</script>
