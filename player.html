<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放 - 櫻花动漫</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.6 "Microsoft YaHei",Arial,sans-serif; background:#0d0d0d; color:#ddd; }
.header {
    background:#1a1a1a; padding:12px 20px;
    display:flex; align-items:center; gap:16px;
    border-bottom:1px solid #333;
}
.header a { color:#00a1d6; text-decoration:none; font-weight:bold; }
.header h1 { font-size:16px; color:#fff; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wrap { max-width:1200px; margin:0 auto; padding:16px; }
.video-box {
    background:#000; border-radius:6px; overflow:hidden;
    position:relative; aspect-ratio:16/9;
}
video { width:100%; height:100%; display:block; background:#000; }
.info { margin-top:14px; padding:14px 18px; background:#1a1a1a; border-radius:6px; }
.info h2 { font-size:15px; color:#fff; margin-bottom:8px; }
.info .meta { font-size:12px; color:#888; }
.status { padding:40px 0; text-align:center; color:#666; }
.quality-list { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.quality-btn {
    padding:5px 12px; background:#2a2a2a; color:#ccc; border:1px solid #444;
    border-radius:3px; cursor:pointer; font-size:12px;
}
.quality-btn:hover { background:#333; color:#fff; }
.quality-btn.on { background:#00a1d6; color:#fff; border-color:#00a1d6; }
</style>
</head>
<body>

<div class="header">
    <a href="./index.html">← 返回首页</a>
    <h1 id="pageTitle">加载中...</h1>
</div>

<div class="wrap">
    <div class="video-box">
        <video id="video" controls playsinline preload="metadata"></video>
    </div>
    <div class="status" id="status">正在获取视频地址...</div>
    <div class="info" id="info" style="display:none;">
        <h2 id="videoTitle"></h2>
        <div class="meta" id="videoMeta"></div>
        <div class="quality-list" id="qualityList"></div>
    </div>
</div>

<script>
const API_BASE = 'https://api.imomoe.dpdns.org';

const params = new URLSearchParams(location.search);
const videoId = params.get('id');
const title = params.get('title') || '';

if (!videoId) {
    document.getElementById('status').textContent = '缺少视频 ID，请从首页点进来';
} else {
    if (title) {
        document.title = title + ' - 櫻花动漫';
        document.getElementById('pageTitle').textContent = title;
    }

    fetch(API_BASE + '/api/play/' + videoId)
        .then(r => r.json())
        .then(data => {
            if (!data.ok || !data.urls || !data.urls.length) {
                document.getElementById('status').textContent = '未找到视频：' + (data.error || '未知错误');
                return;
            }
            setupPlayer(data.urls);
        })
        .catch(err => {
            document.getElementById('status').textContent = '获取失败：' + err.message;
        });
}

function setupPlayer(urls) {
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const qualityList = document.getElementById('qualityList');

    // 用 URL 后缀区分清晰度
    function guessQuality(url) {
        if (url.includes('-hd.mp4')) return '高清';
        if (url.includes('-sd.mp4')) return '标清';
        if (url.includes('-hd') && url.includes('60')) return '60帧高清';
        return '默认';
    }

    function playAt(url) {
        const proxy = API_BASE + '/api/video-proxy?url=' + encodeURIComponent(url);
        video.src = proxy;
        status.style.display = 'none';
        info.style.display = 'block';
        document.getElementById('videoTitle').textContent = title || '视频 ' + videoId;
        document.getElementById('videoMeta').textContent = '视频来源：MFuns · 共 ' + urls.length + ' 个清晰度';
        video.play().catch(() => {});
    }

    urls.forEach((u, i) => {
        const btn = document.createElement('button');
        btn.className = 'quality-btn' + (i === 0 ? ' on' : '');
        btn.textContent = guessQuality(u) + ' ' + (i + 1);
        btn.onclick = () => {
            qualityList.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
            playAt(u);
        };
        qualityList.appendChild(btn);
    });

    playAt(urls[0]);
}
</script>

</body>
</html>
