<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORS 测试</title>
<style>
body {
    font:15px/1.7 -apple-system,"Microsoft YaHei",sans-serif;
    background:#1a1a1a; color:#eee;
    padding:20px; margin:0;
}
h1 { color:#00a1d6; font-size:18px; }
.box {
    background:#252525; border-radius:8px;
    padding:16px; margin-top:16px;
    word-break:break-all;
}
.ok   { border-left:4px solid #22aa55; }
.err  { border-left:4px solid #f66; }
.pending { border-left:4px solid #ffcc33; }
.title { font-weight:bold; margin-bottom:8px; font-size:16px; }
.content { font-size:13px; color:#bbb; line-height:1.6; }
pre { background:#0d0d0d; padding:10px; border-radius:4px; overflow:auto; font-size:12px; color:#8f8; }
button {
    width:100%; padding:14px; background:#00a1d6; color:#fff;
    border:none; border-radius:8px; font-size:16px;
    font-weight:bold; cursor:pointer; margin-top:10px;
}
button:active { background:#0088b8; }
</style>
</head>
<body>

<h1>🔍 CORS 直连测试</h1>
<div class="content">点击下面按钮，检测视频 CDN 是否允许你的网站直接跨域访问。</div>

<div class="box pending" id="result1">
    <div class="title">测试 1：m3u8 跨域</div>
    <div class="content" id="c1">等待测试...</div>
</div>

<button onclick="testM3u8()">开始测试</button>

<div class="box" id="result2" style="display:none">
    <div class="title">测试 2：m3u8 内容</div>
    <div class="content" id="c2"></div>
</div>

<script>
const M3U8_URL = 'https://bkqiuqiu.xn--vhq3x51dn9bivas49nfps.com/within/playaddr/getaddr.m3u8?vcode=TPVCODE22287b787ebe8b7a925292d65a11083a&definition=1080P&vcodec=libx265&authentication=7ab432042524357137e19ace5cbc0340';

async function testM3u8() {
    const box1 = document.getElementById('result1');
    const c1 = document.getElementById('c1');
    const box2 = document.getElementById('result2');
    const c2 = document.getElementById('c2');

    box1.className = 'box pending';
    c1.textContent = '请求中...';
    box2.style.display = 'none';

    try {
        const res = await fetch(M3U8_URL);
        const text = await res.text();

        // 能拿到内容 = CORS 通过
        box1.className = 'box ok';
        c1.innerHTML = '✅ <b>CORS 通过！</b><br>HTTP ' + res.status + '，返回 ' + text.length + ' 字节';

        box2.style.display = 'block';
        c2.innerHTML = '<pre>' + text.slice(0, 800).replace(/</g, '&lt;') + '</pre>';
    } catch (e) {
        box1.className = 'box err';
        c1.innerHTML = '❌ <b>CORS 失败</b><br>' + e.message;
    }
}
</script>

</body>
</html>
