<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放器测试</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.6 "Microsoft YaHei",Arial,sans-serif; background:#0d0d0d; color:#ddd; padding:20px; }
.box { max-width:1000px; margin:0 auto; }
h1 { color:#00a1d6; margin-bottom:20px; font-size:20px; }
.row { display:flex; gap:10px; margin-bottom:20px; }
input { flex:1; padding:10px 14px; border:1px solid #333; background:#1a1a1a; color:#fff; border-radius:4px; font-size:14px; }
input:focus { border-color:#00a1d6; outline:none; }
button { padding:10px 24px; background:#00a1d6; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:14px; font-weight:bold; }
button:hover { background:#0088b8; }
button:disabled { background:#444; cursor:not-allowed; }
video { width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; display:block; }
.log { background:#1a1a1a; border:1px solid #333; border-radius:4px; padding:12px 16px; margin-top:16px; font-family:Consolas,monospace; font-size:12px; color:#aaa; white-space:pre-wrap; max-height:300px; overflow:auto; }
.log .ok { color:#22aa55; }
.log .err { color:#f66; }
.log .info { color:#00a1d6; }
</style>
</head>
<body>
<div class="box">
    <h1>🎬 播放器测试</h1>

    <div class="row">
        <input type="text" id="vid" placeholder="输入视频 ID，例如 61328" value="61328">
        <button id="btn">播放</button>
    </div>

    <video id="video" controls playsinline></video>

    <div class="log" id="log">等待输入视频 ID...</div>
</div>

<script>
const API_BASE = 'https://api.imomoe.dpdns.org';
const logEl = document.getElementById('log');
const video = document.getElementById('video');
const btn = document.getElementById('btn');

function log(msg, cls) {
    const time = new Date().toLocaleTimeString();
    const line = '[' + time + '] ' + msg + '\n';
    if (cls) {
        logEl.innerHTML += '<span class="' + cls + '">' + line + '</span>';
    } else {
        logEl.textContent += line;
    }
    logEl.scrollTop = logEl.scrollHeight;
}

btn.onclick = async () => {
    const vid = document.getElementById('vid').value.trim();
    if (!vid) { alert('请输入视频 ID'); return; }

    logEl.textContent = '';
    video.src = '';
    btn.disabled = true;
    btn.textContent = '加载中...';

    log('开始请求：' + API_BASE + '/api/play/' + vid, 'info');

    try {
        const res = await fetch(API_BASE + '/api/play/' + vid);
        log('HTTP 状态码：' + res.status);

        const data = await res.json();
        log('返回数据：' + JSON.stringify(data).slice(0, 500));

        if (!data.ok || !data.urls || !data.urls.length) {
            log('❌ 没有拿到视频地址：' + (data.error || '未知'), 'err');
            if (data.raw) log('原始返回：' + data.raw.slice(0, 300));
            return;
        }

        log('✅ 拿到 ' + data.urls.length + ' 个地址', 'ok');
        data.urls.forEach((u, i) => log('  [' + (i+1) + '] ' + u.slice(0, 120) + '...'));

        const url = data.urls[0];
        const proxyUrl = API_BASE + '/api/video-proxy?url=' + encodeURIComponent(url);
        log('代理地址：' + proxyUrl, 'info');

        video.src = proxyUrl;
        video.load();
        video.play().catch(e => log('播放被阻止：' + e.message));

    } catch (err) {
        log('❌ 请求失败：' + err.message, 'err');
    } finally {
        btn.disabled = false;
        btn.textContent = '播放';
    }
};

video.onloadedmetadata = () => log('✅ 视频元数据加载成功，时长 ' + video.duration.toFixed(1) + ' 秒', 'ok');
video.onerror = () => log('❌ 视频加载失败，error code: ' + (video.error?.code || 'unknown'), 'err');
video.oncanplay = () => log('✅ 视频可以播放了', 'ok');
</script>
</body>
</html>
